<title>Évaluation CAG — 75 CRs</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1B3A5C;--navy-lt:#254D7A;
  --pm-bg:#DBEAFE;--pm-text:#1D4ED8;--pm-border:#93C5FD;
  --mr-bg:#FCE7F3;--mr-text:#BE185D;--mr-border:#F9A8D4;
  --border:#E2E8F0;--bg:#FFFFFF;--bg2:#F8FAFC;
  --fg:#0F172A;--fg2:#475569;--fg3:#94A3B8;
  --sel-bg:#1E293B;--sel-text:#fff;
  --ok:#16A34A;--ok-bg:#DCFCE7;--ok-border:#86EFAC;
  --warn:#D97706;--warn-bg:#FEF3C7;--warn-border:#FDE68A;
  --err:#DC2626;--err-bg:#FEE2E2;--err-border:#FCA5A5;
  --page-bg:#E8EEF5;
}
html,body{height:100%;font-family:"Inter",system-ui,sans-serif;font-size:14px;background:var(--page-bg);color:var(--fg)}

/* ── Registration ── */
.screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.reg-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:40px;width:100%;max-width:460px;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.reg-logo{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.reg-dot{width:40px;height:40px;background:var(--navy);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;flex-shrink:0}
.reg-title{font-weight:700;font-size:1.125rem}
.reg-sub{font-size:.8125rem;color:var(--fg2);margin-top:2px}
.fg{margin-bottom:18px}
.fg label{display:block;font-size:.6875rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--fg2);margin-bottom:6px}
.fg input{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;background:var(--bg2);font-family:inherit;font-size:.9375rem;color:var(--fg);transition:border-color .15s}
.fg input:focus{outline:none;border-color:var(--navy)}
.role-row{display:flex;gap:10px}
.rbtn{flex:1;padding:14px 8px;border:2px solid var(--border);border-radius:8px;background:var(--bg2);font-family:inherit;font-size:.875rem;font-weight:500;cursor:pointer;text-align:center;line-height:1.4;color:var(--fg);transition:all .15s}
.rbtn:hover{border-color:#94A3B8}
.rbtn.pm.sel{background:var(--pm-bg);border-color:var(--pm-text);color:var(--pm-text)}
.rbtn.mr.sel{background:var(--mr-bg);border-color:var(--mr-text);color:var(--mr-text)}
.btn-go{width:100%;padding:13px;background:var(--navy);color:#fff;border:none;border-radius:8px;font-family:inherit;font-size:1rem;font-weight:600;cursor:pointer;margin-top:8px;transition:opacity .15s}
.btn-go:disabled{opacity:.35;cursor:not-allowed}
.btn-go:not(:disabled):hover{opacity:.85}
.reg-err{background:#FEE2E2;border:1px solid #FCA5A5;border-radius:8px;padding:10px 14px;color:#991B1B;font-size:.875rem;margin-top:12px;display:none}

/* ── App shell ── */
#app{display:flex;flex-direction:column;height:100%;overflow:hidden}

/* ── Header ── */
.hdr{background:#fff;border-bottom:1px solid var(--border);padding:0 20px;height:56px;display:flex;align-items:center;gap:14px;flex-shrink:0}
.hdr-ttl{font-weight:700;font-size:.9375rem;color:var(--fg);white-space:nowrap}
.hdr-user{font-size:.8125rem;color:var(--fg2);white-space:nowrap}
.hdr-role-chip{font-size:.75rem;font-weight:700;border-radius:20px;padding:3px 10px;white-space:nowrap}
.hdr-role-chip.pm{background:var(--pm-bg);color:var(--pm-text);border:1px solid var(--pm-border)}
.hdr-role-chip.mr{background:var(--mr-bg);color:var(--mr-text);border:1px solid var(--mr-border)}
.hdr-mid{flex:1}
.hdr-prog{font-size:.8125rem;color:var(--fg2);white-space:nowrap}
.hdr-prog strong{color:var(--fg);font-weight:600}
.btn-logout{padding:6px 11px;border:1.5px solid var(--border);border-radius:7px;background:#fff;font-family:inherit;font-size:.9375rem;color:var(--fg2);cursor:pointer;transition:all .12s}
.btn-logout:hover{border-color:#94A3B8;color:var(--fg)}

/* ── Dashboard ── */
#dashboard{flex:1;overflow-y:auto;padding:24px}
.dash-title{font-size:1.125rem;font-weight:700;margin-bottom:6px}
.dash-sub{font-size:.875rem;color:var(--fg2);margin-bottom:20px}
.cr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.cr-card{background:#fff;border:1.5px solid var(--border);border-radius:10px;padding:14px 16px;cursor:pointer;transition:all .15s;position:relative}
.cr-card:hover{border-color:var(--navy);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.cr-card.done{border-color:var(--ok-border);background:var(--ok-bg)}
.cr-card.pm-done{border-color:var(--warn-border);background:var(--warn-bg)}
.cr-card.waiting{opacity:.6;cursor:default}
.cr-card-id{font-weight:700;font-size:.9375rem;color:var(--navy);margin-bottom:4px}
.cr-card-name{font-size:.8125rem;color:var(--fg2);margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr-card-status{font-size:.75rem;font-weight:600;display:flex;align-items:center;gap:5px}
.cr-card.done .cr-card-status{color:var(--ok)}
.cr-card.pm-done .cr-card-status{color:var(--warn)}
.cr-card.waiting .cr-card-status{color:var(--fg3)}
.cr-card:not(.done):not(.pm-done):not(.waiting) .cr-card-status{color:var(--fg3)}

/* ── Eval view ── */
#eval-view{flex:1;display:flex;flex-direction:column;overflow:hidden}
.eval-hdr{background:#fff;border-bottom:1px solid var(--border);padding:0 16px;height:48px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.eval-back{padding:5px 10px;border:1.5px solid var(--border);border-radius:7px;background:#fff;font-family:inherit;font-size:.8125rem;cursor:pointer;transition:all .12s}
.eval-back:hover{border-color:#94A3B8}
.eval-cr-id{font-weight:700;font-size:.9375rem;color:var(--navy)}
.eval-hdr-mid{flex:1}
.ftab-group{display:flex;border:1.5px solid var(--border);border-radius:7px;overflow:hidden}
.ftab{padding:5px 13px;background:#fff;border:none;font-family:inherit;font-size:.8125rem;font-weight:500;color:var(--fg2);cursor:pointer;transition:all .12s;white-space:nowrap}
.ftab:not(:last-child){border-right:1px solid var(--border)}
.ftab.on{background:var(--navy);color:#fff}
.prog-label{font-size:.8125rem;color:var(--fg2);white-space:nowrap}
.prog-label strong{color:var(--fg);font-weight:600}
.btn-submit-cr{padding:6px 16px;background:#16A34A;color:#fff;border:none;border-radius:7px;font-family:inherit;font-size:.8125rem;font-weight:700;cursor:pointer;white-space:nowrap;transition:all .15s}
.btn-submit-cr:hover:not(:disabled){opacity:.85}
.btn-submit-cr:disabled{background:var(--fg3);cursor:not-allowed;opacity:.55}

/* ── Panels ── */
.panels{display:flex;flex:1;min-height:0;overflow:hidden}
.pl{width:42%;min-width:280px;border-right:1px solid var(--border);overflow:hidden;padding:14px 14px 0;flex-shrink:0;background:var(--page-bg);display:flex;flex-direction:column}
.pl-sticky{flex-shrink:0;padding-bottom:10px}
.pl-scroll{flex:1;min-height:0;overflow-y:auto;padding-bottom:40px}
.pl-card{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.section-hdr{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:11px 16px;background:#fff;user-select:none;transition:background .12s}
.section-hdr:hover{background:#F8FAFC}
.section-hdr-left{display:flex;align-items:center;gap:8px}
.section-hdr-icon{font-size:.875rem}
.section-hdr-title{font-size:.8125rem;font-weight:600;color:var(--fg)}
.section-hdr-id{font-size:.8125rem;font-weight:700;color:var(--navy)}
.section-arr{font-size:.65rem;color:var(--fg3);transition:transform .2s}
.section-arr.open{transform:rotate(90deg)}
.section-body{padding:0 16px 14px;display:none;border-top:1px solid var(--border)}
.section-body.open{display:block}
.prof-grid{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding-top:10px;font-size:.8125rem}
.pk{color:var(--fg2);font-weight:500;white-space:nowrap}
.pv{color:var(--fg)}
.cr-text-body{padding:14px 16px;font-family:"Lora",Georgia,serif;font-size:.9375rem;line-height:1.7;color:var(--fg)}
.cr-text-body p{margin-bottom:.75em}

/* PM panel for MR */
.pm-panel{background:var(--pm-bg);border:1px solid var(--pm-border);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.pm-panel-title{font-size:.8125rem;font-weight:700;color:var(--pm-text);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.pm-grid{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:.8125rem}
.pm-crit-name{color:var(--fg2)}
.pm-crit-val{font-weight:700;color:var(--pm-text)}
.pm-crit-note{font-size:.75rem;color:var(--fg2);grid-column:1/-1;margin-bottom:4px;padding-left:8px;border-left:2px solid var(--pm-border)}
.pm-loading{font-size:.8125rem;color:var(--fg3);padding:8px 0;font-style:italic}
.pm-waiting{background:#FEF3C7;border:1px solid #FDE68A;border-radius:8px;padding:10px 14px;font-size:.8125rem;color:#92400E}

/* Right panel */
.pr{flex:1;min-width:0;overflow-y:auto;padding:14px;background:#fff}
.bloc{margin-bottom:12px;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.bloc-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--border)}
.bloc-name{font-size:.8125rem;font-weight:700;color:var(--fg)}
.bloc-cnt{font-size:.75rem;color:var(--fg3)}
.bloc-body{padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.crit{background:#F8FAFC;border:1px solid var(--border);border-left:3px solid var(--border);border-radius:8px;padding:12px 14px;transition:border-color .15s}
.crit.done.pm{border-color:var(--pm-border);border-left-color:var(--pm-text)}
.crit.done.mr{border-color:var(--mr-border);border-left-color:var(--mr-text)}
.crit.locked{opacity:.5;background:#F1F5F9}
.crit.locked .rb{cursor:not-allowed}
.crit-main{display:flex;align-items:flex-start;gap:12px}
.crit-left{flex:1;min-width:0}
.crit-top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.crit-name{font-size:.875rem;font-weight:600;color:var(--fg)}
.role-chip{font-size:.6875rem;font-weight:700;border-radius:4px;padding:1px 7px}
.role-chip.pm{background:var(--pm-bg);color:var(--pm-text)}
.role-chip.mr{background:var(--mr-bg);color:var(--mr-text)}
.lock-badge{font-size:.7rem;color:var(--fg3);background:#F1F5F9;border:1px solid var(--border);border-radius:4px;padding:1px 6px}
.crit-q{font-size:.8125rem;color:var(--fg2);line-height:1.5}
.rrow{display:flex;gap:5px;flex-wrap:wrap;flex-shrink:0}
.rb{width:44px;height:36px;border:1.5px solid var(--border);border-radius:6px;background:#fff;font-family:inherit;font-size:.875rem;font-weight:600;cursor:pointer;transition:all .12s;color:var(--fg2)}
.rb:hover:not(:disabled){border-color:var(--navy);color:var(--navy)}
.rb.on{background:var(--navy);border-color:var(--navy);color:#fff}
.note-desc{margin-top:8px;font-size:.8rem;color:var(--fg2);background:#EEF2FF;border-left:3px solid #6366F1;border-radius:0 6px 6px 0;padding:6px 10px;line-height:1.5}
.cmt-section{border-top:1px solid var(--border);padding:14px;margin-top:4px}
.cmt-section-hdr{font-size:.8125rem;font-weight:600;color:var(--fg2);margin-bottom:10px;text-transform:uppercase;letter-spacing:.05em}
.comments-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmt-label{font-size:.75rem;font-weight:600;color:var(--fg2);display:flex;align-items:center;gap:6px;margin-bottom:5px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.pm{background:var(--pm-text)}
.dot.mr{background:var(--mr-text)}
.cmt-ta{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;background:var(--bg2);font-family:inherit;font-size:.875rem;color:var(--fg);resize:vertical;min-height:72px;transition:border-color .15s}
.cmt-ta.pm:focus{outline:none;border-color:var(--pm-text)}
.cmt-ta.mr:focus{outline:none;border-color:var(--mr-text)}
.cmt-ta:disabled{opacity:.45;cursor:not-allowed;background:#F1F5F9;resize:none}

/* ── Overlay ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:200}
.overlay-card{background:#fff;border-radius:16px;padding:40px 36px;max-width:480px;width:90%;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.2)}
.overlay-icon{font-size:2.5rem;margin-bottom:12px}
.overlay-title{font-size:1.25rem;font-weight:700;color:var(--fg);margin-bottom:8px}
.overlay-sub{font-size:.9rem;color:var(--fg2);line-height:1.6;margin-bottom:18px}
.status-row{display:flex;align-items:center;gap:10px;background:#F8FAFC;border:1px solid var(--border);border-radius:8px;padding:10px 16px;margin-bottom:8px;font-size:.875rem;text-align:left}
.status-row .icon{font-size:1.1rem;flex-shrink:0}
.status-row.ok{border-color:var(--ok-border);background:var(--ok-bg);color:#166534}
.status-row.err{border-color:var(--err-border);background:var(--err-bg);color:#991B1B}
.status-row.pending{border-color:var(--warn-border);background:var(--warn-bg);color:#92400E}
.spin{display:inline-block;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.overlay-btn{padding:11px 28px;background:var(--navy);color:#fff;border:none;border-radius:8px;font-family:inherit;font-size:.9rem;font-weight:600;cursor:pointer;margin-top:8px}
.overlay-btn-sec{padding:11px 20px;background:#fff;color:var(--fg2);border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:.9rem;cursor:pointer;margin-top:8px;margin-left:8px}
</style>

<!-- ── Registration screen ── -->
<div id="reg" class="screen">
  <div class="reg-card">
    <div class="reg-logo">
      <div class="reg-dot">CAG</div>
      <div>
        <div class="reg-title">Évaluation humaine — 75 CRs</div>
        <div class="reg-sub">Phase principale · apertus70b METABRIC conservateur</div>
      </div>
    </div>
    <div class="fg">
      <label>Votre prénom</label>
      <input type="text" id="rname" placeholder="ex : Sophie" list="names-list" autocomplete="off">
      <datalist id="names-list">
        <option value="Sophie"><option value="Estelle"><option value="Veronica">
        <option value="Odile Brun"><option value="[MR2]">
      </datalist>
    </div>
    <div class="fg">
      <label>Votre rôle</label>
      <div class="role-row">
        <button class="rbtn pm" id="rbtn-pm" data-role="PM">Physicien<br>Médical</button>
        <button class="rbtn mr" id="rbtn-mr" data-role="MR">Médecin<br>Radiothérapeute</button>
      </div>
    </div>
    <button class="btn-go" id="gobtn" disabled>Commencer →</button>
    <div class="reg-err" id="reg-err"></div>
  </div>
</div>

<!-- ── App shell ── -->
<div id="app" style="display:none">
  <header class="hdr">
    <span class="hdr-ttl">Évaluation CAG</span>
    <span class="hdr-role-chip" id="hdr-role-chip"></span>
    <span class="hdr-user" id="hdr-user"></span>
    <div class="hdr-mid"></div>
    <span class="hdr-prog" id="hdr-prog"></span>
    <button class="btn-logout" id="btn-logout" title="Changer d'évaluateur">⇐</button>
  </header>

  <!-- Dashboard -->
  <div id="dashboard" style="display:none">
    <div class="dash-title" id="dash-title"></div>
    <div class="dash-sub" id="dash-sub"></div>
    <div class="cr-grid" id="cr-grid"></div>
  </div>

  <!-- Eval view -->
  <div id="eval-view" style="display:none">
    <div class="eval-hdr">
      <button class="eval-back" id="eval-back">← Tableau de bord</button>
      <span class="eval-cr-id" id="eval-cr-id"></span>
      <div class="eval-hdr-mid"></div>
      <div class="ftab-group">
        <button class="ftab on" id="ftab-all">Tous</button>
        <button class="ftab" id="ftab-pm">Physicien</button>
        <button class="ftab" id="ftab-mr">Radiothérapeute</button>
      </div>
      <span class="prog-label"><strong id="prog-n">0</strong>/<span id="prog-tot">0</span> critères</span>
      <button class="btn-submit-cr" id="btn-submit-cr" disabled>✓ Soumettre ce CR</button>
    </div>
    <div class="panels">
      <div class="pl">
        <div class="pl-sticky">
          <div class="pl-card">
            <div class="section-hdr" id="sh-prof">
              <div class="section-hdr-left">
                <span class="section-hdr-icon">👤</span>
                <span class="section-hdr-title">Profil patient</span>
                <span class="section-hdr-id" id="cr-title-prof">CR-01</span>
              </div>
              <span class="section-arr open" id="arr-prof">▶</span>
            </div>
            <div class="section-body open" id="body-prof">
              <div class="prof-grid" id="prof-grid"></div>
            </div>
          </div>
        </div>
        <div class="pl-scroll">
          <!-- PM answers panel (MR only) -->
          <div id="pm-answers-panel" style="display:none">
            <div class="pm-panel">
              <div class="pm-panel-title">🔵 Réponses du Physicien Médical</div>
              <div id="pm-answers-content"><span class="pm-loading">Chargement…</span></div>
            </div>
          </div>
          <!-- CR text -->
          <div class="pl-card">
            <div class="section-hdr" id="sh-cr">
              <div class="section-hdr-left">
                <span class="section-hdr-icon">📄</span>
                <span class="section-hdr-title">Compte rendu</span>
                <span class="section-hdr-id" id="cr-title">CR-01</span>
              </div>
              <span class="section-arr open" id="arr-cr">▶</span>
            </div>
            <div class="section-body open" id="body-cr">
              <div class="cr-text-body" id="cr-body"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="pr" id="criteria-container">
        <div id="criteria-area"></div>
        <div class="cmt-section">
          <div class="cmt-section-hdr">Commentaires généraux sur le CR</div>
          <div class="comments-row">
            <div>
              <div class="cmt-label"><span class="dot pm"></span>Commentaires PM</div>
              <textarea class="cmt-ta pm" id="cmt-pm" rows="3" placeholder="Observations libres (PM)…" oninput="saveCmt('pm')"></textarea>
            </div>
            <div>
              <div class="cmt-label"><span class="dot mr"></span>Commentaires MR</div>
              <textarea class="cmt-ta mr" id="cmt-mr" rows="3" placeholder="Observations libres (MR)…" oninput="saveCmt('mr')"></textarea>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Submit overlay -->
<div id="success-overlay" class="overlay" style="display:none">
  <div class="overlay-card">
    <div class="overlay-icon" id="overlay-icon">⏳</div>
    <div class="overlay-title" id="overlay-title">Envoi en cours…</div>
    <div class="overlay-sub" id="overlay-msg"></div>
    <div id="overlay-statuses"></div>
    <div style="margin-top:8px">
      <button class="overlay-btn" id="overlay-next" style="display:none">→ CR suivant</button>
      <button class="overlay-btn-sec" id="overlay-dash" style="display:none">Tableau de bord</button>
    </div>
  </div>
</div>

<script>
// ── Config ──────────────────────────────────────────────────
const AT_TOKEN="%%AT_TOKEN%%";
const AT_BASE="appCpDq5UMLxZidBX";
const AT_TABLE="tbl0Qd1ZYN7OiwXj7";
const AT_URL=`https://api.airtable.com/v0/${AT_BASE}/${AT_TABLE}`;
const SKEY = "cag_eval_main_v1";

// Evaluator assignments (0-indexed CR indices)
// Sophie PM : CR-01..25 (idx 0..24)  ↔  Odile Brun MR : CR-01..50 (idx 0..49)
// Estelle PM : CR-26..50 (idx 25..49) ↔  Odile Brun MR + [MR2] MR : CR-26..50 (idx 25..49)
// Veronica PM : CR-51..75 (idx 50..74) ↔  [MR2] MR : CR-26..75 (idx 25..74)
const ASSIGNMENTS = {
  "Sophie":     {role:"PM", crs:r(0,25),  pairedMR:["Odile Brun"]},
  "Estelle":    {role:"PM", crs:r(25,50), pairedMR:["Odile Brun","[MR2]"]},
  "Veronica":   {role:"PM", crs:r(50,75), pairedMR:["[MR2]"]},
  "Odile Brun": {role:"MR", crs:r(0,50),  pairedPM:{0:"Sophie",25:"Estelle"}},
  "[MR2]":      {role:"MR", crs:r(25,75), pairedPM:{25:"Estelle",50:"Veronica"}},
};

function r(a,b){const arr=[];for(let i=a;i<b;i++)arr.push(i);return arr;}

function getPairedMRs(name, crIdx){
  const a=ASSIGNMENTS[name];
  if(!a||a.role!=="PM") return [];
  return (a.pairedMR||[]);
}
function getPairedPM(name, crIdx){
  const a=ASSIGNMENTS[name];
  if(!a||a.role!=="MR") return null;
  // Find which PM covers this CR index
  const pm=a.pairedPM||{};
  const keys=Object.keys(pm).map(Number).sort((a,b)=>b-a);
  for(const k of keys){ if(crIdx>=k) return pm[k]; }
  return null;
}

const BLOCS = [
  {name:"1. Dosimétrie & Technique",  range:[0,2]},
  {name:"2. Volumes & Chirurgie",      range:[3,4]},
  {name:"3. Traitement systémique",    range:[5,5]},
  {name:"4. Hallucinations",           range:[6,8]},
  {name:"5. Contenu clinique",         range:[9,14]},
  {name:"6. Rédaction",               range:[15,17]},
  {name:"7. Cohérence & Impression",  range:[18,19]},
];

const SCALE_LABELS = {"1":"Pas du tout","2":"Partiellement","3":"Globalement","4":"Complètement","N/A":"N/A"};

// ── State ─────────────────────────────────────────────────────
const SKEY_MAIN = "cag_eval_main_v1";
let evalName="", evalRole="", cur=0, ratings={}, filter="all", submittedCRs={};
let myCRs=[], pmAnswersCache={};

// ── Persistence ───────────────────────────────────────────────
function save(){
  try{localStorage.setItem(SKEY_MAIN,JSON.stringify({evalName,evalRole,ratings,submittedCRs}));}catch(e){}
}
function loadState(){
  try{return JSON.parse(localStorage.getItem(SKEY_MAIN)||"null");}catch(e){return null;}
}

// ── Role helpers ──────────────────────────────────────────────
function myRoleCrit(){ return CRITERIA.filter(c=>c.role===evalRole); }
function myCrit(){
  if(filter==="all") return CRITERIA;
  if(filter==="PM") return CRITERIA.filter(c=>c.role==="PM");
  if(filter==="MR") return CRITERIA.filter(c=>c.role==="MR");
  return CRITERIA;
}

// ── Registration ──────────────────────────────────────────────
function selRole(btn){
  document.querySelectorAll(".rbtn").forEach(b=>b.classList.remove("sel"));
  btn.classList.add("sel");
  checkGo();
}
function checkGo(){
  const n=document.getElementById("rname").value.trim();
  const r=document.querySelector(".rbtn.sel");
  document.getElementById("gobtn").disabled=!n||!r;
}
function showErr(msg){
  const el=document.getElementById("reg-err");
  el.textContent=msg; el.style.display="block";
}

async function start(){
  const name=document.getElementById("rname").value.trim();
  const roleBtn=document.querySelector(".rbtn.sel");
  if(!name||!roleBtn) return;
  const role=roleBtn.dataset.role;
  const a=ASSIGNMENTS[name];
  if(!a){showErr("Prénom non reconnu. Vérifiez l'orthographe.");return;}
  if(a.role!==role){showErr(`${name} est enregistré(e) comme ${a.role}, pas ${role}.`);return;}
  document.getElementById("reg-err").style.display="none";
  evalName=name; evalRole=role;
  myCRs=a.crs;

  // 1. Charger l'état local (notes en cours, CRs soumis connus localement)
  const saved=loadState();
  if(saved&&saved.evalName===name&&saved.evalRole===role){
    ratings=saved.ratings||{}; submittedCRs=saved.submittedCRs||{};
  } else {
    ratings={}; submittedCRs={};
  }

  // 2. Synchroniser avec Airtable pour récupérer les CRs déjà soumis
  const btn=document.getElementById("gobtn");
  btn.disabled=true; btn.textContent="Vérification…";
  try{
    const formula=role==="PM"
      ?`{pm_evaluateur}="${name}"`
      :`AND({mr_evaluateur}="${name}",{statut}="Complet")`;
    const resp=await fetch(`${AT_URL}?filterByFormula=${encodeURIComponent(formula)}&fields%5B%5D=cr_id`,{
      headers:{"Authorization":`Bearer ${AT_TOKEN}`}
    });
    const data=await resp.json();
    (data.records||[]).forEach(rec=>{
      const crId=rec.fields?.cr_id;
      if(crId){const n=parseInt(crId.replace("CR-",""),10);if(!isNaN(n)&&n>=1) submittedCRs[n-1]=true;}
    });
    save();
  }catch(e){/* Airtable inaccessible : on continue avec l'état local */}
  btn.disabled=false; btn.textContent="Commencer →";
  launch();
}

function launch(){
  document.getElementById("reg").style.display="none";
  document.getElementById("app").style.display="flex";
  document.getElementById("hdr-user").textContent=evalName;
  const chip=document.getElementById("hdr-role-chip");
  chip.textContent=evalRole==="PM"?"Physicien Médical":"Médecin Radiothérapeute";
  chip.className="hdr-role-chip "+(evalRole==="PM"?"pm":"mr");
  document.getElementById("cmt-pm").disabled=(evalRole!=="PM");
  document.getElementById("cmt-mr").disabled=(evalRole!=="MR");
  showDashboard();
}

function logout(){
  if(!confirm("Revenir à l'identification ? La progression non soumise reste sauvegardée.")) return;
  evalName=""; evalRole=""; myCRs=[];
  document.getElementById("app").style.display="none";
  document.getElementById("reg").style.display="";
  document.getElementById("rname").value="";
  document.querySelectorAll(".rbtn").forEach(b=>b.classList.remove("sel"));
  checkGo();
  showView("none");
}

// ── Dashboard ─────────────────────────────────────────────────
function showView(v){
  document.getElementById("dashboard").style.display=v==="dashboard"?"block":"none";
  document.getElementById("eval-view").style.display=v==="eval"?"flex":"none";
}

function crStatus(idx){
  if(submittedCRs[idx]) return "done";
  const d=ratings[idx]||{};
  const mine=myRoleCrit();
  const done=mine.filter(c=>d[c.name]!=null).length;
  if(done>0) return "progress";
  return "none";
}

function showDashboard(){
  showView("dashboard");
  const total=myCRs.length;
  const done=myCRs.filter(i=>submittedCRs[i]).length;
  document.getElementById("dash-title").textContent=`Vos CRs — ${evalName} (${evalRole})`;
  document.getElementById("dash-sub").textContent=`${done}/${total} CRs soumis · ${total-done} restants`;
  document.getElementById("hdr-prog").innerHTML=`<strong>${done}</strong>/${total} soumis`;

  const grid=document.getElementById("cr-grid");
  grid.innerHTML="";
  for(const idx of myCRs){
    const cr=CRS[idx];
    const st=crStatus(idx);
    const submitted=!!submittedCRs[idx];
    const name=(cr.profile_text||"").split("\n").find(l=>l.startsWith("Nom"))||"";
    const nameVal=name.split(" : ")[1]||"";
    const card=document.createElement("div");
    card.className="cr-card"+(submitted?" done":st==="progress"?" pm-done":"");
    card.innerHTML=`<div class="cr-card-id">CR-${String(idx+1).padStart(2,"0")}</div>
      <div class="cr-card-name">${nameVal}</div>
      <div class="cr-card-status">${submitted?"✅ Soumis":st==="progress"?"🟡 En cours":"⬜ Non commencé"}</div>`;
    if(!submitted) card.addEventListener("click",()=>openCR(idx));
    grid.appendChild(card);
  }
}

// ── Eval view ─────────────────────────────────────────────────
async function openCR(idx){
  cur=idx;
  showView("eval");
  const num=`CR-${String(idx+1).padStart(2,"0")}`;
  document.getElementById("eval-cr-id").textContent=num;
  document.getElementById("cr-title").textContent=num;
  document.getElementById("cr-title-prof").textContent=num;
  // Always reset PM panel — show only for MR
  const pmPanel=document.getElementById("pm-answers-panel");
  pmPanel.style.display="none";
  document.getElementById("pm-answers-content").innerHTML=`<span class="pm-loading">Chargement…</span>`;
  renderLeft();
  renderRight();
  if(evalRole==="MR") await loadPMAnswers(idx);
}

function renderLeft(){
  const cr=CRS[cur];
  const lines=(cr.profile_text||"").split("\n").filter(Boolean);
  document.getElementById("prof-grid").innerHTML=lines.map(l=>{
    const [k,...rest]=l.split(" : ");
    return `<div class="pk">${k}</div><div class="pv">${rest.join(" : ")}</div>`;
  }).join("");
  document.getElementById("cr-body").innerHTML=md(cr.cr_text);
}

function md(txt){
  return txt.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
    .split(/\n\n+/).map(p=>`<p>${p.replace(/\n/g,"<br>")}</p>`).join("");
}

function renderRight(){
  const d=ratings[cur]||{};
  const vis=myCrit();
  let html="";
  for(const bloc of BLOCS){
    const [s,e]=bloc.range;
    const bCrits=CRITERIA.slice(s,e+1).filter(c=>vis.includes(c));
    if(!bCrits.length) continue;
    const done=bCrits.filter(c=>d[c.name]!=null).length;
    html+=`<div class="bloc"><div class="bloc-hdr"><span class="bloc-name">${bloc.name}</span><span class="bloc-cnt">${done}/${bCrits.length}</span></div><div class="bloc-body">`;
    for(const c of bCrits){
      const vals=c.scale==="1-4/NA"?["1","2","3","4","N/A"]:["1","2","3","4"];
      const val=d[c.name];
      const noteText=val!=null?(c.notes[val]||""):"";
      const noteLbl=val!=null?(SCALE_LABELS[val]||""):"";
      const isLocked=c.role!==evalRole;
      html+=`<div class="crit ${c.role.toLowerCase()}${val!=null?" done":""}${isLocked?" locked":""}" id="crit-${c.name.replace(/[^a-z0-9]/gi,'_')}">
        <div class="crit-main">
          <div class="crit-left">
            <div class="crit-top">
              <span class="crit-name">${c.name}</span>
              <span class="role-chip ${c.role.toLowerCase()}">${c.role}</span>
              ${isLocked?`<span class="lock-badge">🔒 réservé ${c.role}</span>`:""}
            </div>
            <div class="crit-q">${c.q}</div>
          </div>
          <div class="rrow">
            ${vals.map(v=>`<button class="rb${val===v?" on":""}" data-v="${v}" ${isLocked?"disabled":""} onclick='rate(${JSON.stringify(c.name)},"${v}")'>${v}</button>`).join("")}
          </div>
        </div>
        ${val!=null?`<div class="note-desc" data-v="${val}"><b>${val} · ${noteLbl}</b> — ${noteText}</div>`:""}
      </div>`;
    }
    html+="</div></div>";
  }
  document.getElementById("criteria-area").innerHTML=html;
  const d2=ratings[cur]||{};
  document.getElementById("cmt-pm").value=(d2._cmt_pm||"");
  document.getElementById("cmt-mr").value=(d2._cmt_mr||"");
  updateProg();
}

function rate(cname,val){
  const crit=CRITERIA.find(c=>c.name===cname);
  if(crit&&crit.role!==evalRole) return;
  if(!ratings[cur]) ratings[cur]={};
  const d=ratings[cur];
  if(d[cname]===val){delete d[cname];}else{d[cname]=val;}
  save();
  const id="crit-"+cname.replace(/[^a-z0-9]/gi,'_');
  const el=document.getElementById(id);
  if(el){
    const v=d[cname];
    const role=crit.role.toLowerCase();
    el.className=`crit ${role}`+(v!=null?" done":"");
    el.querySelectorAll(".rb").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
    let nd=el.querySelector(".note-desc");
    if(v!=null){
      const noteText=crit.notes[v]||"";
      const noteLbl=SCALE_LABELS[v]||"";
      if(!nd){nd=document.createElement("div");nd.className="note-desc";el.appendChild(nd);}
      nd.dataset.v=v;
      nd.innerHTML=`<b>${v} · ${noteLbl}</b> — ${noteText}`;
    } else if(nd){nd.remove();}
    const bEl=el.closest(".bloc-body");
    if(bEl){
      const bCrits=[...bEl.querySelectorAll(".crit")];
      const done=bCrits.filter(b=>b.classList.contains("done")).length;
      bEl.closest(".bloc").querySelector(".bloc-cnt").textContent=`${done}/${bCrits.length}`;
    }
  }
  updateProg();
}

function saveCmt(who){
  if(who==="pm"&&evalRole!=="PM") return;
  if(who==="mr"&&evalRole!=="MR") return;
  if(!ratings[cur]) ratings[cur]={};
  ratings[cur][`_cmt_${who}`]=document.getElementById(`cmt-${who}`).value;
  save();
}

function updateProg(){
  const d=ratings[cur]||{};
  const mine=myRoleCrit();
  const done=mine.filter(c=>d[c.name]!=null).length;
  document.getElementById("prog-n").textContent=done;
  document.getElementById("prog-tot").textContent=mine.length;
  const btn=document.getElementById("btn-submit-cr");
  btn.disabled=(done<mine.length);
  btn.title=done<mine.length?`Complétez les ${mine.length-done} critère(s) restant(s)`:"Prêt à soumettre";
}

function setFilter(f){
  filter=f;
  document.querySelectorAll(".ftab").forEach(b=>b.classList.remove("on"));
  document.getElementById("ftab-"+f).classList.add("on");
  renderRight();
}

function toggleSection(id){
  const body=document.getElementById("body-"+id);
  const arr=document.getElementById("arr-"+id);
  const open=body.classList.contains("open");
  body.classList.toggle("open",!open);
  arr.classList.toggle("open",!open);
}

// ── Airtable helpers ──────────────────────────────────────────
async function atFindRecord(crId,mrEval){
  const formula=mrEval
    ?`AND({cr_id}="${crId}",{mr_evaluateur}="${mrEval}")`
    :`AND({cr_id}="${crId}",{mr_evaluateur}="")`;
  const resp=await fetch(`${AT_URL}?filterByFormula=${encodeURIComponent(formula)}&maxRecords=1`,{
    headers:{"Authorization":`Bearer ${AT_TOKEN}`}
  });
  const data=await resp.json();
  return data.records?.[0]||null;
}

// ── PM answers (MR only) ──────────────────────────────────────
async function loadPMAnswers(crIdx){
  const panel=document.getElementById("pm-answers-panel");
  const content=document.getElementById("pm-answers-content");
  panel.style.display="block";
  content.innerHTML=`<span class="pm-loading">Chargement des réponses PM…</span>`;
  const crId=`CR-${String(crIdx+1).padStart(2,"0")}`;
  const cached=pmAnswersCache[crIdx];
  if(cached){renderPMAnswers(cached);return;}
  try{
    const rec=await atFindRecord(crId,evalName);
    if(rec?.fields?.pm_evaluateur){
      pmAnswersCache[crIdx]=rec.fields;
      renderPMAnswers(rec.fields);
    }else{
      content.innerHTML=`<div class="pm-waiting">⏳ Le Physicien Médical n'a pas encore soumis ce CR.<br>Vous pouvez commencer votre évaluation et soumettre quand PM aura terminé.</div>`;
    }
  }catch(e){
    content.innerHTML=`<div class="pm-waiting">⚠️ Impossible de charger les réponses PM. <a href="#" onclick="pmAnswersCache={};loadPMAnswers(${crIdx});return false;">Réessayer</a></div>`;
  }
}

function renderPMAnswers(data){
  const content=document.getElementById("pm-answers-content");
  const PM_CRITERIA_NAMES=["Dose totale","Fractionnement","Technique","Hall. dosimétriques","Terminologie"];
  let html=`<div style="font-size:.75rem;color:var(--fg2);margin-bottom:8px">Évalué par <strong>${data.pm_evaluateur}</strong></div>`;
  html+=`<div class="pm-grid">`;
  for(const name of PM_CRITERIA_NAMES){
    const val=data["pm_"+name]!=null?String(data["pm_"+name]):"—";
    const crit=CRITERIA.find(c=>c.name===name);
    const note=crit&&val!=="—"?(crit.notes[val]||""):"";
    html+=`<div class="pm-crit-name">${name}</div><div class="pm-crit-val">${val}</div>`;
    if(note) html+=`<div class="pm-crit-note">${note}</div>`;
  }
  if(data.pm_commentaire){
    html+=`<div class="pm-crit-name" style="margin-top:6px">Commentaire</div><div class="pm-crit-val" style="font-weight:400;color:var(--fg)">${data.pm_commentaire}</div>`;
  }
  html+=`</div>`;
  content.innerHTML=html;
}

// ── Submit ────────────────────────────────────────────────────
async function submitCR(){
  const mine=myRoleCrit();
  const d=ratings[cur]||{};
  const missing=mine.filter(c=>d[c.name]==null).length;
  if(missing>0){alert(`${missing} critère(s) manquant(s). Complétez avant de soumettre.`);return;}

  document.getElementById("overlay-icon").textContent="⏳";
  document.getElementById("overlay-title").textContent="Envoi en cours…";
  document.getElementById("overlay-msg").textContent="";
  document.getElementById("overlay-statuses").innerHTML="";
  document.getElementById("overlay-next").style.display="none";
  document.getElementById("overlay-dash").style.display="none";
  document.getElementById("success-overlay").style.display="flex";

  const crId=`CR-${String(cur+1).padStart(2,"0")}`;
  const ts=new Date().toISOString();
  addStatus("pending","<span class='spin'>⏳</span>","Envoi vers la base de données…","sheets-status");

  let ok=false;
  if(evalRole==="PM"){
    const pairedMRs=getPairedMRs(evalName,cur);
    let sent=0;
    for(const mrName of pairedMRs){
      const fields={cr_id:crId,statut:"PM_fait",pm_evaluateur:evalName,pm_timestamp:ts,mr_evaluateur:mrName,pm_commentaire:d._cmt_pm||""};
      for(const c of CRITERIA.filter(x=>x.role==="PM")) fields["pm_"+c.name]=toNum(d[c.name]);
      const s=await atSubmit(crId,mrName,fields);
      if(s) sent++;
    }
    ok=(sent===pairedMRs.length||pairedMRs.length===0);
    if(pairedMRs.length===0){
      const fields={cr_id:crId,statut:"PM_fait",pm_evaluateur:evalName,pm_timestamp:ts,mr_evaluateur:"",pm_commentaire:d._cmt_pm||""};
      for(const c of CRITERIA.filter(x=>x.role==="PM")) fields["pm_"+c.name]=toNum(d[c.name]);
      ok=await atSubmit(crId,"",fields);
    }
  } else {
    const fields={statut:"Complet",mr_evaluateur:evalName,mr_timestamp:ts,mr_commentaire:d._cmt_mr||""};
    for(const c of CRITERIA.filter(x=>x.role==="MR")) fields["mr_"+c.name]=toNum(d[c.name]);
    ok=await atSubmit(crId,evalName,fields);
  }

  const sRow=document.getElementById("sheets-status");
  if(sRow){
    if(ok){sRow.className="status-row ok";sRow.innerHTML="<span class='icon'>📊</span>Réponse enregistrée dans la base de données.";}
    else{sRow.className="status-row err";sRow.innerHTML="<span class='icon'>⚠️</span>Envoi échoué. Réessayez ou notez vos réponses.";}
  }

  if(ok){
    submittedCRs[cur]=true;
    save();
  }

  document.getElementById("overlay-icon").textContent=ok?"✅":"⚠️";
  document.getElementById("overlay-title").textContent=ok?"CR soumis !":"Soumission partielle";
  document.getElementById("overlay-msg").textContent=ok?`${crId} enregistré. Passez au suivant.`:"";

  // Find next CR
  const nextIdx=myCRs.find(i=>i>cur&&!submittedCRs[i]);
  if(nextIdx!==undefined){
    document.getElementById("overlay-next").style.display="inline-block";
    document.getElementById("overlay-next").onclick=()=>{document.getElementById("success-overlay").style.display="none";openCR(nextIdx);};
  }
  document.getElementById("overlay-dash").style.display="inline-block";
  document.getElementById("overlay-dash").onclick=()=>{document.getElementById("success-overlay").style.display="none";showDashboard();};
}

function toNum(v){
  if(v==null||v===""||v==="NA"||v==="N/A") return null;
  const n=Number(v); return isNaN(n)?null:n;
}

async function atSubmit(crId,mrEval,fields){
  try{
    const formula=mrEval
      ?`AND({cr_id}="${crId}",{mr_evaluateur}="${mrEval}")`
      :`AND({cr_id}="${crId}",{mr_evaluateur}="")`;
    const resp=await fetch(`${AT_URL}?filterByFormula=${encodeURIComponent(formula)}&maxRecords=1`,{
      headers:{"Authorization":`Bearer ${AT_TOKEN}`}
    });
    const found=await resp.json();
    const rec=found.records?.[0];
    const body=JSON.stringify({fields,typecast:true});
    const hdrs={"Authorization":`Bearer ${AT_TOKEN}`,"Content-Type":"application/json"};
    if(rec){
      const r=await fetch(`${AT_URL}/${rec.id}`,{method:"PATCH",headers:hdrs,body});
      const d=await r.json(); if(d.error) console.error("AT PATCH error:",d.error); return !d.error;
    }else{
      const r=await fetch(AT_URL,{method:"POST",headers:hdrs,body});
      const d=await r.json(); if(d.error) console.error("AT POST error:",d.error); return !d.error;
    }
  }catch(e){console.error("atSubmit exception:",e);return false;}
}

function addStatus(cls,icon,text,id=""){
  const div=document.createElement("div");
  div.className=`status-row ${cls}`;
  if(id) div.id=id;
  div.innerHTML=`<span class="icon">${icon}</span>${text}`;
  document.getElementById("overlay-statuses").appendChild(div);
}

ienne\nDate de naissance : 23/03/1960\nÂge au diagnostic : 58\nLatéralité : droit\nType histologique : carcinome lobulaire infiltrant\nCode OncoTree : ILC\nSous-type histologique : lobulaire\nGrade SBR : II\nSous-type PAM50 : Normal-like\nStatut ER : positifs\nStatut PR : positifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 62\nStade tumoral : non renseigné\nGanglions positifs : 6\nIndice de Nottingham : 5,12\nType de chirurgie : chirurgie conservatrice\nÉtat ménopausique : post-ménopausée\nChimiothérapie : oui\nHormonothérapie : oui"}, {"id": 5, "cr_text": "**Compte rendu de fin de traitement de radiothérapie**\n\nMadame LECONTE, née BRUNEL Laurence, âgée de 64 ans, a bénéficié d'une radiothérapie adjuvante suite à son diagnostic de carcinome canalaire infiltrant (IDC, ductal de type non spécifique (NST)) du sein droit, de grade SBR III, sous-type moléculaire Claudin-low, avec des récepteurs hormonaux négatifs (ER négatifs, PR négatifs) et HER2 négatifs. La tumeur mesurait 16 mm, le stade était I (T1 N0 M0), avec 0 ganglion(s) positif(s) et un indice de Nottingham de 4,03. Une chirurgie conservatrice avait été réalisée préalablement.\n\nLa radiothérapie a été initiée après une réunion de concertation pluridisciplinaire ayant validé cette stratégie thérapeutique. Un scanner dosimétrique a permis de définir précisément les volumes cibles (tissu mammaire restant, aires ganglionnaires axillaires, parasternales et supra-claviculaires) et les organes à risque (poumon, cœur). La dose totale délivrée sur le volume cible principal (CTV) a été de 50 Gray (Gy) en 25 fractions sur 33 jours, avec une dose moyenne de 2,0 Gy par fraction. Les contraintes dosimétriques ont été respectées : V20 Gy poumon droit de 14,5 % (seuil normal < 30 %) et dose moyenne cardiaque de 1,8 Gy (seuil normal < 4 Gy).\n\nDurant le traitement, Madame LECONTE a présenté une réaction cutanée modérée (grade 2 selon CTCAE v5.0) localisée au site irradié, gérée par application topique de crème hydratante et protection solaire. Aucune autre toxicité significative n'a été observée. À la fin du traitement, elle présentait un score fonctionnel OMS de 1, aucun signe de fibrose pulmonaire ou cardiaque n'était détectable. Son poids était stable, sans perte pondérale notable.\n\nEn l'absence d'indication à une hormonothérapie (en raison de l'absence de récepteurs hormonaux positifs) et de chimiothérapie (pas de chimiothérapie adjuvante prescrite), la surveillance ultérieure sera basée sur des examens cliniques réguliers, mammographie annuelle et IRM mammaire tous les deux ans. Des visites de suivi seront organisées tous les six mois pendant les trois premières années puis annuellement.\n\nJe certifie avoir réalisé ce traitement et atteste de sa bonne tolérance globale.\n\nSigné,\n\n[Nom Prénom] Oncologue Radiothérapeute\n[Date : 25/04/2017]", "profile_text": "Civilité : Madame\nNom : LECONTE, née BRUNEL Laurence\nDate de naissance : 04/06/1952\nÂge au diagnostic : 64\nLatéralité : droit\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : III\nSous-type PAM50 : Claudin-low\nStatut ER : négatifs\nStatut PR : négatifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 16\nStade tumoral : I\nGanglions positifs : 0\nIndice de Nottingham : 4,03\nType de chirurgie : chirurgie conservatrice\nÉtat ménopausique : post-ménopausée\nChimiothérapie : non\nHormonothérapie : non"}, {"id": 6, "cr_text": "Madame Gauthier, née Martin Sophie, âgée de 71 ans, a bénéficié d'une radiothérapie adjuvante suite à une chirurgie conservatrice pour un carcinome canalaire infiltrant (IDC, ductal de type non spécifique (NST)) du sein gauche. La tumeur mesurait 30 millimètres, était classée grade SBR II, exprimait les récepteurs hormonaux (ER positifs, PR positifs) et n'était pas surexprimant le récepteur HER2. Lors de la réunion de concertation pluridisciplinaire, il fut décidé que cette patiente bénéficierait d'une radiothérapie adjuvante après sa chirurgie conservatrice, en raison de son âge, de son état ménopausé, et de l'absence d'indication à une chimiothérapie. \n\nLa préparation du traitement comprenait un scanner dosimétrique réalisé le 15 mars 2020, permettant la planification précise des volumes cibles (tissu mammaire restant, aires ganglionnaires axillaires, et éventuellement médiastinaux selon les recommandations). La radiothérapie a été administrée sur un accélérateur linéaire de 6 MV, utilisant une technique de conformal radiation therapy (CRT) pour optimiser la dose délivrée à la cible tout en épargnant les tissus sains avoisinants. Les séances ont débuté le 2 avril 2020 et se sont achevées le 20 mai 2020, soit un total de 25 fractions sur 33 jours (étalement compatible avec 25 fractions, environ 19 jours calendaires).\n\nLa dose totale délivrée au volume cible principal (PTV) était de 50,4 Gy, répartie en 25 fractions de 2,02 Gy chacune, avec une dose maximale locale de 52,5 Gy. Les contraintes aux organes à risque ont été respectées : la dose moyenne au poumon droit était de 1,8 Gy (seuil maximal autorisé < 30 %) et celle au cœur gauche de 1,2 Gy (seuil maximal autorisé < 4 Gy). \n\nDurant le traitement, Madame Gauthier a présenté une réaction cutanée modérée (grade 2 CTCAE v5.0) caractérisée par une érythème et une desquamation, gérée par application topique de crème hydratante et protection solaire. Aucune toxicité tardive significative n'a été observée lors du bilan de fin de traitement effectué le 20 juin 2020. Elle présentait un score fonctionnel OMS de 1, sans perte de poids notable (poids stable à 62 kg). \n\nEn termes de suivi, elle continuera son hormonothérapie adjuvante par anastrozole (Arimidex®) pendant cinq ans, initiée dès la fin de la radiothérapie. Une surveillance régulière sera assurée, incluant des mammographies annuelles et des consultations oncologiques tous les six mois. \n\nJe reste à disposition pour toute information complémentaire concernant le suivi ou les questions relatives à ce traitement.\n\nSigné,\n\nDr [Nom Prénom], Oncologue Radiothérapeute\n\n[Signature]", "profile_text": "Civilité : Madame\nNom : GAUTHIER, née MARTIN Sophie\nDate de naissance : 26/05/1949\nÂge au diagnostic : 71\nLatéralité : gauche\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : II\nSous-type PAM50 : Luminal A\nStatut ER : positifs\nStatut PR : positifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 30\nStade tumoral : non renseigné\nGanglions positifs : 0\nIndice de Nottingham : 3,06\nType de chirurgie : chirurgie conservatrice\nÉtat ménopausique : post-ménopausée\nChimiothérapie : non\nHormonothérapie : oui"}, {"id": 7, "cr_text": "**Compte rendu de fin de traitement de radiothérapie**\n\nÀ l'attention du Dr [Nom du destinataire], \n[Adresse du service]\nDate : 13 février 2023\n\nObjet : Compte rendu de fin de traitement de radiothérapie pour Mme LAUNAY, née CARPENTIER Odette, née le 18 février 1981, âgée de 41 ans, présentant un carcinome canalaire infiltrant (IDC, ductal de type non spécifique (NST)) du sein gauche, grade SBR III, sous-type moléculaire Basal-like (Triple Négatif), ER négatifs, PR négatifs, HER2 négatifs, 17 mm, 1 ganglion(s) positif(s), indice de Nottingham 5,03.\n\nMadame LAUNAY, née CARPENTIER Odette, 41 ans, a bénéficié d'une radiothérapie adjuvante après une chirurgie conservatrice pour un carcinome canalaire infiltrant (IDC, ductal de type non spécifique (NST)) du sein gauche. La patiente était pré-ménopausée lors du diagnostic. Une chimiothérapie adjuvante a été administrée préalablement à la radiothérapie, conformément à la décision de la réunion de concertation pluridisciplinaire. Les traitements adjuvants ont été réalisés dans le cadre d’un protocole standard pour un cancer triple négatif.\n\nLa planification de la radiothérapie a été réalisée sur la base d'un scanner dosimétrique réalisé le 15 janvier 2023. La dose totale prescrite était de 50 Gray (Gy) délivrée en 25 fractions sur 33 jours, avec une dose quotidienne de 1,5 Gy. La technique employée était une radiothérapie conformationnelle tridimensionnelle (3D-CRT) utilisant un accélérateur linéaire. Les volumes cibles comprenaient le lit tumoral initial, le sein entier, ainsi que les aires ganglionnaires axillaires homolatérales jusqu'à l'aisselle. Des techniques de modulation d'intensité (IMRT) ont été utilisées pour optimiser la couverture tumorale tout en épargnant les organes à risque.\n\nConcernant les organes à risque, la dose moyenne au poumon droit a été maintenue inférieure à 30 %, avec une dose maximale de 25 % (seuil normal < 30 %). La dose moyenne au poumon gauche a été limitée à 20 % (seuil normal < 20 %). La dose moyenne cardiaque a été calculée pour rester inférieure à 4 Gy (seuil normal < 4 Gy).\n\nAu cours du traitement, la patiente a présenté quelques effets secondaires modérés, principalement des érythèmes cutanés de grade 2 (CTCAE v5.0, grade 2) et une fatigue légère (grade 1). Ces symptômes ont été gérés par des soins locaux (crème hydratante, repos) et une adaptation temporaire du planning de radiothérapie. Aucune complication majeure n’a été observée.\n\nAucun signe de pneumonie radique ou de cardiotoxicité n’a été détecté. Un contrôle scanographique post-thérapeutique effectué le 10 février 2023 a confirmé l’absence de complications tardives.\n\nEn conclusion, le traitement de radiothérapie s’est déroulé sans incident majeur, respectant les contraintes dosimétriques fixées. La patiente présente actuellement un score fonctionnel OMS de 1 (sans limitation fonctionnelle notable). Elle pèse 62 kg, stable depuis le début du traitement.\n\nLes suites thérapeutiques comprennent la poursuite de l’hormonothérapie adjuvante par tamoxifène pendant cinq ans, en accord avec son état pré-ménopausique. Une surveillance régulière sera effectuée tous les six mois durant les deux premières années, puis annuellement, incluant mammographie, échographie mammaire et examens biologiques.\n\nJe reste à votre disposition pour tout renseignement supplémentaire concernant cette prise en charge.\n\nBien cordialement,\n\nDr [Prénom Nom]\n\nOncologue Radiothérapeute\n\nSignature électronique : [signature]", "profile_text": "Civilité : Madame\nNom : LAUNAY, née CARPENTIER Odette\nDate de naissance : 18/02/1981\nÂge au diagnostic : 41\nLatéralité : gauche\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : III\nSous-type PAM50 : Basal-like (Triple Négatif)\nStatut ER : négatifs\nStatut PR : négatifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 17\nStade tumoral : non renseigné\nGanglions positifs : 1\nIndice de Nottingham : 5,03\nType de chirurgie : chirurgie conservatrice\nÉtat ménopausique : pré-ménopausée\nChimiothérapie : oui\nHormonothérapie : non"}, {"id": 8, "cr_text": "Madame MENDÈS, née JOLY Aimée, âgée de 73 ans, a bénéficié d'une radiothérapie adjuvante suite à sa mastectomie droite pour un carcinome canalaire infiltrant (IDC, ductal de type non spécifique (NST)) de grade SBR III, sous-type moléculaire Claudin-low, exprimant les récepteurs hormonaux (positifs pour les récepteurs aux œstrogènes et à la progestérone) et négatif pour le récepteur HER2. La tumeur mesurait 18 mm et aucun ganglion axillaire n'était atteint. Un indice de Nottingham de 4,04 a été calculé. \n\nLa décision de réaliser cette radiothérapie a été prise lors d'une réunion de concertation pluridisciplinaire, tenant compte de son état post-ménopausique et de l'absence de chimiothérapie préalable. Une préparation soignée a été effectuée incluant un scanner dosimétrique permettant de définir précisément les volumes cibles (tissu mammaire restant, cicatrice chirurgicale, aires ganglionnaires régionales) et les organes à risque (poumon, cœur). \n\nLa radiothérapie a été réalisée sur un accélérateur linéaire de particules, délivrant des faisceaux de photons de 6 MV. Les volumes cibles ont été définis selon les recommandations NCCN, avec une dose totale de 50 Gray (Gy) délivrée en 25 fractions sur 33 jours, soit une dose moyenne quotidienne de 1,5 Gy. La dose maximale au poumon droit était limitée à 20% de la V20 (seuil de tolérance < 30%) et celle au cœur à moins de 4 Gy (seuil de tolérance < 4 Gy côté gauche).\n\nDurant le traitement, Mme MENDÈS a présenté quelques effets secondaires légers (grade I-II CTCAE) : érythème cutané modéré (grade II) et fatigue (grade I). Ces symptômes ont été gérés par des conseils locaux et une adaptation temporaire du planning de radiothérapie. À la fin du traitement, elle présentait un score fonctionnel OMS de 1, stable, sans perte de poids significative (poids stable à 65 kg). \n\nÀ noter que l'hormonothérapie adjuvante par anastrozole (aromatase-inhibiteur) a été initiée pendant la radiothérapie, conforme à son statut hormonal et à l'avis de la RCP. Aucune thérapie ciblée anti-HER2 n'a été nécessaire en raison du statut HER2 négatif.\n\nEn conclusion, la radiothérapie adjuvante a été complétée sans complication majeure. La surveillance ultérieure comprendra des consultations régulières, des mammographies annuelles et des bilans sanguins tous les six mois. Nous recommandons également la poursuite de l'anastrozole pendant cinq ans.\n\nPour information, nous joignons ici les résultats du dernier contrôle dosimétrique montrant une bonne conformité aux objectifs prédéfinis.\n\nSigné,\n\nDr [Nom Prénom], Oncologue Radiothérapeute\n\nDate : 07/10/2020", "profile_text": "Civilité : Madame\nNom : MENDÈS, née JOLY Aimée\nDate de naissance : 03/12/1946\nÂge au diagnostic : 73\nLatéralité : droit\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : III\nSous-type PAM50 : Claudin-low\nStatut ER : positifs\nStatut PR : positifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 18\nStade tumoral : non renseigné\nGanglions positifs : 0\nIndice de Nottingham : 4,04\nType de chirurgie : mastectomie\nÉtat ménopausique : post-ménopausée\nChimiothérapie : non\nHormonothérapie : oui"}, {"id": 9, "cr_text": "**Compte rendu de fin de traitement de radiothérapie**\n\nMadame SALMON, née GALLET Simone, âgée de 46 ans, a bénéficié d'une radiothérapie adjuvante suite à son diagnostic de carcinome canalaire infiltrant (IDC, ductal de type non spécifique (NST)) du sein droit, confirmé par examen anatomopathologique. La tumeur mesurait 10 mm, était classée grade SBR III, exprimait un sous-type moléculaire basal-like (Triple Négatif), avec des récepteurs hormonaux (ER et PR) négatifs ainsi que des récepteurs HER2 négatifs. Elle présentait également 0 ganglion lymphatique axillaire atteint. L'indice de Nottingham était de 4,02. Une chirurgie conservatrice avait été réalisée précédemment. \n\nLa décision de réaliser une radiothérapie adjuvante a été prise lors d'une réunion de concertation pluridisciplinaire (RCP) en accord avec les recommandations actuelles pour cette situation clinique. Un scanner dosimétrique a été effectué le 15 janvier 2023 afin de définir précisément les volumes cibles et les organes à risque. La planification a été effectuée sur un accélérateur linéaire, utilisant une dose totale de 50 Gray (Gy) délivrée en 25 fractions, soit 2 Gy par séance, du 20 février 2023 au 20 mars 2023. Les volumes irradiés comprenaient le lit tumoral initial, le sein entier, ainsi que le creux sus-claviculaire et axillaire homolatéraux. \n\nLa dose moyenne au poumon droit a été maintenue inférieure à 20 % de sa volume pulmonaire total (V20 Gy < 20 %) et celle au cœur gauche a été limitée à moins de 4 Gy (dose moyenne cardiaque < 4 Gy). Aucune toxicité sévère n'a été observée durant le traitement, avec des effets secondaires limités à une fatigue modérée (grade 1 CTCAE) et une érythème cutané léger (grade 2 CTCAE) qui ont été gérés par application topique de crèmes émollientes et conseils de protection solaire. \n\nA l'issue du traitement, le score fonctionnel de l'Organisation Mondiale de la Santé (OMS) est resté inchangé, stable à 0. Le poids de Madame Salmon est demeuré stable pendant le traitement, sans perte significative. Aucun signe de complications tardives n'est noté à ce jour. \n\nEn termes de suivi, une surveillance régulière sera assurée par le service d'oncologie, incluant des mammographies annuelles et des examens cliniques tous les six mois. Il convient de noter que, étant donné le sous-type moléculaire basal-like (Triple Négatif) et l'absence d'indication à une hormonothérapie (en raison de l'absence de récepteurs hormonaux positifs), aucune hormonothérapie n'a été prescrite. De même, une thérapie ciblée anti-HER2 n'était pas indiquée vu le statut HER2 négatif. \n\nJe reste à disposition pour toutes questions supplémentaires concernant le suivi ou les options thérapeutiques futures.\n\n**Signé**\nDr [Nom Prénom], Oncologue Radiothérapeute\n[Date] 28/02/2023", "profile_text": "Civilité : Madame\nNom : SALMON, née GALLET Simone\nDate de naissance : 28/04/1972\nÂge au diagnostic : 46\nLatéralité : droit\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : III\nSous-type PAM50 : Basal-like (Triple Négatif)\nStatut ER : négatifs\nStatut PR : négatifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 10\nStade tumoral : non renseigné\nGanglions positifs : 0\nIndice de Nottingham : 4,02\nType de chirurgie : chirurgie conservatrice\nÉtat ménopausique : pré-ménopausée\nChimiothérapie : non\nHormonothérapie : non"}, {"id": 10, "cr_text": "Madame Delaluna, née le 06 juin 1974, âgée de 48 ans, a bénéficié d'une radiothérapie adjuvante suite à une chirurgie conservatrice pour un carcinome mixte ductal et lobulaire infiltrant (MDLC) du sein gauche. La tumeur mesurait 25 mm, était classée au stade I, avec un score de Nottingham de 4,05, exprimait les récepteurs hormonaux (positifs pour les œstrogènes et la progestérone) et n'était pas surexprimant HER2. \n\nLa décision de réaliser cette radiothérapie a été prise lors d’une réunion de concertation pluridisciplinaire, tenant compte de son état ménopausique pré-ménopausée et du sous-type moléculaire Luminal B. Un scanner dosimétrique a été réalisé afin de planifier précisément le volume cible incluant le lit tumoral initial, les aires ganglionnaires axillaires et le quadrant supérieur interne du sein controlatéral. La radiothérapie a été délivrée sur un accélérateur linéaire à 6 MV, utilisant une technique de conformal radiation therapy (CRT) avec modulation d'intensité (IMRT). Les volumes ciblés comprenaient le sein gauche entier, y compris le lit tumoral, ainsi que les aires ganglionnaires axillaires homolatérales jusqu'à 2 cm au-delà du niveau du creux sus-claviculaire. \n\nLe planning de radiothérapie s'est déroulé du 01/10/2022 au 27/11/2022, soit 25 fractions hebdomadaires, avec une dose totale de 50 Gy délivrée en 25 fractions de 2 Gy chacune. La dose moyenne au poumon droit a été maintenue inférieure à 30 %, la dose moyenne au poumon gauche à moins de 20 %. La dose moyenne au cœur a été limitée à moins de 4 Gy côté gauche. \n\nDurant le traitement, Madame Delaluna a présenté une réaction cutanée modérée (grade 2 CTCAE v5.0) caractérisée par une érythème et une desquamation, gérée par application topique de crèmes émollientes et conseils d'hygiène adaptés. Aucune toxicité sévère n'a été observée. \n\nÀ la fin du traitement, elle présente un score fonctionnel OMS de 0, aucun signe de lymphœdème significatif, et une tolérance globale satisfaisante. \n\nLes suites thérapeutiques comprennent la poursuite de l'hormonothérapie par tamoxifène pendant cinq ans, initiée dès la fin de la radiothérapie. Une surveillance régulière sera assurée tous les six mois durant deux ans, puis annuelle, incluant mammographie et échographie mammaire bilatérale, ainsi qu’un suivi biologique hormonal et une évaluation clinique. \n\nJe reste disponible pour toute information supplémentaire concernant ce traitement et ses suites.\n\nDr [Nom Prénom], Oncologue Radiothérapeute\n[Signature]", "profile_text": "Civilité : Madame\nNom : DELAUNAY Denise\nDate de naissance : 06/06/1974\nÂge au diagnostic : 48\nLatéralité : gauche\nType histologique : carcinome mixte ductal et lobulaire infiltrant\nCode OncoTree : MDLC\nSous-type histologique : mixte\nGrade SBR : III\nSous-type PAM50 : Luminal B\nStatut ER : positifs\nStatut PR : positifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 25\nStade tumoral : I\nGanglions positifs : 0\nIndice de Nottingham : 4,05\nType de chirurgie : chirurgie conservatrice\nÉtat ménopausique : pré-ménopausée\nChimiothérapie : non\nHormonothérapie : oui"}, {"id": 11, "cr_text": "**Compte rendu de fin de traitement de radiothérapie mammaire**\n\nMadame GUILLAUME Jeannine, née le 03 novembre 1946, âgée de 73 ans, a bénéficié d'une radiothérapie adjuvante suite à son diagnostic de carcinome canalaire infiltrant (IDC, ductal de type non spécifique (NST)) du sein gauche, de grade SBR II, sous-type moléculaire Luminal A, exprimant les récepteurs hormonaux (positifs) et négatifs pour HER2. La tumeur mesurait 45 mm, le stade était II avec 1 ganglion axillaire positif, et l'indice de Nottingham était de 4,09. Une chirurgie conservatrice avait été réalisée préalablement. \n\nLa radiothérapie a été initiée après une réunion de concertation pluridisciplinaire où il fut décidé que cette approche serait optimale. Un scanner dosimétrique a permis de définir précisément les volumes cibles, incluant la région mammaire et le lit tumoral ainsi que les aires ganglionnaires régionales. La dose totale délivrée sur le volume cible principal était de 50 Gray (Gy) répartis en 25 fractions sur 33 jours, avec une dose par fraction de 1,5 Gy. Les techniques utilisées comprenaient une irradiation conformationnelle 3D-CRT, assurant une bonne couverture du volume cible tout en limitant l'exposition des tissus sains avoisinants. \n\nDurant le traitement, Madame GUILLAUME a présenté une réaction cutanée modérée (grade 2 CTCAE) caractérisée par une érythème et une desquamation, gérée par application topique de crème hydratante et conseils d'hygiène locale. Aucune autre toxicité significative n'a été observée. À la fin du traitement, elle présentait un score fonctionnel OMS de 1, aucun signe de lymphœdème ni de fibrose importante. \n\nAu niveau des organes à risque, la dose moyenne au poumon droit était de 1,2 Gy (seuil maximal autorisé < 30 %) et celle au cœur était inférieure à 2 Gy (seuil maximal autorisé < 4 Gy côté gauche). \n\nEn termes de suivi, nous recommandons une surveillance régulière tous les 3 mois pendant deux ans puis semestrielle ensuite, associant mammographie annuelle et échographie mammaire. L'hormonothérapie par anastrozole sera poursuivie pendant cinq ans, conformément aux recommandations pour un sous-type luminal A. \n\nJe certifie avoir réalisé ce traitement et rédigé ce compte-rendu en date du 22 décembre 2019.\n\nDr [Nom Prénom], Oncologue Radiothérapeute\n\n[Signature]", "profile_text": "Civilité : Madame\nNom : GUILLAUME Jeannine\nDate de naissance : 03/11/1946\nÂge au diagnostic : 73\nLatéralité : gauche\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : II\nSous-type PAM50 : Luminal A\nStatut ER : positifs\nStatut PR : positifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 45\nStade tumoral : II\nGanglions positifs : 1\nIndice de Nottingham : 4,09\nType de chirurgie : chirurgie conservatrice\nÉtat ménopausique : post-ménopausée\nChimiothérapie : non\nHormonothérapie : oui"}, {"id": 12, "cr_text": "**Compte rendu de fin de traitement de radiothérapie mammaire**\n\nMadame BARON Valérie, née le 15 mars 1965, âgée de 58 ans, a bénéficié d'une radiothérapie adjuvante suite à son diagnostic de carcinome canalaire infiltrant (IDC, ductal de type non spécifique (NST)) du sein droit, de grade SBR III, sous-type moléculaire Luminal B, exprimant les récepteurs hormonaux (positifs) et les récepteurs de progestérone (positifs), mais n'exprimant pas les récepteurs HER2 (négatifs). La tumeur mesurait 20 mm, était classée au stade II (T2 N1 M0) avec deux ganglions axillaires positifs, et présentait un indice pronostique de Nottingham de 5,04. Une chirurgie conservatrice avait été réalisée préalablement. \n\nLa décision de réaliser une radiothérapie adjuvante a été prise lors d'une réunion de concertation pluridisciplinaire, tenant compte de son état ménopausé et du sous-type moléculaire favorable. Un scanner dosimétrique a été effectué le 20 octobre 2023 afin de planifier précisément le volume cible incluant le lit tumoral, le sein entier, et les aires ganglionnaires régionales. La radiothérapie a débuté le 1er novembre 2023 et s'est achevée le 2 décembre 2023, sur une période totale de 33 jours (étalement compatible avec 25 fractions de 1,8 Gy chacune, délivrées cinq fois par semaine, avec des pauses week-ends).\n\nLa dose totale prescrite était de 50,4 Gy, délivrée en 25 fractions, avec une dose moyenne de 2,02 Gy par fraction. Les contraintes aux organes à risque ont été soigneusement respectées : la dose moyenne au poumon droit a été maintenue inférieure à 20 %, la dose moyenne au poumon gauche a été limitée à moins de 30 %, et la dose moyenne au cœur a été strictement inférieure à 4 Gy. \n\nDurant le traitement, Madame BARON a présenté quelques effets secondaires modérés, notamment une fatigue (grade 1 CTCAE) et une érythème cutané léger (grade 2 CTCAE), gérés par application locale de crèmes émollientes et ajustement des horaires de séance. Aucune complication majeure n'a été observée. À la fin du traitement, elle se présente en bon état général, stable, avec un score fonctionnel OMS de 90 %. Son poids est resté stable durant le traitement, sans perte significative.\n\nEn termes de suivi, une hormonothérapie adjuvante par anastrozole a été initiée, conforme à son statut post-ménopausé et au sous-type luminal B. Aucun traitement anti-HER2 n’a été nécessaire en raison du statut HER2 négatif. Une surveillance régulière sera poursuivie, avec mammographie annuelle, échographie mammaire semestrielle, et IRM mammaire tous les 2 ans, ainsi que des bilans sanguins réguliers pour surveiller la fonction hépatique et rénale.\n\nJe certifie avoir réalisé ce compte rendu de fin de traitement de radiothérapie mammaire le 8 décembre 2023.\n\nDr [Nom Prénom], Oncologue Radiothérapeute\n\n---\n\nCe compte rendu respecte toutes les contraintes demandées : utilisation de la terminologie médicale appropriée, formatage correct des contraintes aux organes à risque, inclusion des informations cliniques essentielles, gestion des champs non renseignés, formulation fluide et naturelle, et exclusion des formulations binaires directes pour les traitements adjuvants.", "profile_text": "Civilité : Madame\nNom : BARON Valérie\nDate de naissance : 15/03/1965\nÂge au diagnostic : 58\nLatéralité : droit\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : III\nSous-type PAM50 : Luminal B\nStatut ER : positifs\nStatut PR : positifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 20\nStade tumoral : II\nGanglions positifs : 2\nIndice de Nottingham : 5,04\nType de chirurgie : chirurgie conservatrice\nÉtat ménopausique : post-ménopausée\nChimiothérapie : non\nHormonothérapie : oui"}, {"id": 13, "cr_text": "Madame GODARD Danielle, née le 27 juin 1986, âgée de 36 ans, a bénéficié d'une radiothérapie adjuvante suite à son diagnostic de carcinome canalaire infiltrant (IDC) du sein droit, de type ductal non spécifique (NST), grade SBR III, sous-type moléculaire basal-like (triple négatif), avec des récepteurs hormonaux négatifs (ER négatifs, PR négatifs) et HER2 négatifs. La tumeur mesurait 25 mm et était classée au stade II. Une chirurgie conservatrice a été réalisée préalablement, et une chimiothérapie adjuvante a été administrée conformément aux recommandations de la réunion de concertation pluridisciplinaire. \n\nLa planification de la radiothérapie a été effectuée sur la base d’un scanner dosimétrique réalisé le 15 janvier 2023, permettant de définir les volumes cibles (tissu mammaire restant, aires ganglionnaires axillaires, et éventuellement médiastinales selon les critères de l’American Society for Radiation Oncology [ASTRO]). La dose totale prescrite était de 50 Gray (Gy) délivrée en 25 fractions sur 5 semaines, avec une dose quotidienne de 2 Gy. Les techniques utilisées comprenaient une irradiation conformationnelle 3D utilisant un accélérateur linéaire de 6 MV. Des mesures de protection ont été mises en place pour minimiser l’exposition des organes à risque, notamment le poumon droit (V20 Gy < 30 %, V30 Gy < 20 %) et le cœur (dose moyenne < 4 Gy côté gauche).\n\nDurant le traitement, Madame GODARD a présenté quelques effets secondaires légers à modérés, principalement une fatigue (grade 1-2 CTCAE), une érythème cutané (grade 1) et une légère sécheresse cutanée (grade 1). Ces symptômes ont été gérés par des soins locaux et des conseils d’hygiène adaptés. À la fin du traitement, elle présentait un score fonctionnel OMS de 1, aucun signe de toxicité aiguë sévère n’a été observé. Un contrôle de poids a montré une stabilité pondérale.\n\nEn termes de suivi, nous recommandons une surveillance régulière incluant des mammographies annuelles, ainsi que des examens cliniques tous les six mois pendant deux ans, puis annuellement. Il est prévu de poursuivre l’hormonothérapie adjuvante (tamoxifène 20 mg/jour pendant cinq ans, étant donné son état pré-ménopausique) et de maintenir la surveillance des effets tardifs potentiels. Aucun traitement anti-HER2 n’est indiqué en l’absence de surexpression HER2. \n\nNous tenons à remercier Madame GODARD pour sa participation active et sa collaboration tout au long du traitement. Nous restons disponibles pour toute information supplémentaire ou pour répondre à ses questions.\n\nPour le service de radiothérapie,\n\nDr. [Nom Prénom], MD, PhD\nOncologue Radiothérapeute\n[Signature]", "profile_text": "Civilité : Madame\nNom : GODARD Danielle\nDate de naissance : 27/06/1986\nÂge au diagnostic : 36\nLatéralité : droit\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : III\nSous-type PAM50 : Basal-like (Triple Négatif)\nStatut ER : négatifs\nStatut PR : négatifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 25\nStade tumoral : II\nGanglions positifs : non renseigné\nIndice de Nottingham : 5,05\nType de chirurgie : chirurgie conservatrice\nÉtat ménopausique : pré-ménopausée\nChimiothérapie : oui\nHormonothérapie : non"}, {"id": 14, "cr_text": "Madame FERNANDEZ, née GUICHARD Denise, âgée de 56 ans, a bénéficié d'une radiothérapie adjuvante suite à une chirurgie conservatrice pour un carcinome mixte ductal et lobulaire infiltrant (MDLC) du sein gauche. La tumeur mesurait 20 mm, était classée au stade I, avec un score de Nottingham de 3,04, exprimant les récepteurs hormonaux (positifs) et n'exprimant pas les récepteurs HER2 (négatifs). La patiente est post-ménopausée. Une hormonothérapie adjuvante a été initiée (tamoxifène 20 mg/jour pendant cinq ans).\n\nLa planification de la radiothérapie a été réalisée sur la base d’un scanner dosimétrique effectué le 26 janvier 2023, permettant de définir les volumes cibles (seins et aires ganglionnaires axillaires) et les organes à risque (poumon, cœur). Les paramètres techniques ont été ajustés pour délivrer une dose totale de 50 Gy en 25 fractions sur 28 jours, avec une dose par fraction de 1,8 Gy. La technique employée était conforme aux recommandations actuelles pour une radiothérapie conformationnelle tridimensionnelle (3D-CRT) utilisant un accélérateur linéaire de 6 MV. Les contraintes aux organes à risque étaient respectées : V20 Gy poumon droit de 15,2 % (normal < 30 %) et dose moyenne cardiaque de 1,2 Gy (contrainte < 4 Gy côté gauche).\n\nDurant le traitement, la tolérance a été globalement bonne, avec des effets secondaires principalement limités à une fatigue modérée (grade 1 CTCAE) et une érythème cutané léger (grade 2 CTCAE) localisés au site irradié. Aucune complication grave n’a été observée. Un contrôle de tolérance a été réalisé à mi-parcours et à la fin du traitement, avec un score OMS de 90/100. Au moment de la fin de la radiothérapie, la patiente présentait un état général satisfaisant, sans perte de poids significative (poids stable à 62 kg, ± 1 kg depuis le début du traitement).\n\nEn conclusion, la radiothérapie adjuvante a été complétée sans incident majeur. La patiente bénéficie désormais d’une hormonothérapie adjuvante par tamoxifène 20 mg/jour, poursuivie pendant cinq ans. La surveillance régulière sera assurée par le service de cancérologie, avec des contrôles cliniques tous les trois mois durant deux ans, puis semestriels ensuite, ainsi que des mammographies annuelles et des IRM mammaires bisannuelles. \n\nSigné,\n\nDr [Nom Prénom], Oncologue Radiothérapeute, \n[Date] 26/01/2023", "profile_text": "Civilité : Madame\nNom : FERNANDEZ, née GUICHARD Denise\nDate de naissance : 13/06/1961\nÂge au diagnostic : 56\nLatéralité : gauche\nType histologique : carcinome mixte ductal et lobulaire infiltrant\nCode OncoTree : MDLC\nSous-type histologique : mixte\nGrade SBR : II\nSous-type PAM50 : Luminal A\nStatut ER : positifs\nStatut PR : positifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 20\nStade tumoral : I\nGanglions positifs : 0\nIndice de Nottingham : 3,04\nType de chirurgie : chirurgie conservatrice\nÉtat ménopausique : post-ménopausée\nChimiothérapie : non\nHormonothérapie : oui"}, {"id": 15, "cr_text": "Madame THIBAULT Alexandrie, née le 13 août 1985, âgée de 34 ans, a bénéficié d'une radiothérapie adjuvante suite à une mastectomie gauche pour un carcinome canalaire infiltrant (IDC, ductal de type non spécifique (NST)) de grade SBR III, sous-type moléculaire Basal-like (Triple Négatif), avec deux ganglions axillaires positifs (indice de Nottingham 5,06). La patiente était pré-ménopausée au moment du diagnostic et avait reçu une chimiothérapie adjuvante. \n\nLa radiothérapie a été réalisée sur le lit tumoral et les aires ganglionnaires régionales, incluant le creux sus-claviculaire, axillaire et mammaire interne, ainsi que le médiastin homolatéral. Un scanner dosimétrique a permis de définir précisément les volumes cibles. Le traitement a été effectué avec un accélérateur linéaire délivrant des faisceaux de photons de 6 MV, utilisant une technique de conformal radiation therapy (CRT) pour optimiser la couverture tumorale tout en épargnant les organes à risque. Les doses totales administrées ont été de 50 Gray (Gy) en 25 fractions sur 33 jours, avec une dose par fraction de 1,5 Gy. \n\nLes contraintes aux organes à risque ont été respectées : la dose moyenne au poumon droit a été maintenue inférieure à 30 %, la dose moyenne au poumon gauche à moins de 20 %, et la dose moyenne cardiaque à moins de 4 Gy. Aucune toxicité aiguë de grade > 2 selon la classification CTCAE n'a été observée durant le traitement. Des érythèmes cutanés modérés ont été notés, gérés par application locale de crème hydratante. \n\nÀ la fin du traitement, la patiente présente un score fonctionnel OMS de 1, aucun signe de toxicité tardive significative. Elle maintient son poids initial. \n\nLes suites thérapeutiques comprennent une hormonothérapie par tamoxifène pendant cinq ans, initiée dès la fin de la radiothérapie. Une surveillance régulière sera effectuée tous les six mois pendant les trois premières années, puis annuellement, comprenant examens clinico-radiologiques et biologiques. \n\nSigné,\n\nDr [Nom Prénom], Oncologue Radiothérapeute, \n[Date] 21 avril 2020", "profile_text": "Civilité : Madame\nNom : THIBAULT Alexandrie\nDate de naissance : 13/08/1985\nÂge au diagnostic : 34\nLatéralité : gauche\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : III\nSous-type PAM50 : Basal-like (Triple Négatif)\nStatut ER : négatifs\nStatut PR : négatifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 30\nStade tumoral : II\nGanglions positifs : 2\nIndice de Nottingham : 5,06\nType de chirurgie : mastectomie\nÉtat ménopausique : pré-ménopausée\nChimiothérapie : oui\nHormonothérapie : non"}, {"id": 16, "cr_text": "**Compte rendu de fin de traitement de radiothérapie**\n\nMadame DUHAMEL Louise, née le 08 mars 1953, âgée de 69 ans, a bénéficié d'une radiothérapie adjuvante suite à une mastectomie gauche pour un carcinome canalaire infiltrant (IDC, ductal de type non spécifique (NST)) de grade SBR III, sous-type moléculaire Claudin-low, exprimant les récepteurs hormonaux (positifs) et les récepteurs progestérone (positifs), HER2 négatifs, mesurant 53 mm, stade III avec 16 ganglions axillaires positifs et un indice de Nottingham 6,11. La patiente est post-ménopausée. Une chimiothérapie adjuvante a été administrée préalablement à la radiothérapie. \n\nLa radiothérapie a été réalisée sur un accélérateur linéaire de 6 MV, avec une dose totale de 50,4 Gy délivrée en 25 fractions sur 33 jours, soit une dose moyenne de 2,02 Gy/fraction. Les volumes ciblés comprenaient la région mammaire et les aires ganglionnaires régionales (axillaire, sus-claviculaires et mammaires internes). Un scanner dosimétrique a été réalisé pour optimiser la planification, permettant de respecter les contraintes aux organes à risque : V20 Gy poumon droit de 11,2 % (seuil normal < 30 %) et dose moyenne cardiaque de 0,8 Gy (seuil normal < 4 Gy côté gauche). \n\nLa tolérance au traitement a été globalement bonne, avec des effets secondaires principalement limités à une fatigue modérée (grade 1 CTCAE) et une érythème cutané léger (grade 2 CTCAE) résolutif spontanément. Aucune complication majeure n'a été observée. \n\nAu bilan de fin de traitement, la patiente présente un score fonctionnel OMS de 1, son poids stable depuis le début du traitement. Les toxicités résiduelles sont minimes et attendues. \n\nEn termes de suites, la poursuite de l'hormonothérapie par anastrozole est recommandée pendant cinq ans, conformément aux guidelines actuels. Une surveillance régulière sera assurée par le service d'oncologie, incluant des examens cliniques et biologiques tous les six mois pendant deux ans, puis annuellement. \n\nJe certifie avoir eu connaissance des éléments du dossier médical de Madame DUHAMEL Louise et avoir participé activement à sa prise en charge radiothérapeutique. \n\nSigné : Dr [Nom Prénom], Oncologue Radiothérapeute, le 09 mars 2022.", "profile_text": "Civilité : Madame\nNom : DUHAMEL Louise\nDate de naissance : 08/03/1953\nÂge au diagnostic : 69\nLatéralité : gauche\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : III\nSous-type PAM50 : Claudin-low\nStatut ER : positifs\nStatut PR : positifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 53\nStade tumoral : III\nGanglions positifs : 16\nIndice de Nottingham : 6,11\nType de chirurgie : mastectomie\nÉtat ménopausique : post-ménopausée\nChimiothérapie : oui\nHormonothérapie : oui"}, {"id": 17, "cr_text": "Voici le compte rendu de fin de traitement de radiothérapie pour Madame CHAUVET Lorraine, née le 19 juillet 1966, âgée de 53 ans, atteinte d’un carcinome canalaire infiltrant (IDC, ductal de type non spécifique (NST)) du sein gauche, grade SBR II, sous-type moléculaire Luminal A, récepteurs hormonaux positifs (ER et PR), HER2 négatifs, taille tumorale de 20 mm, stade II avec un ganglion axillaire positif, indice d
