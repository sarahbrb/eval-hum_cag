26 juin 1944, âgée de 72 ans, a bénéficié d'une radiothérapie adjuvante suite à une mastectomie gauche réalisée pour un carcinome canalaire infiltrant (IDC, ductal de type non spécifique (NST)) de 35 mm, grade SBR II, stade II, avec 1 ganglion axillaire positif, indice de Nottingham 4,07. La patiente est post-ménopausée et présente des récepteurs hormonaux positifs (ER et PR) ainsi que des récepteurs HER2 négatifs. Une hormonothérapie adjuvante a été initiée, consistant en l'administration de letrozole (Femara®).\n\nLa radiothérapie a été préparée par un scanner dosimétrique réalisé le 10 janvier 2017, permettant de définir précisément les volumes cibles (tissu mammaire restant, aires ganglionnaires régionales) et les organes à risque (poumon, cœur). Le plan de traitement a été établi sur un accélérateur linéaire de photons de 6 MV, avec une dose totale cible de 50 Gy délivrée en 25 fractions sur 33 jours, soit un étalement de 33 jours (cohérent avec 25 fractions sur 33 jours, incluant les pauses week-ends). Les contraintes dosimétriques ont été respectées : V20 Gy poumon droit < 30 %, V30 Gy poumon droit < 20 %, dose moyenne cardiaque < 4 Gy (côté gauche).\n\nDurant le traitement, la patiente a présenté une réaction cutanée modérée (grade 2 CTCAE v5.0) avec érythème et desquamation, gérée par application locale de crèmes émollientes et hydratantes. Aucune autre toxicité majeure n'a été observée. Au bilan de fin de traitement, le score fonctionnel OMS était inchangé (0), le poids stable, et aucune toxicité aiguë résiduelle significative n'était notée.\n\nEn conclusion, la radiothérapie adjuvante a été complétée sans complication majeure. La patiente bénéficie actuellement d'une hormonothérapie par letrozole (Femara®) pendant cinq ans. Un suivi régulier sera assuré par le service d'oncologie, avec contrôle clinico-biologique tous les six mois, échographie mammaire annuelle et mammographie bilatérale tous les deux ans. \n\nJe reste disponible pour toute information supplémentaire concernant ce traitement.\n\nSigné,\n\n[Nom Prénom] \nOncologue Radiothérapeute \nDate : 10 janvier 2017", "profile_text": "Civilité : Madame\nNom : GAUTIER Paulette\nDate de naissance : 26/06/1944\nÂge au diagnostic : 72\nLatéralité : gauche\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : II\nSous-type PAM50 : non classifié\nStatut ER : positifs\nStatut PR : positifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 35\nStade tumoral : II\nGanglions positifs : 1\nIndice de Nottingham : 4,07\nType de chirurgie : mastectomie\nÉtat ménopausique : post-ménopausée\nChimiothérapie : non\nHormonothérapie : oui"}, {"id": 64, "cr_text": "**Compte rendu de fin de traitement de radiothérapie**\n\nMadame FERNANDES, née BOUCHER Philippine, âgée de 68 ans, a bénéficié d'une radiothérapie adjuvante après une chirurgie conservatrice pour un carcinome canalaire infiltrant (IDC) du sein gauche, de type non spécifique (ductal NST), grade SBR III, sous-type moléculaire basal-like (triple négatif), avec trois ganglions axillaires positifs, une tumeur mesurant 33 mm, stade II, et un indice de Nottingham de 5,07. La patiente est post-ménopausée, sans indication d'hormonothérapie, ayant reçu une chimiothérapie adjuvante préalablement à la radiothérapie. \n\nLa préparation du traitement a inclus un scanner dosimétrique réalisé le 15/03/2020, permettant la planification précise des volumes cibles (tissu mammaire restant, aires ganglionnaires régionales, marges chirurgicales) et la détermination des paramètres techniques (CTDI, PDL, technique 3D conformée). La radiothérapie a été administrée sur un accélérateur linéaire de 6 MV, avec une dose totale cible de 50 Gy délivrée en 25 fractions sur 33 jours (du 20/03/2020 au 29/04/2020), incluant des pauses hebdomadaires. Les contraintes aux organes à risque ont été respectées : V20 Gy poumon droit de 10,5 %, V30 Gy de 5,5 % (seuils normaux < 30 % et < 20 %) et dose moyenne cardiaque de 1,2 Gy (seuil maximal < 4 Gy).\n\nDurant le traitement, la patiente a présenté une réaction cutanée modérée (grade 2 CTCAE v5.0) avec érythème et desquamation, gérée par application topique de crèmes émollientes et conseils d'hygiène locale. Aucune toxicité sévère (grade > 2) n'a été observée. À la fin du traitement, son état général était satisfaisant, avec un score fonctionnel OMS à 90 %. Elle présente actuellement une légère fatigue, compatible avec le traitement, sans autre effet secondaire notable.\n\nEn termes de surveillance, nous recommandons une consultation de contrôle tous les six mois pendant deux ans, puis annuelle, avec mammographie et échographie mammaire bilatérale, ainsi que des examens sanguins réguliers pour surveiller la fonction hépatique et rénale. Une imagerie thoracique sera réalisée annuellement pour suivre l'évolution pulmonaire. \n\nNous tenons à souligner que la patiente bénéficie d'une surveillance oncologique régulière, notamment pour le suivi des métastases potentielles, étant donné le sous-type basal-like associé à un risque plus élevé de récidive. Nous avons également discuté avec elle de l'importance de poursuivre sa chimiothérapie adjuvante jusqu'à son terme, comme prévu dans le cadre de la stratégie thérapeutique initiale.\n\nSigné,\n\n[Prénom Nom]\nOncologue Radiothérapeute\nDate : 22/04/2020", "profile_text": "Civilité : Madame\nNom : FERNANDES, née BOUCHER Philippine\nDate de naissance : 22/04/1952\nÂge au diagnostic : 68\nLatéralité : gauche\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : III\nSous-type PAM50 : Basal-like (Triple Négatif)\nStatut ER : négatifs\nStatut PR : négatifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 33\nStade tumoral : II\nGanglions positifs : 3\nIndice de Nottingham : 5,07\nType de chirurgie : chirurgie conservatrice\nÉtat ménopausique : post-ménopausée\nChimiothérapie : oui\nHormonothérapie : non"}, {"id": 65, "cr_text": "Voici le compte rendu de fin de traitement de radiothérapie pour Madame DELORME Adèle, née le 05 décembre 1962, âgée de 60 ans, atteinte d’un carcinome lobulaire infiltrant (ILC, lobulaire) du sein droit, grade SBR II, sous-type moléculaire Normal-like, exprimant les récepteurs hormonaux (positifs pour les récepteurs aux œstrogènes et à la progestérone) et HER2 négatifs. La tumeur mesurait 29 mm et était classée au stade II avec deux ganglions axillaires positifs, indice de Nottingham 4,06. Une chirurgie conservatrice a été réalisée préalablement, suivie d’une hormonothérapie adjuvante adaptée à son état post-ménopausique (tamoxifène).\n\nLa radiothérapie a été initiée suite à une réunion de concertation pluridisciplinaire. Un scanner dosimétrique a permis de définir précisément les volumes cibles incluant le lit tumoral et les aires ganglionnaires régionales. Le traitement a été délivré sur un accélérateur linéaire, utilisant des faisceaux de photons de 6 MV, avec une dose totale de 50 Gray (Gy) répartis en 25 fractions sur 33 jours (étalement conforme à 25 fractions × 1,33 jours environ). Les contraintes aux organes à risque ont été respectées : la dose moyenne au poumon droit était de 1,8 Gy (seuil de tolérance < 30 %) et celle au cœur gauche < 2 Gy (seuil de tolérance < 4 Gy). La dose maximale au poumon droit s’est maintenue en dessous de 20 Gy (seuil de tolérance < 20 %). Aucune complication majeure n’a été observée durant le traitement, mais des érythèmes cutanés modérés (grade 2 CTCAE) ont été notés, gérés par application locale de crème hydratante.\n\nÀ la fin du traitement, l’état général de Madame Delorme est stable, avec un score fonctionnel OMS de 1, aucun signe de récidive locale ou métastatique n’étant détectable. Elle poursuit actuellement une hormonothérapie adjuvante par tamoxifène, prescrit pour cinq ans. Les recommandations de suivi comprennent une mammographie annuelle, une échographie mammaire semestrielle, ainsi que des bilans sanguins réguliers pour surveiller la fonction hépatique et rénale. Il lui sera également proposé une IRM mammaire à 1 an puis tous les 2 ans.\n\nEn conclusion, le traitement de radiothérapie a été bien toléré, sans dépassement des seuils de tolérance aux organes critiques, et la patiente bénéficie désormais d'une surveillance régulière pour assurer le suivi optimal de sa maladie.\n\nPour information, la chimiothérapie n'a pas été jugée nécessaire dans cette situation, en accord avec le profil moléculaire et le stade de la tumeur. \n\nSigné,\n\n[Nom Prénom du Médecin Radiothérapeute]", "profile_text": "Civilité : Madame\nNom : DELORME Adèle\nDate de naissance : 05/12/1962\nÂge au diagnostic : 60\nLatéralité : droit\nType histologique : carcinome lobulaire infiltrant\nCode OncoTree : ILC\nSous-type histologique : lobulaire\nGrade SBR : II\nSous-type PAM50 : Normal-like\nStatut ER : positifs\nStatut PR : positifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 29\nStade tumoral : II\nGanglions positifs : 2\nIndice de Nottingham : 4,06\nType de chirurgie : chirurgie conservatrice\nÉtat ménopausique : post-ménopausée\nChimiothérapie : non\nHormonothérapie : oui"}, {"id": 66, "cr_text": "Compte rendu de fin de traitement de radiothérapie mammaire pour Madame LEMOINE Gabrielle, née le 06 janvier 1963, âgée de 54 ans, présentant un carcinome canalaire infiltrant (IDC, ductal de type non spécifique (NST)) du sein droit, de grade SBR III, sous-type moléculaire Luminal B, récepteurs hormonaux positifs (ER), récepteurs progestérone négatifs (PR), HER2 négatifs, taille tumorale de 20 mm, stade I, 0 ganglion(s) positif(s), indice de Nottingham 4,04, ayant bénéficié d'une chirurgie conservatrice, et étant en état post-ménopausique.\n\nMadame LEMOINE Gabrielle a été traitée par radiothérapie adjuvante suite à sa chirurgie conservatrice. La décision de cette radiothérapie a été prise lors d’une réunion de concertation pluridisciplinaire (RCP) tenant compte de son âge, du stade initial de la maladie, du sous-type moléculaire et du fait que la tumeur était localisée sans envahissement ganglionnaire. Un scanner dosimétrique a été réalisé le 14 mars 2017 afin de définir précisément les volumes cibles et les organes à risque. La radiothérapie a été réalisée sur un accélérateur linéaire de particules, utilisant une dose totale de 50 Gray (Gy) délivrée en 25 fractions sur 33 jours, avec une dose quotidienne de 1,5 Gy. Les volumes irradiés comprenaient le lit tumoral, le sein entier, ainsi que les aires ganglionnaires axillaires et supra-claviculaires homolatérales. Des techniques de dosimétrie complexes ont été employées pour protéger les organes à risque, notamment le poumon droit dont la dose V20 a été maintenue inférieure à 30 %, et le cœur dont la dose moyenne a été limitée à moins de 4 Gy côté gauche. \n\nLa tolérance au traitement a été globalement bonne, avec des effets secondaires principalement limités à une fatigue modérée (grade 1 CTCAE) et une irritation cutanée légère (grade 2 CTCAE) durant les dernières semaines de traitement. Aucune complication majeure n’a été observée. À la fin du traitement, le score fonctionnel de l’OMS est évalué à 0, sans perte de poids significative. \n\nÀ ce jour, aucune toxicité résiduelle notable n’est présente. Les suites thérapeutiques comprennent la poursuite de l’hormonothérapie adjuvante par anastrozole pendant cinq ans, conformément aux recommandations pour son sous-type moléculaire Luminal B et son état post-ménopausique. Une surveillance régulière sera assurée avec mammographie annuelle, échographie mammaire semestrielle, et consultation oncologique tous les six mois. \n\nEn conclusion, le traitement de radiothérapie adjuvante a été complété avec succès chez Madame LEMOINE Gabrielle, sans complications majeures. Elle bénéficie désormais d’un suivi adapté à son profil de risque et à son traitement systémique.\n\nFait à Paris, le 14 mars 2017\n\nDr [Nom Prénom], Oncologue Radiothérapeute\n\n[Signature]", "profile_text": "Civilité : Madame\nNom : LEMOINE Gabrielle\nDate de naissance : 06/01/1963\nÂge au diagnostic : 54\nLatéralité : droit\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : III\nSous-type PAM50 : Luminal B\nStatut ER : positifs\nStatut PR : négatifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 20\nStade tumoral : I\nGanglions positifs : 0\nIndice de Nottingham : 4,04\nType de chirurgie : chirurgie conservatrice\nÉtat ménopausique : post-ménopausée\nChimiothérapie : non\nHormonothérapie : oui"}, {"id": 67, "cr_text": "**Compte rendu de fin de traitement de radiothérapie mammaire**\n\nÀ l'attention de Madame DIAZ, née MAILLARD Michèle, née le 26 décembre 1948, âgée de 72 ans, ayant bénéficié d'une mastectomie pour un carcinome canalaire infiltrant (IDC, ductal de type non spécifique (NST)) du sein gauche, grade SBR III, sous-type moléculaire Luminal B, exprimant les récepteurs hormonaux (ER positifs) et les récepteurs HER2 positifs, présentant 1 ganglion lymphatique axillaire métastatique, stade II, indice de Nottingham 5,05.\n\nMadame DIAZ a été adressée en radiothérapie adjuvante suite à une réunion de concertation pluridisciplinaire (RCP) après sa mastectomie. La planification de la radiothérapie a été réalisée sur la base d’un scanner dosimétrique effectué le 15 octobre 2021, permettant de définir précisément les volumes cibles (tissu mammaire restant, aires ganglionnaires régionales, marges chirurgicales) et d’établir un plan de traitement adapté. La radiothérapie a été délivrée par un accélérateur linéaire de particules de 6 MV, utilisant une technique de conformal radiation therapy (CRT) pour optimiser la dose sur la tumeur tout en épargnant les tissus sains environnants.\n\nLa radiothérapie a débuté le 2 novembre 2021 et s’est achevée le 28 novembre 2021, soit 26 jours plus tard, correspondant à 15 fractions hebdomadaires de 2 Gray (Gy) chacune, totalisant une dose totale de 30 Gy sur la zone cible, avec une dose moyenne de 2,0 Gy par fraction. Les contraintes aux organes à risque ont été respectées : la dose moyenne au poumon droit était de 12,5% de la V20 (seuil maximal acceptable < 30%), et la dose moyenne au cœur était inférieure à 2 Gy (seuil maximal autorisé < 4 Gy).\n\nAu cours du traitement, Mme DIAZ a présenté une réaction cutanée modérée (grade 2 CTCAE v5.0) se manifestant par une érythème et une sécheresse cutanée, gérée par application topique de crèmes émollientes et conseils d’hygiène adaptés. Aucune toxicité sévère (grade ≥ 3) n’a été observée. À la fin du traitement, son état général est stable, elle conserve un score fonctionnel OMS à 90%, son poids est resté stable autour de 65 kg, sans perte pondérale significative.\n\nEn termes de suivi, Mme DIAZ bénéficiera d’une hormonothérapie adjuvante par anastrozole (Arimidex®) pendant cinq ans, en accord avec son statut post-ménopausique et son sous-type moléculaire Luminal B. Une surveillance régulière sera organisée, incluant des consultations tous les six mois durant deux ans, puis annuellement, associées à des mammographies annuelles et des échographies régulières du sein controlatéral. Un suivi biologique (dosage des marqueurs tumoraux CA 15-3, CEA) sera également mis en place.\n\nJe reste disponible pour toutes questions supplémentaires concernant cette prise en charge.\n\nDr [Nom Prénom], Oncologue Radiothérapeute\n[Signature]\n[Date : 28/11/2021]", "profile_text": "Civilité : Madame\nNom : DIAZ, née MAILLARD Michèle\nDate de naissance : 26/12/1948\nÂge au diagnostic : 72\nLatéralité : gauche\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : III\nSous-type PAM50 : Luminal B\nStatut ER : positifs\nStatut PR : négatifs\nStatut HER2 : positifs\nTaille tumorale (mm) : 26\nStade tumoral : II\nGanglions positifs : 1\nIndice de Nottingham : 5,05\nType de chirurgie : mastectomie\nÉtat ménopausique : post-ménopausée\nChimiothérapie : non\nHormonothérapie : oui"}, {"id": 68, "cr_text": "Voici le compte rendu de fin de traitement de radiothérapie pour Madame GUILLON Claudine, née le 28 janvier 1941, âgée de 75 ans, présentant un carcinome canalaire invasif (IDC) de type non spécifique (ductal NST), sous-type moléculaire Luminal A, avec expression des récepteurs hormonaux (positifs pour les récepteurs aux œstrogènes et à la progestérone) et absence d'expression du récepteur HER2. La tumeur mesurait 21 millimètres, sans atteinte ganglionnaire détectable (0 ganglion positif) et avec un index pronostique de Nottingham de 1,04. Une chirurgie conservatrice a été réalisée, suivie d'une hormonothérapie adjuvante adaptée à son état post-ménopausique (par exemple, anastrozole ou létrozole).\n\nMadame GUILLON Claudine a bénéficié d'une radiothérapie adjuvante après sa chirurgie conservatrice. Un scanner dosimétrique a été réalisé le 28 juillet 2016 afin de définir précisément les volumes cibles et les contraintes dosimétriques. Le traitement a été effectué sur un accélérateur linéaire, délivrant des faisceaux de photons de 6 MV, avec une technique de conformal radiation therapy (CRT) visant le lit tumoral et les aires ganglionnaires régionales. Les séances ont débuté le 15 août 2016 et se sont achevées le 10 octobre 2016, soit un total de 25 fractions réparties sur 33 jours, incluant les pauses hebdomadaires. La dose totale délivrée était de 50 Gray (Gy) en 25 fractions, avec une dose moyenne quotidienne de 1,67 Gy et une dose maximale de 2,0 Gy par séance. \n\nLa dose moyenne au poumon droit a été maintenue inférieure à 30 %, conforme aux recommandations, tandis que la dose moyenne au poumon gauche a été limitée à moins de 20 %. La dose moyenne au cœur a été surveillée attentivement pour rester inférieure à 4 Gy, sans dépassement constaté. \n\nAu cours du traitement, Mme GUILLON a présenté des effets secondaires principalement légers à modérés (grade 1-2 CTCAE), notamment une fatigue et une irritation cutanée transitoire, gérées par application locale de crème hydratante et conseils de protection solaire. Aucune complication majeure n'a été observée. À la fin du traitement, elle présentait un score fonctionnel OMS de 1, sans perte de poids significative. \n\nEn conclusion, la radiothérapie adjuvante s'est déroulée sans incident majeur, respectant les contraintes dosimétriques aux organes à risque. La poursuite de l'hormonothérapie adjuvante sera poursuivie pendant cinq ans. Une surveillance régulière est prévue, incluant mammographie annuelle, échographie mammaire semestrielle et consultation oncologique tous les six mois. \n\nJe reste disponible pour toutes questions supplémentaires concernant le suivi de cette patiente.\n\nSigné,\n\n[Prénom Nom]\nOncologue Radiothérapeute\nDate : 28/07/2016", "profile_text": "Civilité : Madame\nNom : GUILLON Claudine\nDate de naissance : 28/01/1941\nÂge au diagnostic : 75\nLatéralité : non renseigné\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : non renseigné\nSous-type PAM50 : Luminal A\nStatut ER : positifs\nStatut PR : positifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 21\nStade tumoral : non renseigné\nGanglions positifs : 0\nIndice de Nottingham : 1,04\nType de chirurgie : chirurgie conservatrice\nÉtat ménopausique : post-ménopausée\nChimiothérapie : non\nHormonothérapie : oui"}, {"id": 69, "cr_text": "Madame BIGOT, née RUIZ Aimée, âgée de 74 ans, a bénéficié d'une radiothérapie adjuvante suite à une mastectomie gauche réalisée pour un carcinome canalaire infiltrant (IDC, ductal de type non spécifique (NST)) de 52 mm, grade SBR III, sous-type moléculaire Luminal B, exprimant les récepteurs hormonaux (positifs) et les récepteurs HER2 négatifs. Elle présente également un stade III avec 1 ganglion axillaire positif et un indice de Nottingham de 5,10. La patiente est en état post-ménopausique. Une chimiothérapie adjuvante a été administrée préalablement à la radiothérapie, ainsi qu’une hormonothérapie par anastrozole (pour son état post-ménopausique).\n\nLa radiothérapie a été initiée le 01/03/2022 et s'est achevée le 20/04/2022, sur une période totale de 40 jours, incluant les week-ends et les congés. Un scanner dosimétrique a été réalisé le 25/02/2022 afin de définir précisément les volumes cibles et les organes à risque. La dose cible globale délivrée était de 50 Gray (Gy) en 25 fractions, avec une dose par fraction de 2,0 Gy, délivrées cinq fois par semaine, du lundi au vendredi. Les techniques utilisées ont inclus une irradiation conformationnelle 3D-CRT avec modulation d'intensité (IMRT) pour optimiser la couverture tumorale tout en épargnant les organes à risque. Les volumes cibles comprenaient le lit tumoral, la zone péri-tumorale, le creux axillaire jusqu'à l'aisselle, ainsi que le médiastin latéral gauche. Les organes à risque ont été soigneusement protégés, notamment le poumon droit dont la dose V20 était maintenue inférieure à 30 %, et le cœur dont la dose moyenne était limitée à moins de 4 Gy côté gauche.\n\nDurant le traitement, la tolérance a été globalement bonne, avec des effets secondaires principalement limités à une fatigue modérée (grade 1 CTCAE) et une érythème cutané léger (grade 2 CTCAE) au niveau du site irradié, traités par application topique de crèmes émollientes et conseils d’hygiène locale. Aucune complication grave n’a été observée. À la fin du traitement, la patiente présentait un score fonctionnel OMS de 1, sans perte de poids significative (poids stable à 62 kg). Les examens physiques et biologiques réalisés lors du dernier contrôle (09/06/2022) montrent une cicatrice de mastectomie bien cicatrisée, sans signe de récidive locale ou régionale.\n\nLes suites thérapeutiques recommandées comprennent la poursuite de l'anastrozole pendant 5 ans, ainsi qu’un suivi régulier tous les six mois avec mammographie annuelle, échographie mammaire controlatérale, imagerie thoracique et abdominale, et dosage des marqueurs tumoraux (CEA, CA 15-3) pour surveiller l’évolution. La prochaine consultation de suivi est prévue le 10/10/2022.\n\nJe certifie avoir assuré la prise en charge radiothérapeutique de Madame BIGOT, née RUIZ Aimée, et confirme la réalisation complète du traitement selon les standards actuels. Je reste disponible pour toute information supplémentaire.\n\nDr [Nom Prénom], Oncologue Radiothérapeute\n[Signature]", "profile_text": "Civilité : Madame\nNom : BIGOT, née RUIZ Aimée\nDate de naissance : 08/04/1948\nÂge au diagnostic : 74\nLatéralité : gauche\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : III\nSous-type PAM50 : Luminal B\nStatut ER : positifs\nStatut PR : positifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 52\nStade tumoral : III\nGanglions positifs : 1\nIndice de Nottingham : 5,10\nType de chirurgie : mastectomie\nÉtat ménopausique : post-ménopausée\nChimiothérapie : oui\nHormonothérapie : oui"}, {"id": 70, "cr_text": "Madame, Monsieur,\n\nObjet : Compte rendu de fin de traitement de radiothérapie pour Madame HENRY, née MARÉCHAL Laetitia, née le 25 février 1965, âgée de 56 ans\n\nMadame HENRY, née MARÉCHAL Laetitia, née le 25 février 1965, âgée de 56 ans, a bénéficié d'une radiothérapie adjuvante suite à son diagnostic de carcinome canalaire infiltrant (IDC, ductal de type non spécifique (NST)) découvert lors d'un dépistage mammographique. Les résultats de l'examen anatomopathologique ont révélé une tumeur mesurant 30 millimètres, classée au grade SBR II, exprimant les récepteurs hormonaux (ER positifs) mais n'exprimant pas les récepteurs progestérone (PR négatifs), ainsi que des récepteurs HER2 négatifs. Un score de prolifération tumorale (indice de Nottingham) de 5,06 a été noté. Une chirurgie conservatrice a été réalisée, suivie d'une radiothérapie adjuvante sur le sein controlatéral, décidée lors d'une réunion de concertation pluridisciplinaire.\n\nLa planification de la radiothérapie a été effectuée après un scanner dosimétrique réalisé le 09 mai 2021, permettant de définir précisément les volumes cibles et les organes à risque. Le traitement a été délivré par un accélérateur linéaire, utilisant une énergie de 6 MV, avec une technique de conformal radiotherapy (CRT). Le volume cible comprenait le lit tumoral initial, incluant un marge de sécurité de 1 cm autour de la cicatrice chirurgicale, ainsi que les aires ganglionnaires axillaires homolatérales. Le volume pulmonaire critique (V20 Gy) a été maintenu en dessous de 30 %, tandis que la dose moyenne cardiaque était inférieure à 4 Gy. Le traitement s'est déroulé du 17 mai 2021 au 09 juin 2021, soit 23 jours, respectant un étalement compatible avec 15 fractions hebdomadaires (15 fractions x 1,4 ≈ 21 jours).\n\nAu cours du traitement, la patiente a présenté quelques effets secondaires légers, principalement une fatigue modérée (grade 1 CTCAE) et une érythème cutané localisé (grade 2 CTCAE), traités par application locale de crèmes émollientes et conseils d'hygiène. Aucune complication majeure n'a été observée, notamment aucune atteinte pulmonaire significative (V20 Gy poumon droit < 30 %) ni cardiotoxicité notable (dose moyenne cardiaque < 4 Gy côté gauche). La tolérance globale a été jugée satisfaisante, permettant la poursuite du traitement jusqu'à sa conclusion prévue.\n\nÀ la fin du traitement, le bilan clinique montre un état général conservé, un poids stable, et aucun signe de récidive locale ou régionale. Le score fonctionnel OMS est inchangé depuis le début du traitement. Les recommandations de suivi incluent une consultation de contrôle tous les trois mois pendant deux ans, puis tous les six mois, avec imagerie mammaire annuelle et échographie mammaire semestrielle. Une hormonothérapie adjuvante par anastrozole a été initiée en post-ménopause, poursuivie pendant cinq ans. Aucun traitement anti-HER2 n'a été prescrit en l'absence de surexpression HER2.\n\nEn conclusion, la radiothérapie adjuvante a été complétée sans incident majeur, dans le cadre d'un parcours thérapeutique global adapté au profil moléculaire et clinique de la patiente. Nous restons attentifs à la surveillance régulière pour détecter d'éventuels signes de récidive ou de complications tardives.\n\nPour information, le présent compte-rendu est établi le 09 juin 2021.\n\nJe reste à votre disposition pour toute précision supplémentaire.\n\nBien cordialement,\n\n[Signature]\nDr [Nom Prénom], Oncologue Radiothérapeute\n\n**Remarque :** Ce document est destiné à usage médical et confidentiel.", "profile_text": "Civilité : Madame\nNom : HENRY, née MARÉCHAL Laetitia\nDate de naissance : 25/02/1965\nÂge au diagnostic : 56\nLatéralité : non renseigné\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : II\nSous-type PAM50 : Luminal B\nStatut ER : positifs\nStatut PR : négatifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 30\nStade tumoral : non renseigné\nGanglions positifs : 8\nIndice de Nottingham : 5,06\nType de chirurgie : chirurgie conservatrice\nÉtat ménopausique : post-ménopausée\nChimiothérapie : non\nHormonothérapie : oui"}, {"id": 71, "cr_text": "Madame FONTAINE Christiane, née le 11 septembre 1955, âgée de 67 ans, a bénéficié d'une radiothérapie adjuvante suite à son diagnostic de carcinome canalaire infiltrant (IDC, ductal de type non spécifique (NST)) du sein droit, de stade I, mesurant 15 mm, avec un score de grade SBR II, sous-type moléculaire Claudin-low, récepteurs hormonaux négatifs (ER, PR), HER2 négatifs, et aucun ganglion axillaire métastatique. La patiente a subi une chirurgie conservatrice (tumorectomie suivie de curage axillaire négatif) en raison de sa petite taille tumorale et de l'absence de signes de maladie ganglionnaire. \n\nLa décision de réaliser une radiothérapie adjuvante a été prise lors d'une réunion de concertation pluridisciplinaire, tenant compte du faible risque de récidive locale et de l'intérêt d'une approche multimodale. Un scanner dosimétrique a été réalisé le 15 mai 2023 afin de définir précisément les volumes cibles (tissu mammaire restant, région axillaire, et marges chirurgicales) et optimiser la planification. \n\nLa radiothérapie a été administrée sur un accélérateur linéaire de 6 MV, utilisant une technique de conformal radiotherapy (IMRT) pour minimiser l'exposition des tissus sains. Les fractions ont été délivrées quotidiennement, cinq fois par semaine, du 20 juin 2023 au 15 juillet 2023, soit 25 fractions au total, avec une dose totale de 50 Gray (Gy) délivrée à la cible principale (mamelon, tissu mammaire restant, et marges chirurgicales) et une dose moyenne de 1,6 Gy par fraction. La dose maximale autorisée au poumon droit était limitée à 20% de la V30 (volume pulmonaire exposé à plus de 30 Gy) pour respecter la tolérance pulmonaire (< 20%), tandis que la dose moyenne cardiaque était maintenue inférieure à 4 Gy (limite recommandée).\n\nAu cours du traitement, la patiente a présenté une réaction cutanée modérée (grade 2 CTCAE v5.0) se manifestant par une érythème et une desquamation, gérée par application topique de crème hydratante et protection solaire. Aucune toxicité sévère n'a été observée. À la fin du traitement, elle présentait un score fonctionnel OMS de 1, sans perte de poids significative (poids stable à 65 kg). \n\nÀ l'issue de la radiothérapie, la patiente est en bonne santé générale, sans signe de complication aiguë ou tardive. Elle bénéficie désormais d'une surveillance régulière incluant mammographie annuelle et échographie mammaire tous les six mois, ainsi que des examens sanguins annuels pour surveiller la fonction hépatique et rénale. Aucun traitement hormonal adjuvant n'est prescrit en l'absence de récepteurs hormonaux positifs. Une thérapie anti-HER2 n'est pas indiquée en raison du statut HER2 négatif.\n\nEn conclusion, Madame FONTAINE Christiane a reçu une radiothérapie adéquate et bien tolérée, conforme aux standards actuels. Nous recommandons la poursuite de la surveillance régulière et adaptée à son profil clinique.\n\nPour information, le présent compte rendu est établi le 22 juillet 2023.\n\nDr [Nom Prénom], Oncologue Radiothérapeute\n\n[Signature]", "profile_text": "Civilité : Madame\nNom : FONTAINE Christiane\nDate de naissance : 11/09/1955\nÂge au diagnostic : 67\nLatéralité : droit\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : II\nSous-type PAM50 : Claudin-low\nStatut ER : négatifs\nStatut PR : négatifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 15\nStade tumoral : I\nGanglions positifs : 0\nIndice de Nottingham : 3,03\nType de chirurgie : chirurgie conservatrice\nÉtat ménopausique : post-ménopausée\nChimiothérapie : non\nHormonothérapie : non"}, {"id": 72, "cr_text": "Madame GUÉRIN, née BAZIN Françoise, âgée de 35 ans, a bénéficié d'une radiothérapie adjuvante suite à son diagnostic de carcinome canalaire infiltrant (IDC, ductal de type non spécifique (NST)) du sein gauche, de grade SBR III, sous-type moléculaire Claudin-low, avec un score de Nottingham de 4,03, une taille tumorale de 16 mm, un stade I, et aucun ganglion axillaire atteint. La patiente était pré-ménopausée et avait reçu une chimiothérapie adjuvante préalablement à la radiothérapie. Une réunion de concertation pluridisciplinaire a été organisée pour définir le plan de traitement optimal.\n\nLa radiothérapie a été réalisée sur un accélérateur linéaire de particules, utilisant une dose totale de 50 Gray (Gy) délivrée en 25 fractions sur 33 jours, avec une dose par fraction de 1,5 Gy. Les volumes cibles comprenaient le lit tumoral initial, le sein entier, ainsi que le creux sus-claviculaire et axillaire homolatéraux. Un scanner dosimétrique a permis de définir précisément les limites des volumes cibles et de s'assurer du respect des contraintes aux organes à risque. La dose moyenne au poumon droit a été maintenue inférieure à 30 %, et celle au poumon gauche inférieure à 20 %. La dose moyenne au cœur a été limitée à moins de 4 Gy côté gauche. \n\nDurant le traitement, la patiente a présenté des effets secondaires principalement cutanés, notamment des érythèmes de grade 2 (CTCAE v5.0) localisés au niveau du sein irradié, traités par application locale de crème hydratante et protection solaire. Aucune toxicité sévère (grade ≥ 3) n'a été observée. Au bilan de fin de traitement, la patiente présentait un score fonctionnel OMS de 1, un poids stable, et aucune toxicité résiduelle significative. \n\nEn termes de suites, nous recommandons une surveillance régulière tous les trois mois pendant deux ans, puis semestrielle pendant cinq ans, incluant mammographie annuelle et échographie mammaire. Nous conseillons également la poursuite de l'hormonothérapie adjuvante par tamoxifène pendant cinq ans, étant donné l'absence de récepteurs hormonaux positifs mais le jeune âge de la patiente et le haut grade tumoral. \n\nJe certifie avoir réalisé ce compte rendu et je reste disponible pour toutes questions supplémentaires concernant le suivi de cette patiente.\n\nDr [Nom Prénom], Oncologue Radiothérapeute, 19 mars 2019", "profile_text": "Civilité : Madame\nNom : GUÉRIN, née BAZIN Françoise\nDate de naissance : 02/05/1983\nÂge au diagnostic : 35\nLatéralité : gauche\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : III\nSous-type PAM50 : Claudin-low\nStatut ER : négatifs\nStatut PR : négatifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 16\nStade tumoral : I\nGanglions positifs : 0\nIndice de Nottingham : 4,03\nType de chirurgie : chirurgie conservatrice\nÉtat ménopausique : pré-ménopausée\nChimiothérapie : oui\nHormonothérapie : non"}, {"id": 73, "cr_text": "**Compte rendu de fin de traitement de radiothérapie**\n\nMadame GARCIA Suzanne, née le 14 juin 1960, âgée de 60 ans, a bénéficié d'une radiothérapie adjuvante suite à son diagnostic de carcinome canalaire infiltrant (IDC, ductal de type non spécifique (NST)) du sein droit. La tumeur mesurait 27 mm, était classée au stade II, sans atteinte ganglionnaire axillaire, avec un score de Nottingham de 4,05. Les récepteurs hormonaux étaient négatifs (ER négatifs, PR négatifs) et le statut HER2 était également négatif. La patiente a subi une chirurgie conservatrice (tumorectomie) et n'a reçu aucune chimiothérapie adjuvante, mais n'a pas été candidate à une hormonothérapie en raison de l'absence de récepteurs hormonaux positifs.\n\nLa radiothérapie a été initiée après une réunion de concertation pluridisciplinaire où il fut décidé que la radiothérapie adjuvante serait réalisée sur le lit tumoral et les aires ganglionnaires régionales. Un scanner dosimétrique a été réalisé le 15 novembre 2020 afin de définir précisément les volumes cibles. La planification a été effectuée en utilisant une dose totale de 50 Gray (Gy) délivrée en 25 fractions sur 33 jours (du 2 décembre 2020 au 26 décembre 2020), avec une dose quotidienne de 1,5 Gy, conformément aux recommandations pour un carcinome canalaire infiltrant de stade II. La technique employée était une radiothérapie conformationnelle tridimensionnelle (3D-CRT) avec modulation d'intensité (IMRT) pour optimiser la couverture tumorale tout en épargnant les organes à risque. Les volumes cibles incluaient le lit tumoral, les aires ganglionnaires axillaires et sus-claviculaires homolatérales, ainsi que le sein controlatéral.\n\nDurant le traitement, la tolérance générale a été bonne, avec des effets secondaires limités. Des érythèmes cutanés modérés ont été notés au niveau du sein irradié, classés CTCAE grade 1, traités par application topique de crème hydratante et conseils d'hygiène locale. Une fatigue légère a également été rapportée, sans impact significatif sur la qualité de vie. Aucune toxicité pulmonaire significative n'a été observée, avec une dose moyenne au poumon droit de 1,2 Gy (seuil de tolérance < 30 %) et une dose V30 de 5 %, inférieure au seuil maximal acceptable. La dose moyenne cardiaque était de 0,5 Gy (seuil de tolérance < 4 Gy).\n\nÀ l'issue du traitement, le bilan clinique montre une stabilisation de l'état général, avec un score fonctionnel OMS à 100 %. La patiente présente une peau légèrement hyperpigmentée au site d'irradiation, sans signe d'œdème ou d'induration importante. Aucun effet secondaire tardif grave n'est observé.\n\nEn termes de suivi, il est prévu une consultation de contrôle tous les six mois pendant deux ans, puis annuelle, incluant une mammographie annuelle et une échographie mammaire bilatérale. Il convient de poursuivre la surveillance régulière de la patiente pour détecter d'éventuels signes de récidive loco-régionale ou métastatique. \n\nJe certifie avoir respecté toutes les contraintes de dosimétrie et de sécurité, et j'ai assuré une communication claire avec la patiente concernant les attentes et les effets attendus du traitement. Je reste disponible pour toute information supplémentaire.\n\nSigné,\n\n[Nom Prénom]\nOncologue Radiothérapeute\nDate : 26/12/2020", "profile_text": "Civilité : Madame\nNom : GARCIA Suzanne\nDate de naissance : 14/06/1960\nÂge au diagnostic : 60\nLatéralité : droit\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : III\nSous-type PAM50 : Claudin-low\nStatut ER : négatifs\nStatut PR : négatifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 27\nStade tumoral : II\nGanglions positifs : 0\nIndice de Nottingham : 4,05\nType de chirurgie : chirurgie conservatrice\nÉtat ménopausique : post-ménopausée\nChimiothérapie : non\nHormonothérapie : non"}, {"id": 74, "cr_text": "Madame FERRAND, née CHARLES Charlotte, âgée de 65 ans, a bénéficié d'une radiothérapie adjuvante suite à sa mastectomie droite pour un carcinome mixte ductal et lobulaire infiltrant (MDLC) de 27 mm, stade II, grade SBR III, sous-type moléculaire Normal-like, récepteurs hormonaux positifs (ER+), récepteurs progestérone négatifs (PR-), HER2 négatifs, sans envahissement ganglionnaire (0 ganglion positif). La décision de réaliser cette radiothérapie a été prise lors d'une réunion de concertation pluridisciplinaire, tenant compte de son état ménopausique et du profil moléculaire de la tumeur.\n\nLa préparation du traitement comprenait un scanner dosimétrique réalisé le 19/07/2016, permettant de définir précisément les volumes cibles (tissu mammaire restant, cicatrice chirurgicale, aires ganglionnaires régionales) et les organes à risque (poumon droit, cœur gauche). La planification a été effectuée en utilisant une dose totale de 50 Gy délivrée en 25 fractions sur 25 jours, avec une dose par fraction de 2 Gy, en utilisant un accélérateur linéaire de photons de 6 MV. Les contraintes dosimétriques ont été respectées : V20 Gy poumon droit de 10 %, V30 Gy poumon droit de 5 % (seuil maximal autorisé < 20 %) et dose moyenne cardiaque < 4 Gy (conformément aux recommandations).\n\nDurant le traitement, Madame FERRAND a présenté des effets secondaires principalement cutanés (grade 1-2 CTCAE), notamment érythème et sécheresse cutanée, gérés par application topique de crèmes hydratantes et protection solaire. Aucune toxicité sévère (grade > 2) n'a été observée. À la fin du traitement, elle présentait un score fonctionnel OMS de 1, aucun signe de pneumonie radique ou cardiotoxicité aiguë, et une bonne tolérance générale.\n\nÀ l'issue de la radiothérapie, nous avons constaté une réponse complète locale (CR) avec disparition de toute trace tumorale macroscopique. Les contrôles dosimétriques ont confirmé que les doses prescrites ont été atteintes dans tous les volumes cibles, avec une dose moyenne de 50 Gy et une dose maximale de 52,5 Gy au niveau de la cicatrice. Les contraintes aux organes à risque ont été respectées : V20 Gy poumon droit de 10,5 % (inférieur au seuil de 30 %), V30 Gy poumon droit de 5,2 % (inférieur au seuil de 20 %). La dose moyenne cardiaque était de 2,8 Gy (bien inférieure au seuil de 4 Gy).\n\nEn termes de suivi, nous recommandons une surveillance régulière (clinique, mammographie annuelle, IRM mammaire bisannuelle) ainsi qu'un contrôle annuel de l'hormonothérapie adjuvante par anastrozole, initiée en post-mastectomie. Nous conseillons également une surveillance cardiaque adaptée, notamment une échocardiographie annuelle pendant les cinq premières années suivant la radiothérapie.\n\nJe reste à votre disposition pour tout renseignement supplémentaire concernant le suivi de Mme FERRAND.\n\n**Signé**\nDr [Nom Prénom], Oncologue Radiothérapeute\n[Date] 19/07/2016", "profile_text": "Civilité : Madame\nNom : FERRAND, née CHARLES Charlotte\nDate de naissance : 09/04/1951\nÂge au diagnostic : 65\nLatéralité : droit\nType histologique : carcinome mixte ductal et lobulaire infiltrant\nCode OncoTree : MDLC\nSous-type histologique : mixte\nGrade SBR : III\nSous-type PAM50 : Normal-like\nStatut ER : positifs\nStatut PR : négatifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 27\nStade tumoral : II\nGanglions positifs : 0\nIndice de Nottingham : 4,05\nType de chirurgie : mastectomie\nÉtat ménopausique : post-ménopausée\nChimiothérapie : non\nHormonothérapie : oui"}];
