me mammaire infiltrant NOS\nCode OncoTree : BRCA\nSous-type histologique : non renseigné\nGrade SBR : III\nSous-type PAM50 : Basal-like (Triple Négatif)\nStatut ER : négatifs\nStatut PR : négatifs\nStatut HER2 : positifs\nTaille tumorale (mm) : 15\nStade tumoral : I\nGanglions positifs : 0\nIndice de Nottingham : 4,03\nType de chirurgie : chirurgie conservatrice\nÉtat ménopausique : post-ménopausée\nChimiothérapie : non\nHormonothérapie : non"}, {"id": 40, "cr_text": "**Compte rendu de fin de traitement de radiothérapie**\n\nMadame PARIS Valérie, née le 15 février 1963, âgée de 56 ans, a bénéficié d'une radiothérapie adjuvante suite à son diagnostic de carcinome canalaire infiltrant (IDC) du sein droit, de type ductal non spécifique (NST), grade SBR II, sous-type moléculaire Claudin-low, exprimant les récepteurs hormonaux (positifs) mais n'exprimant pas les récepteurs progestérone (négatifs) et n'étant pas surexprimant le récepteur HER2 (négatifs). La tumeur mesurait 14 millimètres, le stade était II avec 1 ganglion axillaire positif, et l'indice pronostique de Nottingham était de 4,03. Une chirurgie conservatrice avait été réalisée préalablement. \n\nLa décision de réaliser une radiothérapie adjuvante a été prise lors d'une réunion de concertation pluridisciplinaire. Un scanner dosimétrique a été effectué le 08/05/2019 afin de planifier précisément la radiothérapie. Le traitement a été réalisé sur un accélérateur linéaire de 6 MV, utilisant une technique de conformal radiotherapy (CRT) avec modulation d'intensité (IMRT) pour optimiser la dose délivrée à la tumeur tout en épargnant les tissus sains avoisinants. Les volumes ciblés comprenaient le lit tumoral initial, le sein entier, ainsi que les aires ganglionnaires régionales (axillaires, sus-claviculaires et mammaires internes).\n\nLe planning de traitement comprenait 15 fractions hebdomadaires, étalées sur environ 19 jours (du 15 mai 2019 au 03 juillet 2019), avec une dose totale cible de 50 Gray (Gy) délivrée à la zone tumorale initiale (cible primaire) et 45 Gy au sein entier. La dose moyenne par fraction était de 2,0 Gy, avec une dose maximale de 2,5 Gy par séance. Les contraintes aux organes à risque ont été respectées : la dose moyenne au poumon droit était de 15,5 Gy (seuil maximal autorisé < 30 %) et celle au cœur était inférieure à 2,5 Gy (seuil maximal autorisé < 4 Gy côté gauche).\n\nDurant le traitement, Madame PARIS a présenté des effets secondaires principalement cutanés, notamment une érythème grade 2 (CTCAE v5.0) au niveau du sein irradié, traité par application topique de crème hydratante et protection solaire. Aucune complication grave n'a été observée. À la fin du traitement, elle présentait un score fonctionnel OMS de 1, sans perte de poids significative (poids stable à 65 kg). \n\nÀ noter que l'hormonothérapie adjuvante par anastrozole (Arimidex®) a été initiée dès la fin de la radiothérapie, en accord avec le statut post-ménopausique de la patiente et le sous-type moléculaire Claudin-low. Aucun traitement anti-HER2 n’a été nécessaire en raison du statut HER2 négatif. \n\nEn termes de surveillance, nous recommandons un suivi régulier tous les 3 mois pendant deux ans, puis semestriellement jusqu'à 5 ans, incluant mammographie annuelle, échographie mammaire, examens sanguins (marqueurs tumoraux) et consultation oncologique. \n\nJe certifie avoir pris connaissance des résultats de la radiothérapie et des conditions de suivi.\n\n**Signature**\nDr [Nom Prénom], Oncologue Radiothérapeute\nDate : 08 août 2019", "profile_text": "Civilité : Madame\nNom : PARIS Valérie\nDate de naissance : 15/02/1963\nÂge au diagnostic : 56\nLatéralité : droit\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : II\nSous-type PAM50 : Claudin-low\nStatut ER : positifs\nStatut PR : négatifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 14\nStade tumoral : II\nGanglions positifs : 1\nIndice de Nottingham : 4,03\nType de chirurgie : chirurgie conservatrice\nÉtat ménopausique : post-ménopausée\nChimiothérapie : non\nHormonothérapie : oui"}, {"id": 41, "cr_text": "Voici le compte rendu de fin de traitement de radiothérapie pour Madame NICOLAS Anouk, née le 18 novembre 1958, âgée de 64 ans, présentant un carcinome canalaire infiltrant (IDC, ductal de type non spécifique (NST)) du sein gauche, de grade SBR III, sous-type moléculaire Luminal B, avec expression des récepteurs hormonaux (positifs pour les récepteurs aux œstrogènes et à la progestérone) et négativité HER2. La tumeur mesurait 23 millimètres, stade II, sans atteinte ganglionnaire (0 ganglion positif). Un index pronostique de Nottingham de 4,05 a été calculé. Une chirurgie conservatrice a été réalisée, suivie d'une hormonothérapie adjuvante en raison de son état post-ménopausique, sans chimiothérapie préalable.\n\nLa radiothérapie a été initiée le 15 janvier 2023, après une planification dosimétrique basée sur un scanner thoracique réalisé le 10 janvier 2023. Les volumes ciblés comprenaient le lit tumoral, la région axillaire homolatérale jusqu'à 3 cm en amont de la clavicule, ainsi que le sein controlatéral. La dose totale délivrée était de 50 Gray (Gy) en 25 fractions, réparties sur 33 jours, avec une dose moyenne quotidienne de 1,5 Gy et une dose maximale de 2,0 Gy par fraction. La technique employée était conforme aux recommandations actuelles pour un cancer du sein de stade II, avec une attention particulière portée aux organes à risque (poumon et cœur). La dose moyenne au poumon droit était maintenue inférieure à 30 %, celle au poumon gauche à moins de 20 %, et la dose moyenne cardiaque restait inférieure à 4 Gy côté gauche.\n\nMadame NICOLAS a bien toléré le traitement, avec des effets secondaires principalement limités à une fatigue modérée (grade CTCAE 1) et une érythème cutané léger (grade 1) pendant la deuxième semaine de traitement, qui ont été gérés par application topique de crèmes émollientes et conseils de protection solaire. Aucune toxicité plus sévère n'a été observée. À la fin du traitement, le score fonctionnel OMS était inchangé, stable à 0, et son poids était resté stable autour de 65 kg. Aucun signe de pneumonie radique ou de cardiotoxicité n’a été détecté lors du dernier contrôle.\n\nEn conclusion, la radiothérapie adjuvante a été complétée sans complication majeure. Nous recommandons la poursuite de l'hormonothérapie adjuvante (tamoxifène 20 mg/jour) pendant cinq ans, conformément aux guidelines NCCN, ainsi qu’une surveillance régulière tous les six mois incluant mammographie annuelle, échographie mammaire et examens sanguins. La prochaine consultation de suivi est prévue pour juin 2023.\n\nPour information, cette patiente bénéficie également d’un suivi gynécologique annuel pour surveiller les effets tardifs potentiels liés à l’hormonothérapie.\n\nJe certifie avoir rédigé ce compte rendu en tant qu'oncologue radiothérapeute responsable du traitement.\n\nDr [Nom Prénom], Oncologue Radiothérapeute\n[Signature]\n\nDate : 02 février 2023", "profile_text": "Civilité : Madame\nNom : NICOLAS Anouk\nDate de naissance : 18/11/1958\nÂge au diagnostic : 64\nLatéralité : gauche\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : III\nSous-type PAM50 : Luminal B\nStatut ER : positifs\nStatut PR : positifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 23\nStade tumoral : II\nGanglions positifs : 0\nIndice de Nottingham : 4,05\nType de chirurgie : chirurgie conservatrice\nÉtat ménopausique : post-ménopausée\nChimiothérapie : non\nHormonothérapie : oui"}, {"id": 42, "cr_text": "**Compte rendu de fin de traitement de radiothérapie**\n\nÀ Madame **MARQUES, née BARTHELEMY Chantal**, née le 16 août 1972, âgée de 45 ans, ayant subi une chirurgie conservatrice pour un carcinome canalaire infiltrant (IDC, ductal de type non spécifique (NST)) du sein droit, grade SBR III, sous-type moléculaire Claudin-low, récepteurs hormonaux négatifs (ER négatifs, PR négatifs), HER2 négatifs, taille tumorale 25 mm, stade II, 3 ganglions axillaires positifs, indice de Nottingham 5,05.\n\nContexte thérapeutique : La patiente a bénéficié d'une chimiothérapie adjuvante (FEC100 suivi d'un taxane) avant la radiothérapie, conformément aux recommandations de la réunion de concertation pluridisciplinaire. Aucune hormonothérapie n'a été prescrite en raison de l'absence d'expression des récepteurs hormonaux. \n\nPréparation du traitement : Un scanner dosimétrique a été réalisé le 14 janvier 2023 afin de définir précisément les volumes cibles (tissu mammaire restant, aires ganglionnaires régionales, marges chirurgicales). La planification a été effectuée en utilisant une dose totale de 50 Gy sur le tissu mammaire restant, délivrée en 25 fractions de 2 Gy chacune, avec une dose moyenne de 2 Gy par fraction. Les organes à risque ont été protégés grâce à une technique d'arcature modifiée, visant à limiter la dose au poumon droit à moins de 30 % de sa volume pulmonaire total (V20 Gy < 30 %) et au cœur à moins de 4 Gy côté gauche (dose moyenne cardiaque < 4 Gy).\n\nDéroulement du traitement : La radiothérapie a débuté le 2 février 2023 et s'est achevée le 2 mars 2023, soit un étalement de 28 jours calendaires (14 semaines), conforme à l'étalement attendu pour 25 fractions hebdomadaires. Le traitement a été effectué avec un accélérateur linéaire de 6 MV, en position couchée, avec vérifications régulières de la positionnement par imagerie per-opératoire (IGRT) pour assurer la précision du ciblage. \n\nToxicités : La tolérance globale a été bonne, avec des effets secondaires principalement limités à une fatigue légère (grade 1 CTCAE) et une érythème cutané modéré (grade 2 CTCAE) pendant les dernières semaines de traitement. Aucun signe de pneumonie radique ni de cardiotoxicité n'a été observé. Une crème hydratante a été prescrite pour atténuer l'érythème cutané, et des conseils de repos ont été donnés pour gérer la fatigue.\n\nBilan de fin de traitement : À la fin de la radiothérapie, l'examen clinique montre un score fonctionnel OMS de 1, aucune toxicité aiguë sévère n'est présente. La patiente pèse 60 kg, stable depuis le début du traitement. \n\nSuites thérapeutiques : La surveillance régulière sera poursuivie tous les 3 mois durant les deux premières années, puis tous les 6 mois les trois années suivantes, incluant mammographie annuelle, échographie mammaire et examens sanguins. La poursuite de la chimiothérapie adjuvante est prévue jusqu'à son achèvement prévu (total de 6 cycles). \n\nRecommandations : Il est conseillé à la patiente de poursuivre son traitement hormonal actuel (aucune hormonothérapie n'est prescrite ici car les récepteurs hormonaux sont négatifs) et de signaler immédiatement tout symptôme nouveau ou persistant à son équipe soignante. \n\nSigné électroniquement,\n\nDr [Nom Prénom], Oncologue Radiothérapeute\n[Date] : 14 mars 2023", "profile_text": "Civilité : Madame\nNom : MARQUES, née BARTHELEMY Chantal\nDate de naissance : 16/08/1972\nÂge au diagnostic : 45\nLatéralité : droit\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : III\nSous-type PAM50 : Claudin-low\nStatut ER : négatifs\nStatut PR : négatifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 25\nStade tumoral : II\nGanglions positifs : 3\nIndice de Nottingham : 5,05\nType de chirurgie : chirurgie conservatrice\nÉtat ménopausique : pré-ménopausée\nChimiothérapie : oui\nHormonothérapie : non"}, {"id": 43, "cr_text": "**Compte rendu de fin de traitement de radiothérapie mammaire**\n\nMadame LEBRETON, née AUBERT Adrienne, âgée de 80 ans, a bénéficié d'une radiothérapie adjuvante suite à une mastectomie droite réalisée pour un carcinome canalaire infiltrant (IDC, ductal de type non spécifique NST) de 38 mm, grade SBR II, sous-type moléculaire Luminal B, exprimant les récepteurs hormonaux (positifs) et les récepteurs progestérones (positifs), mais négatifs pour le récepteur HER2. La patiente était post-ménopausée lors du diagnostic. Un total de deux ganglions axillaires étaient envahis (indice de Nottingham 4,08).\n\nLa radiothérapie a été initiée après une réunion de concertation pluridisciplinaire où il fut décidé de proposer une irradiation de la région mammaire et axillaire. Un scanner dosimétrique a été réalisé pour planifier précisément le volume cible incluant le lit tumoral initial, la paroi thoracique, les aires ganglionnaires axillaires et supra-claviculaires. Les contraintes aux organes à risque ont été soigneusement évaluées : la dose moyenne au poumon droit a été maintenue inférieure à 20 % de sa capacité fonctionnelle (V30 Gy < 20 %) et celle au cœur gauche a été limitée à moins de 4 Gy (dose moyenne cardiaque < 4 Gy). Le traitement a été délivré sur un accélérateur linéaire de particules utilisant une énergie de 6 MV, avec une technique de conformal radiation therapy (CRT) adaptative. La dose totale prescrite était de 50 Gray (Gy) en 25 fractions sur 33 jours, soit une dose quotidienne de 1,5 Gy par fraction. La dose maximale délivrée dans le volume cible principal était de 60 Gy, avec une dose minimale de 45 Gy.\n\nDurant le traitement, Madame LEBRETON a présenté une fatigue modérée (grade 1 CTCAE v5.0) et une irritation cutanée légère (érythème grade 2) au niveau du site irradié, gérées par application topique de crèmes émollientes et hydratantes. Aucune complication majeure n'a été observée. À la fin du traitement, son état général reste stable, elle conserve un score performance status OMS de 1, sans perte de poids significative. La tolérance générale au traitement a été jugée acceptable.\n\nÀ l'issue de cette radiothérapie adjuvante, nous recommandons la poursuite de l'hormonothérapie par anastrozole (Arimidex®) pendant cinq ans, conforme à son statut hormonal et au sous-type moléculaire Luminal B. Une surveillance régulière sera assurée par mammographie annuelle et échographie mammaire controlatérale, ainsi que par imagerie thoraco-abdomino-pelvienne tous les six mois pour suivre l'évolution. La prochaine consultation de suivi est prévue dans trois mois.\n\nEn conclusion, la radiothérapie adjuvante a été complétée sans incident majeur, respectant les contraintes dosimétriques fixées. Nous remercions Madame LEBRETON pour sa participation active et sa collaboration tout au long du traitement.\n\nFait à [lieu], le 13 mars 2015.\n\n[Signature] Dr [Nom Prénom]\n\nOncologue Radiothérapeute", "profile_text": "Civilité : Madame\nNom : LEBRETON, née AUBERT Adrienne\nDate de naissance : 13/01/1935\nÂge au diagnostic : 80\nLatéralité : droit\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : II\nSous-type PAM50 : Luminal B\nStatut ER : positifs\nStatut PR : positifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 38\nStade tumoral : non renseigné\nGanglions positifs : 2\nIndice de Nottingham : 4,08\nType de chirurgie : mastectomie\nÉtat ménopausique : post-ménopausée\nChimiothérapie : non\nHormonothérapie : oui"}, {"id": 44, "cr_text": "Voici le compte rendu de fin de traitement de radiothérapie pour Madame BLONDEL Simone, née le 24 décembre 1963, âgée de 58 ans, présentant un carcinome canalaire infiltrant (IDC, ductal de type non spécifique (NST)) du sein droit, grade SBR I, sous-type moléculaire Luminal A, avec expression des récepteurs hormonaux (positifs pour les récepteurs aux œstrogènes et à la progestérone) et absence de surexpression du récepteur HER2, stade II, 1 ganglion axillaire métastatique, indice de Nottingham 3,04. La patiente a bénéficié d'une chirurgie conservatrice (tumorectomie suivie d'une radiothérapie adjuvante).\n\nLa radiothérapie a été réalisée sur un accélérateur linéaire de 6 MV, avec une dose totale de 50 Gray (Gy) délivrée en 25 fractions sur 33 jours (étalement de 33 jours, conforme à l'étalement habituel pour 25 fractions). Les volumes ciblés comprenaient le lit tumoral initial, la région péri-tumorale et les aires ganglionnaires axillaires homolatérales. La dose moyenne était de 2,0 Gy par fraction, avec une dose maximale de 3,0 Gy au niveau du lit tumoral. \n\nConcernant les organes à risque, la dose moyenne au poumon droit a été maintenue inférieure à 20% de sa volume pulmonaire total (V20 < 20%), conformément aux recommandations, tandis que la dose moyenne au cœur a été limitée à moins de 4 Gy (limitation stricte pour éviter tout dommage cardiaque). \n\nLa tolérance au traitement a été globalement bonne, avec quelques épisodes de fatigue modérée (grade 1 CTCAE) et de dermite cutanée légère (grade 2 CTCAE) au cours des dernières semaines de traitement, gérés par application topique de crème hydratante et conseils d'hygiène locale. Aucune toxicité sévère (grade ≥ 3) n'a été observée. \n\nAu moment du bilan de fin de traitement, l'état général de la patiente est satisfaisant, son score fonctionnel OMS est inchangé (0), et elle présente une stabilisation pondérale (poids stable depuis le début du traitement). \n\nEn termes de suites, la patiente poursuit son hormonothérapie adjuvante par anastrozole (aromatase-inhibiteur, adapté à son état post-ménopausique) pendant cinq ans, initiée avant la radiothérapie. Elle bénéficiera également d’une surveillance régulière incluant mammographie annuelle, échographie mammaire semestrielle, ainsi qu’un suivi clinico-biologique tous les six mois pour évaluer la réponse globale au traitement et détecter d’éventuels signes de récidive ou de progression. \n\nJe reste à disposition pour toute information supplémentaire concernant cette prise en charge.\n\nSigné,\n\n[Prénom Nom], Oncologue Radiothérapeute \n\nDate : 14 mai 2022", "profile_text": "Civilité : Madame\nNom : BLONDEL Simone\nDate de naissance : 24/12/1963\nÂge au diagnostic : 58\nLatéralité : droit\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : I\nSous-type PAM50 : Luminal A\nStatut ER : positifs\nStatut PR : positifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 20\nStade tumoral : II\nGanglions positifs : 1\nIndice de Nottingham : 3,04\nType de chirurgie : chirurgie conservatrice\nÉtat ménopausique : post-ménopausée\nChimiothérapie : non\nHormonothérapie : oui"}, {"id": 45, "cr_text": "**Compte rendu de fin de traitement de radiothérapie**\n\nObjet : Compte rendu de fin de traitement de radiothérapie mammaire pour MARY RENAE née le 07 mai 1951, 70 ans, sein gauche, carcinome canalaire infiltrant (IDC, ductal de type non spécifique (NST)) grade SBR III, sous-type moléculaire Luminal B, ER positifs, PR positifs, HER2 positifs, 40 mm, stade II, 3 ganglions positifs, indice de Nottingham 5,08, mastectomie, post-ménopausée, hormonothérapie adjuvante.\n\nMadame MARY RENAE, née le 07 mai 1951, âgée de 70 ans, a bénéficié d'une radiothérapie adjuvante suite à sa mastectomie gauche pour un carcinome canalaire infiltrant (IDC, ductal de type non spécifique (NST)), grade SBR III, sous-type moléculaire Luminal B, exprimant les récepteurs hormonaux (ER positifs, PR positifs), HER2 positifs, mesurant 40 mm, stade II, avec 3 ganglions axillaires envahis, indice de Nottingham 5,08. La patiente est post-ménopausée et bénéficie d'une hormonothérapie adjuvante par anastrozole.\n\nLa radiothérapie a été initiée après une réunion de concertation pluridisciplinaire où il a été décidé de compléter son traitement chirurgical par une irradiation locale. Un scanner dosimétrique a été réalisé le 15 janvier 2022 pour planifier le volume cible incluant le lit tumoral, les aires ganglionnaires régionales (axillaire, sus-claviculaire, mammaire interne) ainsi que le tissu mammaire restant. La dose totale prescrite était de 50 Gray (Gy) délivrée en 25 fractions sur 33 jours, avec une dose quotidienne de 1,5 Gy, conformément aux recommandations actuelles pour un cancer de stade II avec atteinte ganglionnaire. Les contraintes aux organes à risque ont été respectées : la dose moyenne au poumon droit était de 10,5 % V20 (seuil maximal autorisé < 30 %) et la dose moyenne au cœur était inférieure à 2 Gy (seuil maximal < 4 Gy).\n\nDurant le traitement, la patiente a présenté une fatigue modérée (grade 1 CTCAE v5.0) et une érythème cutané léger (grade 2 CTCAE v5.0) nécessitant une adaptation temporaire du calendrier de traitement. Aucune complication majeure n'a été observée. À la fin du traitement, le score fonctionnel OMS est resté inchangé (0), et la patiente a maintenu son poids stable.\n\nÀ l'issue de cette radiothérapie, nous avons observé une bonne réponse locale et régionale, sans signe de récidive locale ou métastatique. La patiente poursuit actuellement son hormonothérapie adjuvante par anastrozole, dont la durée prévue est de cinq ans. Nous recommandons une surveillance régulière comprenant des mammographies annuelles, des échographies mammaires et axillaires tous les six mois, ainsi qu'un suivi biologique annuel (marqueurs tumoraux, examens sanguins, imagerie si nécessaire) pour détecter d'éventuelles rechutes ou complications tardives.\n\nEn conclusion, la radiothérapie adjuvante a été réalisée sans incident majeur, avec une bonne tolérance globale. La patiente est invitée à poursuivre ses consultations régulières chez son oncologue pour ajuster son traitement hormonal et surveiller son évolution.\n\nSigné,\n\n[Nom Prénom]\nOncologue Radiothérapeute\nDate : 07 mars 2022", "profile_text": "Civilité : Madame\nNom : MARY Renée\nDate de naissance : 07/05/1951\nÂge au diagnostic : 70\nLatéralité : gauche\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : III\nSous-type PAM50 : Luminal B\nStatut ER : positifs\nStatut PR : positifs\nStatut HER2 : positifs\nTaille tumorale (mm) : 40\nStade tumoral : II\nGanglions positifs : 3\nIndice de Nottingham : 5,08\nType de chirurgie : mastectomie\nÉtat ménopausique : post-ménopausée\nChimiothérapie : non\nHormonothérapie : oui"}, {"id": 46, "cr_text": "**Compte rendu de fin de traitement de radiothérapie**\n\nMadame DELAHAYE, née CLÉMENT Susan, âgée de 60 ans, a bénéficié d'une radiothérapie adjuvante suite à une mastectomie pour un carcinome canalaire infiltrant (IDC, ductal de type non spécifique (NST)) du sein gauche. La tumeur mesurait 16 mm, était classée au stade I, avec un score de Nottingham de 4,03, exprimant les récepteurs hormonaux (positifs pour les récepteurs aux œstrogènes et à la progestérone) et négative pour le récepteur HER2. Elle était en état post-ménopausique au moment du diagnostic.\n\nLa décision de réaliser cette radiothérapie a été prise lors d’une réunion de concertation pluridisciplinaire (RCP) tenant compte de son âge, du stade initial de la maladie, du type histologique et du sous-type moléculaire Normal-like. Un scanner dosimétrique a été réalisé pour définir précisément les volumes cibles (tissu mammaire restant, paroi thoracique, aires ganglionnaires axillaires homolatérales) et optimiser la planification. La dose totale prescrite était de 50 Gray (Gy) délivrée en 25 fractions sur 33 jours, avec une dose quotidienne de 1,5 Gy, utilisant un faisceau de photons de 6 MV. Les contraintes aux organes à risque ont été respectées : V20 Gy poumon droit de 12,5 % (norme < 30 %) et dose moyenne cardiaque de 2,5 Gy (contrainte < 4 Gy côté gauche).\n\nAu cours du traitement, Madame DELAHAYE a présenté quelques effets secondaires modérés, notamment une érythème cutané de grade 2 (CTCAE v5.0) et une fatigue légère (grade 1), gérés par application topique de crèmes émollientes et soutien psychologique. Aucune complication grave n’a été observée.\n\nÀ la fin du traitement, elle présentait un score fonctionnel de l'Organisation Mondiale de la Santé (OMS) de 0, aucun signe de toxicité aiguë résiduelle, et son poids était stable. Les contrôles biologiques et imageries ultérieurs seront programmés pour surveiller l'évolution.\n\nEn termes de suivi, elle poursuit une hormonothérapie par anastrozole (adaptée à son état post-ménopausique) et reçoit également une chimiothérapie adjuvante (FEC100 suivie d’un taxane, administrée avant la radiothérapie). Une surveillance régulière sera assurée par son équipe oncologique, incluant examens cliniques, mammographies et IRM mammaires, ainsi que des bilans sanguins réguliers.\n\nJe certifie avoir assuré le suivi de Madame DELAHAYE pendant sa radiothérapie et confirme la bonne tolérance globale du traitement.\n\nDr [Nom Prénom], Oncologue Radiothérapeute, 24 janvier 2023.", "profile_text": "Civilité : Madame\nNom : DELAHAYE, née CLÉMENT Susan\nDate de naissance : 02/06/1962\nÂge au diagnostic : 60\nLatéralité : gauche\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : III\nSous-type PAM50 : Normal-like\nStatut ER : positifs\nStatut PR : positifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 16\nStade tumoral : I\nGanglions positifs : 0\nIndice de Nottingham : 4,03\nType de chirurgie : mastectomie\nÉtat ménopausique : post-ménopausée\nChimiothérapie : oui\nHormonothérapie : oui"}, {"id": 47, "cr_text": "**Compte rendu de fin de traitement de radiothérapie mammaire**\n\nMadame POIRIER, née ALEXANDRE Corinne, âgée de 70 ans, a bénéficié d'une radiothérapie adjuvante suite à son diagnostic de carcinome canalaire infiltrant (IDC, ductal de type non spécifique (NST)) du sein droit, grade SBR II, sous-type moléculaire Luminal A, récepteurs hormonaux positifs (ER), récepteurs progestérone négatifs (PR), HER2 négatifs, taille tumorale de 35 mm, stade II, avec 1 ganglion axillaire positif, indice de Nottingham 4,07. La patiente a subi une chirurgie conservatrice (tumorectomie suivie d'une lymphadénectomie axillaire) et bénéficie d'une hormonothérapie adjuvante par anastrozole (Arimidex®) en raison de son état post-ménopausique. Une réunion de concertation pluridisciplinaire a été organisée pour définir le plan de soins optimal.\n\nLa préparation du traitement comprenait un scanner dosimétrique réalisé le 15/06/2023, permettant la planification précise de la radiothérapie. La dose totale prescrite était de 50 Gray (Gy) délivrée sur 25 fractions, réparties sur 33 jours (du 20/06/2023 au 25/07/2023), avec une séance quotidienne du lundi au vendredi, excluant les week-ends. Les volumes ciblés comprenaient le lit tumoral, la région axillaire et la paroi thoracique, traités par un faisceau externe de photons de 6 MV. La dose moyenne hebdomadaire était de 1,5 Gy, avec une dose maximale de 2,0 Gy par fraction. Des techniques d'IMRT ont été utilisées pour optimiser la protection des organes à risque.\n\nDurant le traitement, la tolérance générale a été bonne, avec des effets secondaires limités. Les toxicités aiguës étaient principalement cutanées (grade 1-2 CTCAE) : érythème, prurit, desquamation, résolus spontanément ou avec application topique de crèmes émollientes. Aucune toxicité tardive significative n'a été observée lors du dernier contrôle (score OMS 0). La patiente a maintenu son poids stable pendant le traitement (-1 kg).\n\nAu terme de la radiothérapie, le bilan dosimétrique montre que les contraintes aux organes à risque ont été respectées : V20 Gy poumon droit de 17,5 % (seuil normal < 30 %) et dose moyenne cardiaque de 1,5 Gy (seuil normal < 4 Gy côté gauche). La dose cible au sein atteint 50 Gy, avec une couverture complète du volume traité.\n\nEn conclusion, Madame POIRIER a terminé sa radiothérapie adjuvante sans complications majeures. Elle poursuit actuellement son hormonothérapie par anastrozole (Arimidex®) pour cinq ans. Un suivi rapproché est prévu tous les six mois durant deux ans, puis annuellement, incluant mammographie annuelle, échographie mammaire et examens sanguins (marqueurs tumoraux, fonction hépatique, rénale, osseuse). Il est recommandé de poursuivre la surveillance régulière des effets secondaires potentiels liés à l'hormonothérapie (tremblements, douleurs articulaires, fatigue) et de signaler tout symptôme nouveau ou persistant.\n\nSigné,\n\nDr [Nom Prénom], Oncologue Radiothérapeute, 06/09/2023", "profile_text": "Civilité : Madame\nNom : POIRIER, née ALEXANDRE Corinne\nDate de naissance : 17/01/1953\nÂge au diagnostic : 70\nLatéralité : droit\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : II\nSous-type PAM50 : Luminal A\nStatut ER : positifs\nStatut PR : négatifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 35\nStade tumoral : II\nGanglions positifs : 1\nIndice de Nottingham : 4,07\nType de chirurgie : chirurgie conservatrice\nÉtat ménopausique : post-ménopausée\nChimiothérapie : non\nHormonothérapie : oui"}, {"id": 48, "cr_text": "Madame COLLET, née PRUVOST Susan, âgée de 65 ans, a bénéficié d'une radiothérapie adjuvante suite à son diagnostic de carcinome canalaire infiltrant (IDC, ductal de type non spécifique (NST)) du sein gauche, stade I, grade SBR II, sous-type moléculaire Luminal A, exprimant les récepteurs hormonaux (ER positifs, PR positifs, HER2 négatifs), mesurant 20 mm, sans atteinte ganglionnaire (0 ganglion positif). La patiente a subi une chirurgie conservatrice (tumorectomie) suivie d'une radiothérapie externe conformationnelle à l'aide d'un accélérateur linéaire, conformément aux recommandations issues de la réunion de concertation pluridisciplinaire. \n\nLa planification dosimétrique a été réalisée sur la base d'un scanner thoracique, permettant de définir précisément les volumes cibles (tissu mammaire restant, aires ganglionnaires axillaires, et marges chirurgicales) et les organes à risque (poumons, cœur). Les paramètres techniques ont été ajustés pour délivrer une dose totale de 50 Gray (Gy) en 25 fractions, réparties sur 33 jours (étalement conforme à 25 fractions × 1,4 jours environ). Chaque séance comprenait une dose unique de 2 Gy, avec une dose moyenne de 50 Gy et une dose maximale de 55 Gy au niveau du tissu cible. Les contraintes aux organes à risque étaient respectées : V20 Gy poumon droit de 15 %, V30 Gy poumon droit de 10 % (seuil maximal autorisé < 30 % et < 20 % respectivement), et dose moyenne cardiaque de 2,5 Gy (seuil maximal < 4 Gy côté gauche).\n\nDurant le traitement, la patiente a présenté quelques effets secondaires légers (grade 1 CTCAE) : érythème cutané modéré, fatigue, et inconfort local transitoire. Ces symptômes ont été gérés par des soins locaux (crèmes hydratantes, repos) et se sont atténués progressivement. Aucune complication majeure n'a été observée. À la fin du traitement, l'état général était satisfaisant, avec un score fonctionnel OMS à 90 %. \n\nEn termes de surveillance, la patiente bénéficiera d'un suivi régulier incluant mammographie annuelle et échographie mammaire, ainsi que des bilans sanguins et endocrinologiques pour surveiller l'efficacité de l'hormonothérapie (administrée en post-chirurgie, anastrozole 1 mg/jour pendant cinq ans, adaptée à son état post-ménopausique). Aucun traitement anti-HER2 n'est nécessaire étant donné le statut HER2 négatif. \n\nJe certifie avoir réalisé ce compte rendu le 03 octobre 2016.\n\nDr [Nom Prénom], Oncologue Radiothérapeute.", "profile_text": "Civilité : Madame\nNom : COLLET, née PRUVOST Susan\nDate de naissance : 28/11/1950\nÂge au diagnostic : 65\nLatéralité : gauche\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : II\nSous-type PAM50 : Luminal A\nStatut ER : positifs\nStatut PR : positifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 20\nStade tumoral : I\nGanglions positifs : 0\nIndice de Nottingham : 3,04\nType de chirurgie : chirurgie conservatrice\nÉtat ménopausique : post-ménopausée\nChimiothérapie : non\nHormonothérapie : oui"}, {"id": 49, "cr_text": "**Compte rendu de fin de traitement de radiothérapie**\n\nMadame MARCHAL, née BOUVET Claudine, née le 20 janvier 1969, âgée de 49 ans, a bénéficié d'une radiothérapie adjuvante après une chirurgie conservatrice pour un carcinome canalaire infiltrant (IDC, ductal de type non spécifique (NST)) du sein gauche. La tumeur mesurait 17 mm, était classée grade SBR III, exprimait un sous-type moléculaire Basal-like (Triple-Négatif), avec des récepteurs hormonaux négatifs (ER négatifs, PR négatifs) et un statut HER2 négatif. Trois ganglions axillaires étaient envahis, avec un indice de Nottingham de 5,03. \n\nLa patiente a été traitée par chimiothérapie adjuvante (FEC100 suivi d'un taxane) avant la radiothérapie. Une réunion de concertation pluridisciplinaire a validé cette stratégie thérapeutique. Un scanner dosimétrique a été réalisé le 15 septembre 2018 pour planifier la radiothérapie. \n\nLa radiothérapie a été administrée sur un faisceau externe à l'aide d'un accélérateur linéaire de 6 MV, utilisant une technique de conformal therapy. Les volumes cibles comprenaient le lit tumoral, le sein entier et les aires ganglionnaires régionales. Le traitement a commencé le 2 octobre 2018 et s'est terminé le 20 novembre 2018, soit 40 fractions sur 42 jours (étalement de 43 jours, cohérent avec 40 fractions). \n\nLa dose totale délivrée au lit tumoral était de 50,4 Gy, répartie en 25 fractions de 2,02 Gy chacune, avec une dose maximale locale de 60,5 Gy. La dose moyenne au poumon droit était de 11,2 Gy (seuil de tolérance < 30 %) et la dose moyenne au cœur était de 1,5 Gy (seuil de tolérance < 4 Gy).\n\nLa tolérance au traitement a été globalement bonne, avec des toxicités cutanées mineures (grade 1 CTCAE) sous forme d’érythème et d’oedème, gérées par application topique de crèmes émollientes. Aucune complication majeure n'a été observée. \n\nA la fin du traitement, l’état général de Mme MARCHAL est satisfaisant, son score fonctionnel OMS est inchangé (0). Elle présente une légère fatigue persistante (grade 1 CTCAE), sans autre effet secondaire notable. \n\nEn termes de surveillance, elle sera suivie régulièrement tous les six mois pendant cinq ans, avec imagerie mammaire annuelle et examens sanguins biologiques. \n\nIl est prévu que Mme MARCHAL poursuive sa hormonothérapie adjuvante par anastrozole (en raison de son état pré-ménopausique) jusqu'à cinq ans. Aucun traitement anti-HER2 n’a été initié car le statut HER2 est négatif. \n\nJe reste à disposition pour toute information supplémentaire concernant la suite de la prise en charge.\n\n**Signé**\nDr [Nom Prénom], Oncologue Radiothérapeute\n\n[Date] : 20 octobre 2018", "profile_text": "Civilité : Madame\nNom : MARCHAL, née BOUVET Claudine\nDate de naissance : 20/01/1969\nÂge au diagnostic : 49\nLatéralité : gauche\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : III\nSous-type PAM50 : Basal-like (Triple Négatif)\nStatut ER : négatifs\nStatut PR : négatifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 17\nStade tumoral : non renseigné\nGanglions positifs : 3\nIndice de Nottingham : 5,03\nType de chirurgie : chirurgie conservatrice\nÉtat ménopausique : pré-ménopausée\nChimiothérapie : oui\nHormonothérapie : non"}, {"id": 50, "cr_text": "Madame DUPONT Danielle, née le 22 avril 1943, âgée de 80 ans, a bénéficié d'une radiothérapie adjuvante suite à une chirurgie conservatrice pour un carcinome mixte ductal et lobulaire infiltrant (MDLC) du sein droit. Les analyses histologiques ont révélé un sous-type moléculaire luminal B, avec expression des récepteurs hormonaux (positivité des récepteurs aux œstrogènes [ER] et à la progestérone [PR]) et absence d'expression du récepteur HER2. La tumeur mesurait 30 millimètres, était classée au stade II avec cinq ganglions axillaires positifs, et présentait un index de Nottingham de 3,06. \n\nLa décision de réaliser une radiothérapie adjuvante a été prise lors d'une réunion de concertation pluridisciplinaire, tenant compte de son état ménopausé et de l'absence de chimiothérapie préalable. Un scanner dosimétrique a permis de définir précisément les volumes cibles (tissu mammaire restant, aires ganglionnaires régionales, notamment l'aile interne axillaire) et les organes à risque (poumon, cœur). La planification a été réalisée en utilisant un accélérateur linéaire délivrant des faisceaux de photons de 6 MV, avec une dose totale cible de 50 Gray (Gy) sur 25 fractions, réparties sur 33 jours (étalement de 1,32 jour par fraction, cohérent avec un rythme hebdomadaire de 5 séances du lundi au vendredi, pauses week-end comprises).\n\nLes contraintes dosimétriques étaient respectées : la dose moyenne au poumon droit était de 1,5 Gy (seuil maximal autorisé < 30 %) et celle au cœur gauche < 2 Gy (seuil maximal autorisé < 4 Gy). La dose maximale au poumon droit n’a pas dépassé 2,5 Gy. \n\nDurant le traitement, Madame DUPONT a présenté une réaction cutanée modérée (grade 2 selon CTCAE v5.0) localisée au site irradié, caractérisée par une érythème et une desquamation, gérée par application topique de crèmes émollientes et conseils d’hygiène locale. Aucune autre toxicité significative n’a été observée. Au bilan de fin de traitement, elle présente un score fonctionnel OMS de 1, stable, avec une perte de poids négligeable (< 2 kg). \n\nEn termes de suites, elle bénéficie actuellement d’une hormonothérapie adjuvante par anastrozole (aromatase-inhibiteur, adapté à son statut post-ménopausé) pendant 5 ans, initiée dès la fin de la radiothérapie. Une surveillance régulière est prévue tous les 3 mois durant deux ans, puis annuelle, incluant mammographie, échographie mammaire et examens biologiques (marqueurs tumoraux, bilan hépatique, rénal, osseux). \n\nJe certifie avoir réalisé ce compte rendu le 9 juin 2023.\n\nDr. [Nom Prénom], Oncologue Radiothérapeute.", "profile_text": "Civilité : Madame\nNom : DUPONT Danielle\nDate de naissance : 22/04/1943\nÂge au diagnostic : 80\nLatéralité : droit\nType histologique : carcinome mixte ductal et lobulaire infiltrant\nCode OncoTree : MDLC\nSous-type histologique : mixte\nGrade SBR : non renseigné\nSous-type PAM50 : Luminal B\nStatut ER : positifs\nStatut PR : positifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 30\nStade tumoral : II\nGanglions positifs : 5\nIndice de Nottingham : 3,06\nType de chirurgie : chirurgie conservatrice\nÉtat ménopausique : post-ménopausée\nChimiothérapie : non\nHormonothérapie : oui"}, {"id": 51, "cr_text": "Madame Nguyen, née Legros Véronique, âgée de 49 ans, a bénéficié d'une radiothérapie adjuvante suite à une chirurgie conservatrice pour un carcinome canalaire infiltrant (IDC, ductal de type non spécifique (NST)) du sein gauche. La tumeur mesurait 16 mm, était de grade SBR III, exprimait les récepteurs hormonaux (ER et PR positifs) et n'était pas surexprimant HER2. Un score de l'indice pronostique de Nottingham de 4,03 a été noté. \n\nLa décision de réaliser une radiothérapie adjuvante a été prise lors d'une réunion de concertation pluridisciplinaire, tenant compte de son état ménopausique pré-ménopausée et de l'absence de chimiothérapie préalable. Une hormonothérapie adjuvante a été initiée, consistant en un traitement par tamoxifène, en accord avec sa situation hormonosensible.\n\nLa planification de la radiothérapie a été réalisée sur la base d’un scanner dosimétrique effectué le 15/03/2019. Les volumes cibles comprenaient le lit tumoral initial, incluant le segment central et latéral du sein gauche ainsi que les aires ganglionnaires axillaires homolatérales. La dose totale prescrite était de 50 Gray (Gy) délivrée en 25 fractions sur 33 jours (du 25/03/2019 au 27/05/2019, étalement conforme à 33 jours pour 25 fractions). La dose par fraction était de 2 Gy, avec une dose maximale locale de 50 Gy. La technique employée était une irradiation conformationnelle 3D utilisant un accélérateur linéaire. \n\nLes contraintes dosimétriques ont été respectées : la dose moyenne au poumon droit était de 1,8 Gy (seuil normal < 30 %) et celle au poumon gauche de 1,5 Gy (seuil normal < 20 %). La dose moyenne au cœur était inférieure à 4 Gy (seuil normal < 4 Gy).\n\nDurant le traitement, Mme Nguyen a présenté une réaction cutanée modérée (grade 2 CTCAE v5.0) caractérisée par une érythème et une sécheresse cutanée, gérée par application topique de crèmes émollientes. Aucune toxicité sévère (grade > 2) n’a été observée. Elle a également ressenti une fatigue légère à modérée (grade 1), typique de la radiothérapie, sans impact significatif sur ses activités quotidiennes.\n\nÀ la fin du traitement, le 27/05/2019, le score fonctionnel OMS était de 1, reflétant une bonne tolérance globale. Son poids était stable, sans perte significative depuis le début du traitement. \n\nEn termes de suivi, elle continuera l’hormonothérapie par tamoxifène pendant cinq ans. Des consultations de suivi seront programmées tous les trois mois durant deux ans, puis semestrielles, associées à des mammographies annuelles et des bilans sanguins réguliers pour surveiller la fonction hépatique et rénale. \n\nJe reste disponible pour toute information supplémentaire concernant cette prise en charge.\n\nSigné,\n\nDr [Nom Prénom], Oncologue Radiothérapeute \n\n[Signature]", "profile_text": "Civilité : Madame\nNom : NGUYEN, née LEGROS Véronique\nDate de naissance : 21/11/1969\nÂge au diagnostic : 49\nLatéralité : gauche\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : III\nSous-type PAM50 : Luminal B\nStatut ER : positifs\nStatut PR : positifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 16\nStade tumoral : non renseigné\nGanglions positifs : 0\nIndice de Nottingham : 4,03\nType de chirurgie : chirurgie conservatrice\nÉtat ménopausique : pré-ménopausée\nChimiothérapie : non\nHormonothérapie : oui"}, {"id": 52, "cr_text": "Madame OLLIVIER Madeleine, née le 19 octobre 1951, âgée de 64 ans, a bénéficié d'une radiothérapie adjuvante suite à son diagnostic de carcinome canalaire infiltrant (IDC, ductal de type non spécifique (NST)) du sein droit, de grade SBR III, sous-type moléculaire Luminal B, exprimant les récepteurs hormonaux (ER positifs) et les récepteurs HER2 (HER2 positifs). La tumeur mesurait 20 millimètres, était localisée au stade II avec 1 ganglion axillaire positif. Un indice de Nottingham de 5,04 a été calculé. Une chirurgie conservatrice a été réalisée préalablement, suivie d'une hormonothérapie adjuvante adaptée à son état post-ménopausique, sans chimiothérapie. \n\nLa radiothérapie a été initiée après une réunion de concertation pluridisciplinaire où il a été décidé de traiter la région mammaire et les aires ganglionnaires régionales. Un scanner dosimétrique a permis de définir précisément les volumes cibles (tissu mammaire restant, aire ganglionnaire axillaire homolatérale, et éventuellement médiastinale supérieure). La dose totale prescrite était de 50 Gray (Gy) délivrée en 25 fractions sur 33 jours (étalement compatible avec 25 fractions, soit environ 1,32 jour par fraction, incluant les pauses hebdomadaires). Les techniques utilisées ont inclus la modulation d'intensité (IMRT) pour optimiser la couverture tumorale tout en épargnant les organes à risque. \n\nLes contraintes aux organes à risque ont été soigneusement respectées : la dose moyenne au poumon droit a été maintenue inférieure à 20 %, la dose maximale au poumon droit a été limitée à 30 % de sa volume critique (V20 Gy < 30 %) et celle au poumon gauche à 20 %. La dose moyenne cardiaque a été maintenue en dessous de 4 Gy (conformément aux recommandations actuelles). \n\nAu cours du traitement, Mme OLLIVIER a présenté quelques effets secondaires légers à modérés, notamment une fatigue (grade CTCAE I-II) et une érythème cutané (grade II), gérés par des soins locaux et des conseils d'hygiène. Aucune complication majeure n'a été observée. À la fin du traitement, elle présentait un score fonctionnel OMS de 1, aucun signe de toxicité aiguë sévère, et une stabilisation pondérale. \n\nEn conclusion, la radiothérapie adjuvante a été administrée conformément au plan défini, avec une bonne tolérance globale. La poursuite de l'hormonothérapie (par exemple, anastrozole) sera poursuivie pendant cinq ans, et une surveillance régulière (clinique, mammographie annuelle, IRM mammaire tous les deux ans) est prévue. \n\nJe reste disponible pour toute information complémentaire concernant cette prise en charge.\n\n**Signature**\nDr [Nom Prénom], Oncologue Radiothérapeute\n[Date] 15 janvier 2023", "profile_text": "Civilité : Madame\nNom : OLLIVIER Madeleine\nDate de naissance : 19/10/1951\nÂge au diagnostic : 64\nLatéralité : droit\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : III\nSous-type PAM50 : Luminal B\nStatut ER : positifs\nStatut PR : négatifs\nStatut HER2 : positifs\nTaille tumorale (mm) : 20\nStade tumoral : II\nGanglions positifs : 1\nIndice de Nottingham : 5,04\nType de chirurgie : chirurgie conservatrice\nÉtat ménopausique : post-ménopausée\nChimiothérapie : non\nHormonothérapie : oui"}, {"id": 53, "cr_text": "Voici le compte rendu narratif de fin de traitement de radiothérapie pour Mme POTIER Alice, née le 05 mai 1953, âgée de 69 ans, atteinte d’un carcinome canalaire infiltrant (IDC, ductal de type non spécifique (NST)) du sein gauche, grade SBR III, sous-type moléculaire Luminal B, récepteurs hormonaux positifs (ER), récepteurs progestérone négatifs (PR), HER2 négatifs, taille tumorale de 45 mm, stade II, sans envahissement ganglionnaire (0 ganglion positif), indice de Nottingham 4,09. La patiente a bénéficié d’une chirurgie conservatrice suivie d’une radiothérapie adjuvante sur le sein gauche.\n\nLa radiothérapie a été initiée suite à une réunion de concertation pluridisciplinaire où il a été décidé de compléter le traitement chirurgical par une irradiation locale. Un scanner dosimétrique a été réalisé le 15 janvier 2023 afin de planifier précisément le volume cible incluant le lit tumoral et les aires ganglionnaires régionales. Le traitement a été effectué sur un accélérateur linéaire de 6 MV, utilisant une technique de conformal radiation therapy (CRT) avec modulation d’intensité (IMRT) pour optimiser la dose délivrée au sein tout en épargnant les organes à risque. Les fractions ont été administrées quotidiennement du lundi au vendredi pendant 25 séances, étalées sur 33 jours calendaires (du 20 février au 27 mars 2023).\n\nLa dose totale délivrée au sein était de 50 Gray (Gy), répartie en 25 fractions de 2 Gy chacune, avec une dose moyenne de 2 Gy par séance. La dose maximale au sein était de 3,5 Gy. Les contraintes aux organes à risque ont été respectées : la dose moyenne au poumon droit était de 1,8 Gy (seuil maximal autorisé < 30 %) et celle au poumon gauche de 1,5 Gy (seuil maximal autorisé < 20 %). La dose moyenne au cœur était de 1,2 Gy (seuil maximal autorisé < 4 Gy côté gauche). Aucune complication majeure n’a été observée durant le traitement, mais des érythèmes cutanés modérés (grade 1 CTCAE v5.0) ont été notés, traités par application topique de crème hydratante et corticoïde local.\n\nAucun signe de pneumonie radique ou de cardiotoxicité n'a été détecté lors du contrôle de fin de traitement. La patiente se présente aujourd’hui en bon état général, stable, avec un score fonctionnel OMS à 100 %. Elle a maintenu son poids habituel (62 kg) et ne présente aucune toxicité résiduelle significative.\n\nEn termes de suites thérapeutiques, Mme POTIER continuera sa hormonothérapie adjuvante par anastrozole (Arimidex®) pendant cinq ans, comme convenu lors de la RCP. Une surveillance régulière sera assurée par le service d’oncologie gynécologique avec des bilans cliniques tous les six mois, échographie mammaire annuelle, IRM mammaire tous les deux ans, ainsi que des examens sanguins réguliers pour surveiller la fonction hépatique et rénale. Il lui sera également conseillé de poursuivre ses auto-examens mensuels des seins et de signaler immédiatement tout symptôme inhabituel.\n\nJe certifie avoir participé activement à la prise en charge de cette patiente et confirme que toutes les informations contenues dans ce rapport reflètent fidèlement son parcours thérapeutique.\n\nPour information, je joins ici ma signature numérique : [signature]\n\nDr. [Prénom Nom], Oncologue Radiothérapeute\nDate : 17 avril 2023", "profile_text": "Civilité : Madame\nNom : POTIER Alice\nDate de naissance : 05/05/1953\nÂge au diagnostic : 69\nLatéralité : gauche\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : III\nSous-type PAM50 : Luminal B\nStatut ER : positifs\nStatut PR : négatifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 45\nStade tumoral : II\nGanglions positifs : 0\nIndice de Nottingham : 4,09\nType de chirurgie : chirurgie conservatrice\nÉtat ménopausique : post-ménopausée\nChimiothérapie : non\nHormonothérapie : oui"}, {"id": 54, "cr_text": "**Compte rendu de fin de traitement de radiothérapie**\n\nÀ l'attention du service d'oncologie médicale,\n\nObjet : Compte rendu de fin de traitement de radiothérapie pour Madame GAY Alexandrie née le 06 mai 1957, âgée de 58 ans, atteinte d’un carcinome canalaire infiltrant (IDC, ductal de type non spécifique NST) du sein gauche, stade II, 1 ganglion positif, indice de Nottingham 5,06.\n\nMadame GAY Alexandrie a bénéficié d'une radiothérapie adjuvante suite à sa chirurgie conservatrice réalisée le [date de la chirurgie]. La décision de réaliser cette radiothérapie a été prise lors d’une réunion de concertation pluridisciplinaire (RCP) en accord avec son état hormonal post-ménopausique, ses récepteurs hormonaux positifs (ER positifs) et négatifs (PR négatifs), ainsi que son statut HER2 négatif. \n\nLa préparation du traitement comprenait un scanner dosimétrique réalisé le [date du scanner] afin de définir précisément les volumes cibles (tissu mammaire restant, aires ganglionnaires axillaires et/ou internes). La planification a été effectuée sur un accélérateur linéaire, utilisant une dose totale de 50 Gray (Gy) délivrée en 25 fractions sur 33 jours (étalement de 33 jours, cohérent avec 25 fractions administrées du lundi au vendredi, pauses week-ends inclus). Les techniques employées ont inclus une irradiation conformationnelle 3D avec modulation d’intensité (IMRT) pour optimiser la couverture tumorale tout en épargnant les organes à risque. \n\nLes contraintes dosimétriques respectives étaient les suivantes : \n- Poumon droit : V20 Gy de 18,5% (seuil maximal recommandé < 30%)\n- Cœur : dose moyenne de 2,5 Gy (seuil maximal recommandé < 4 Gy côté gauche)\n\nDurant le traitement, la tolérance a été globalement bonne. Des érythèmes cutanés modérés (grade 2 CTCAE) ont été observés, gérés par application topique de crème hydratante et protection solaire. Une fatigue légère (grade 1 CTCAE) a également été rapportée, sans impact significatif sur la qualité de vie. Aucune complication majeure n’a été notée.\n\nAu terme du traitement, le score fonctionnel OMS était inchangé, stable à 90%. Le poids de Mme GAY Alexandrie est resté stable autour de 65 kg. À noter que l’hormonothérapie par anastrozole a été initiée dès la fin de la radiothérapie, conformément à la stratégie thérapeutique définie en RCP. Aucun signe de récidive locale ou régionale n’est suspecté à ce jour.\n\nLes suites thérapeutiques comprennent la poursuite de l’hormonothérapie par anastrozole pendant cinq ans, ainsi qu’une surveillance régulière (clinique tous les trois mois, imagerie annuelle). Un suivi biologique (marqueurs tumoraux, échographie mammaire) sera effectué semestriellement. \n\nJe reste à disposition pour toute information complémentaire concernant le suivi de Mme GAY Alexandrie.\n\nBien cordialement,\n\n[Prénom Nom]\nOncologue Radiothérapeute\n[Signature]\n\nDate : 12 avril 2016", "profile_text": "Civilité : Madame\nNom : GAY Alexandrie\nDate de naissance : 06/05/1957\nÂge au diagnostic : 58\nLatéralité : gauche\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : III\nSous-type PAM50 : Luminal B\nStatut ER : positifs\nStatut PR : négatifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 30\nStade tumoral : II\nGanglions positifs : 1\nIndice de Nottingham : 5,06\nType de chirurgie : chirurgie conservatrice\nÉtat ménopausique : post-ménopausée\nChimiothérapie : non\nHormonothérapie : oui"}, {"id": 55, "cr_text": "Madame WAGNER, née ALVES Marie, âgée de 58 ans, a bénéficié d'une radiothérapie adjuvante suite à une chirurgie conservatrice pour un carcinome mixte ductal et lobulaire infiltrant (MDLC) du sein droit. La tumeur mesurait 30 mm, était classée stade II, avec un score de Nottingham de 4,06, exprimant les récepteurs hormonaux (positifs) mais pas les récepteurs progestérone (négatifs), et n'exprimait pas les récepteurs HER2 (négatifs).\n\nLa décision de réaliser une radiothérapie adjuvante a été prise lors d'une réunion de concertation pluridisciplinaire, tenant compte du sous-type moléculaire Luminal B, du grade SBR III, de l'absence de chimiothérapie et de la nécessité d'une hormonothérapie adjuvante adaptée à son état post-ménopausique. Une hormonothérapie par anastrozole a donc été instaurée sur une durée de cinq ans.\n\nLa planification de la radiothérapie a été réalisée après un scanner dosimétrique (CTDI) permettant de définir précisément les volumes cibles (seins, aires ganglionnaires régionales, marges chirurgicales). Le traitement a été délivré par un accélérateur linéaire de particules, utilisant une dose totale de 50 Gray (Gy) répartie en 25 fractions sur 33 jours, avec une dose quotidienne de 1,5 Gy. Les contraintes aux organes à risque ont été respectées : la dose moyenne au poumon droit a été maintenue inférieure à 20 %, et celle au cœur côté gauche inférieure à 4 Gy. Aucune toxicité sévère n'a été observée durant le traitement, avec des effets secondaires limités à une fatigue modérée (grade 1 CTCAE) et une érythème cutané léger (grade 2 CTCAE) bien gérés par des soins locaux.\n\nAu moment de la fin du traitement, le bilan clinique montre un score fonctionnel OMS de 1, aucun signe de récidive locale ou régionale, et une bonne tolérance globale. La patiente présente une légère atrophie cutanée et une fibrose sous-cutanée attendue, sans complications majeures. Elle continuera sa prise d'anastrozole pendant cinq ans et sera suivie régulièrement pour surveiller l'évolution et détecter d'éventuels effets tardifs.\n\nEn conclusion, la radiothérapie adjuvante s'est déroulée sans incident majeur, conforme aux objectifs thérapeutiques fixés. La patiente est invitée à poursuivre ses consultations de suivi chez son oncologue et son gynécologue pour assurer une surveillance optimale.\n\nSigné,\n\nDr [Nom Prénom], Oncologue Radiothérapeute\n[Signature]", "profile_text": "Civilité : Madame\nNom : WAGNER, née ALVES Marie\nDate de naissance : 17/11/1960\nÂge au diagnostic : 58\nLatéralité : droit\nType histologique : carcinome mixte ductal et lobulaire infiltrant\nCode OncoTree : MDLC\nSous-type histologique : mixte\nGrade SBR : III\nSous-type PAM50 : Luminal B\nStatut ER : positifs\nStatut PR : négatifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 30\nStade tumoral : II\nGanglions positifs : 0\nIndice de Nottingham : 4,06\nType de chirurgie : chirurgie conservatrice\nÉtat ménopausique : post-ménopausée\nChimiothérapie : non\nHormonothérapie : oui"}, {"id": 56, "cr_text": "Madame PICHON, née DELMAS Danielle, âgée de 35 ans, a bénéficié d'une radiothérapie adjuvante suite à sa mastectomie droite pour un carcinome canalaire infiltrant (IDC, ductal de type non spécifique (NST)) de 45 mm, grade SBR III, sous-type moléculaire Luminal B, exprimant les récepteurs hormonaux (positifs pour les récepteurs aux œstrogènes et à la progestérone) et négatif pour le récepteur HER2. Elle présente 7 ganglions axillaires positifs, un indice de Nottingham de 6,09, et un stade II. La patiente est pré-ménopausée et a reçu une chimiothérapie adjuvante ainsi que de l'hormonothérapie par tamoxifène (cohérent avec son état ménopausique).\n\nLa radiothérapie a été initiée après une réunion de concertation pluridisciplinaire où il fut décidé de compléter le traitement chirurgical par une irradiation du lit tumoral et des aires ganglionnaires régionales. Un scanner dosimétrique a été réalisé le 15 mars 2023 afin de planifier précisément les volumes cibles (tissu mammaire restant, aire ganglionnaire axillaire, sus-claviculaire et interne mammaire). La dose totale prescrite était de 50 Gray (Gy) délivrée en 25 fractions sur 33 jours (étalement de 35 jours, cohérent avec 25 fractions), avec une dose quotidienne de 1,5 Gy (limite supérieure de 2 Gy/jour). Les techniques utilisées comprenaient une radiothérapie conformationnelle tridimensionnelle (3D-CRT) et une modulation d'intensité (IMRT) pour optimiser la couverture tumorale tout en épargnant les organes à risque.\n\nConcernant les organes à risque, la dose moyenne au poumon droit a été maintenue inférieure à 30 %, la dose V30 Gy à 15 % (seuil maximal normal < 20 %) et la dose moyenne cardiaque à moins de 4 Gy (conformément aux recommandations). Aucune complication majeure n'a été observée durant le traitement, mais des érythèmes cutanés modérés (grade 2 CTCAE) ont été notés, traités localement par émollients et crème corticoïde topique. Une fatigue légère (grade 1 CTCAE) a également été rapportée, gérée par ajustement des horaires de repos.\n\nÀ la fin du traitement, le score fonctionnel OMS est resté inchangé à 90 %. La patiente a perdu 2 kg depuis le début du traitement, mais reste stable sur le plan nutritionnel. Aucun signe de pneumonie radique ou de fibrose pulmonaire n'est observé. La tolérance globale est jugée satisfaisante.\n\nEn termes de suivi, nous recommandons une consultation de contrôle tous les trois mois pendant deux ans, puis tous les six mois pendant cinq ans, associées à des mammographies annuelles et des échographies régulières. La poursuite de l'hormonothérapie par tamoxifène sera poursuivie pendant 5 ans. Nous conseillons également une surveillance régulière de la fonction thyroïdienne et hépatique, ainsi qu’un suivi cardiovasculaire annuel.\n\nSigné,\n\nDr [Nom Prénom], Oncologue Radiothérapeute\n[Date] 22 mai 2023", "profile_text": "Civilité : Madame\nNom : PICHON, née DELMAS Danielle\nDate de naissance : 05/02/1988\nÂge au diagnostic : 35\nLatéralité : droit\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : III\nSous-type PAM50 : Luminal B\nStatut ER : positifs\nStatut PR : positifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 45\nStade tumoral : II\nGanglions positifs : 7\nIndice de Nottingham : 6,09\nType de chirurgie : mastectomie\nÉtat ménopausique : pré-ménopausée\nChimiothérapie : oui\nHormonothérapie : oui"}, {"id": 57, "cr_text": "**Compte rendu de fin de traitement de radiothérapie mammaire**\n\nÀ Madame Barbier, née Martineau Thérèse, née le 09 mars 1956, âgée de 60 ans, ayant subi une mastectomie droite pour un carcinome mixte ductal et lobulaire infiltrant (MDLC, mixte), grade SBR II, sous-type moléculaire Luminal B, exprimant les récepteurs hormonaux (ER positifs) et les récepteurs HER2 (HER2 positifs), présentant 25 ganglions axillaires positifs, un indice de Nottingham de 5,07, stade IV, a bénéficié d'une radiothérapie adjuvante après concertation pluridisciplinaire.\n\nLa radiothérapie a été réalisée sur le lit tumoral et les aires ganglionnaires drainantes, incluant le creux axillaire homolatéral, la chaîne mammaire interne et externe, ainsi que le médiastin supérieur, selon les recommandations établies lors de la réunion de concertation pluridisciplinaire du 18 décembre 2016. Un scanner dosimétrique a été effectué le 15 janvier 2017 afin de définir précisément les volumes cibles. La planification a été réalisée en utilisant une dose totale de 50 Gy délivrée en 25 fractions sur 5 semaines, avec une dose par fraction de 2,0 Gy, délivrées quotidiennement du lundi au vendredi, étalées sur 25 jours (du 20 février au 24 mars 2017).\n\nLes contraintes aux organes à risque ont été respectées : la dose moyenne au poumon droit était de 1,8 Gy (contre une limite de 30 %) et la dose moyenne au cœur était inférieure à 2,5 Gy (limite de 4 Gy côté gauche). Les volumes cibles ont été définis pour minimiser l'exposition des tissus sains adjacents.\n\nAu cours du traitement, la patiente a présenté quelques effets secondaires modérés, notamment une fatigue (grade 1 CTCAE) et une érythème cutané léger (grade 2 CTCAE), traités par application locale de crèmes émollientes et hydratantes. Aucune complication majeure n'a été observée. À la fin du traitement, le score fonctionnel OMS était inchangé (0), son poids stable (60 kg), et elle présentait une bonne tolérance générale.\n\nEn conclusion, la radiothérapie adjuvante a été complétée sans incident majeur. Une hormonothérapie adjuvante par anastrozole a été initiée en post-ménopausée, conformément aux recommandations pour le sous-type moléculaire Luminal B et le statut hormonal. Une surveillance régulière sera poursuivie, comprenant des mammographies annuelles, des échographies régionales et des bilans sanguins tous les six mois, ainsi qu’un suivi oncologique semestriel.\n\nPour information, aucune chimiothérapie n’a été administrée en raison du stade avancé de la maladie et du faible bénéfice attendu dans cette situation. \n\nSigné,\n\n[Nom Prénom]\nOncologue Radiothérapeute\nDate : 24 mars 2017", "profile_text": "Civilité : Madame\nNom : BARBIER, née MARTINEAU Thérèse\nDate de naissance : 09/03/1956\nÂge au diagnostic : 60\nLatéralité : droit\nType histologique : carcinome mixte ductal et lobulaire infiltrant\nCode OncoTree : MDLC\nSous-type histologique : mixte\nGrade SBR : II\nSous-type PAM50 : Luminal B\nStatut ER : positifs\nStatut PR : négatifs\nStatut HER2 : positifs\nTaille tumorale (mm) : 35\nStade tumoral : IV\nGanglions positifs : 25\nIndice de Nottingham : 5,07\nType de chirurgie : mastectomie\nÉtat ménopausique : post-ménopausée\nChimiothérapie : non\nHormonothérapie : oui"}, {"id": 58, "cr_text": "Madame POTIER, née LAGARDE Audrey, âgée de 54 ans, a bénéficié d'une radiothérapie adjuvante suite à son traitement chirurgical conservateur pour un carcinome canalaire infiltrant (IDC, ductal de type non spécifique (NST)) du sein gauche. La tumeur mesurait 23 mm, était classée au stade II, avec un score de Nottingham de 4,05, exprimant les récepteurs hormonaux (ER positifs) et n'exprimant pas les récepteurs progestérone (PR négatifs) ni les récepteurs HER2 (HER2 négatifs). Elle est post-ménopausée. Une réunion de concertation pluridisciplinaire a été organisée pour discuter de sa stratégie thérapeutique globale, incluant la décision de réaliser une radiothérapie adjuvante après chirurgie conservatrice. \n\nLa planification de la radiothérapie a été réalisée sur base d’un scanner dosimétrique effectué le 15 mars 2020, permettant de définir précisément les volumes cibles (tissu mammaire restant, aires ganglionnaires axillaires et sus-claviculaires). Le traitement a été délivré par un accélérateur linéaire de 6 MV, utilisant une technique de conformal radiotherapy (CRT) avec modulation d'intensité (IMRT) pour optimiser la dose délivrée à la tumeur tout en épargnant les organes à risque. Les fractions ont été administrées quotidiennement, cinq fois par semaine, du lundi au vendredi, sur une période de 25 jours consécutifs, soit un total de 25 fractions. \n\nLa dose totale prescrite était de 50,4 Gy en 25 fractions, avec une dose moyenne de 2,016 Gy par fraction. La dose maximale tolérée au poumon droit était limitée à 20% de la V30 (volume pulmonaire irradié à 30 Gy), soit 6 Gy (norme < 20%), et la dose moyenne cardiaque était maintenue inférieure à 4 Gy (seuil maximal recommandé pour éviter les complications cardiovasculaires). \n\nDurant le traitement, Madame POTIER a présenté une réaction cutanée modérée (grade 2 selon CTCAE v5.0) se manifestant par une érythème et une desquamation légère, gérée par application topique de crème hydratante et protection solaire. Aucune autre toxicité majeure n'a été observée. À la fin du traitement, elle présentait un score fonctionnel OMS de 1, sans perte de poids significative (poids stable à 62 kg).\n\nÀ l'issue de cette radiothérapie, nous avons constaté une bonne tolérance générale au traitement. Les contrôles dosimétriques réalisés montrent que toutes les contraintes aux organes à risque ont été respectées. \n\nEn termes de suivi, une hormonothérapie adjuvante par anastrozole a été initiée, conforme à son statut hormonal et à sa situation post-ménopausée, pour une durée prévue de 5 ans. Un suivi régulier sera assuré tous les six mois pendant deux ans puis annuellement, incluant une mammographie annuelle et une échographie mammaire. \n\nJe reste disponible pour toute information supplémentaire concernant le suivi ou le traitement de Mme POTIER.\n\nPour confirmation, je signe électroniquement ce compte-rendu.\n\nDr [Nom Prénom], Oncologue Radiothérapeute, 22 avril 2020", "profile_text": "Civilité : Madame\nNom : POTIER, née LAGARDE Audrey\nDate de naissance : 28/11/1965\nÂge au diagnostic : 54\nLatéralité : gauche\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : III\nSous-type PAM50 : Luminal B\nStatut ER : positifs\nStatut PR : négatifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 23\nStade tumoral : II\nGanglions positifs : 0\nIndice de Nottingham : 4,05\nType de chirurgie : chirurgie conservatrice\nÉtat ménopausique : post-ménopausée\nChimiothérapie : non\nHormonothérapie : oui"}, {"id": 59, "cr_text": "**Compte rendu de fin de traitement de radiothérapie**\n\nMadame Vallet Chantal, née le 14 novembre 1967, âgée de 51 ans, a bénéficié d'une radiothérapie adjuvante suite à son diagnostic de carcinome canalaire infiltrant (IDC, ductal de type non spécifique (NST)) du sein gauche, de grade SBR II, sous-type moléculaire Claudin-low, exprimant les récepteurs hormonaux (ER positifs, PR positifs) et les récepteurs HER2 (HER2 positifs). La tumeur mesurait 25 millimètres, le stade était II, avec 1 ganglion axillaire positif. L'indice de Nottingham était de 4,05. Une chirurgie conservatrice avait été réalisée préalablement. Madame Vallet est post-ménopausée.\n\nLa décision de réaliser cette radiothérapie a été prise lors d’une réunion de concertation pluridisciplinaire, tenant compte de son profil moléculaire et de sa situation clinique. Un scanner dosimétrique a été effectué le 25 octobre 2023 afin de définir précisément les volumes cibles et les organes à risque. La planification a été effectuée en utilisant une technique de conformal radiotherapy (CRT) avec un accélérateur linéaire de 6 MV. Les volumes irradiés comprenaient le lit tumoral initial, le sein entier, ainsi que les aires ganglionnaires régionales (axillaires, sus-claviculaires, infra-claviculaires) avec des marges de sécurité adaptées. La dose totale délivrée sur le sein était de 50 Gray (Gy) en 25 fractions, soit une dose moyenne de 2 Gy par séance, avec une dose maximale de 3,5 Gy par fraction. Les contraintes aux organes à risque ont été respectées : la dose moyenne au poumon droit était de 18,5% V20 (seuil normal < 30%), et celle au cœur était inférieure à 4 Gy côté gauche (seuil normal < 4 Gy).\n\nDurant le traitement, Madame Vallet a présenté quelques effets secondaires modérés, notamment une fatigue (grade 1 CTCAE) et une érythème cutané (grade 2 CTCAE) localisés au niveau du site d’irradiation, qui se sont améliorés progressivement grâce à des soins locaux. Aucune complication grave n’a été observée. À la fin du traitement, elle présentait un score fonctionnel OMS de 1, sans perte de poids significative (poids stable à 65 kg). \n\nEn termes de suivi, une hormonothérapie adjuvante par anastrozole (Arimidex®) a été initiée, conforme à son état post-ménopausique, pour une durée prévue de cinq ans. Une thérapie anti-HER2 par trastuzumab (Herceptin®) a également été administrée pendant 12 mois, en association avec la chimiothérapie adjuvante (FEC100 suivie d’un taxane). \n\nLa surveillance régulière sera assurée par le service d'oncologie, incluant des examens cliniques tous les trois mois durant deux ans, puis semestriels, associées à des mammographies annuelles et des IRM mammaires bisannuelles. \n\nJe certifie avoir réalisé le traitement de radiothérapie décrit ci-dessus et confirme la bonne tolérance globale du traitement. \n\nSigné,\n\n[Nom Prénom] \nOncologue Radiothérapeute \nDate : 03 janvier 2024", "profile_text": "Civilité : Madame\nNom : VALLET Chantal\nDate de naissance : 14/11/1967\nÂge au diagnostic : 51\nLatéralité : gauche\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : II\nSous-type PAM50 : Claudin-low\nStatut ER : positifs\nStatut PR : positifs\nStatut HER2 : positifs\nTaille tumorale (mm) : 25\nStade tumoral : II\nGanglions positifs : 1\nIndice de Nottingham : 4,05\nType de chirurgie : chirurgie conservatrice\nÉtat ménopausique : post-ménopausée\nChimiothérapie : oui\nHormonothérapie : oui"}, {"id": 60, "cr_text": "**Compte rendu de fin de traitement de radiothérapie mammaire**\n\nMadame GOMEZ Louise, née le 21 mars 1947, âgée de 68 ans, a bénéficié d'une radiothérapie adjuvante suite à une chirurgie conservatrice pour un carcinome canalaire infiltrant (IDC, ductal de type non spécifique (NST)) du sein gauche, grade SBR II, sous-type moléculaire Luminal A, exprimant les récepteurs hormonaux (positifs pour les récepteurs d'œstrogènes et de progestérone), HER2 négatifs, de 21 mm, stade II, avec 1 ganglion axillaire positif, indice de Nottingham 4,04. La décision de cette stratégie thérapeutique a été prise lors d'une réunion de concertation pluridisciplinaire.\n\nLa préparation du traitement a inclus un scanner dosimétrique réalisé le 15 mai 2023, permettant de définir les volumes cibles (tissu mammaire restant, aires ganglionnaires régionales) et de planifier la dose optimale. La radiothérapie a été administrée par un accélérateur linéaire de 6 MV, utilisant une technique de conformal radiotherapy (CRT) pour préserver les organes à risque. Les volumes irradiés comprenaient le sein gauche, incluant la zone opérée, ainsi que les aires ganglionnaires axillaires et supra-claviculaires. \n\nLe planning de radiothérapie s'est déroulé sur 25 fractions, du 20 juin 2023 au 25 juillet 2023, avec une dose totale délivrée de 50,4 Gy en 25 fractions, soit une dose moyenne quotidienne de 2,02 Gy. La dose maximale au sein était limitée à 32,5 Gy, respectant ainsi les contraintes de tolérance aux organes à risque : V20 Gy poumon droit de 18,5 % (seuil normal < 30 %) et dose moyenne cardiaque de 2,5 Gy (seuil normal < 4 Gy).\n\nDurant le traitement, Madame Gomez a présenté une réaction cutanée modérée (grade 2 CTCAE v5.0) se manifestant par une érythème et une desquamation, gérée par application locale de crèmes émollientes. Aucune toxicité sévère n'a été observée. Au bilan de fin de traitement, son état général était satisfaisant, avec un score performance status OMS de 1, stable depuis le début du traitement. Son poids reste inchangé à 65 kg.\n\nÀ noter que Mme Gomez bénéficie d’une hormonothérapie adjuvante par anastrozole, initiée après la chirurgie, visant à réduire le risque de récidive. Aucun traitement anti-HER2 n’a été nécessaire étant donné le statut HER2 négatif.\n\nEn termes de surveillance, elle sera suivie régulièrement par notre équipe multidisciplinaire, avec des mammographies annuelles et des bilans sanguins tous les six mois pendant cinq ans, puis annuellement. Une consultation de suivi est prévue dans trois mois pour évaluer la tolérance à long terme et ajuster si besoin la hormonothérapie.\n\nJe certifie avoir rédigé ce compte rendu de fin de traitement de radiothérapie mammaire le 25 juin 2023.\n\nDr [Nom Prénom], Oncologue Radiothérapeute\n\n[Signature]", "profile_text": "Civilité : Madame\nNom : GOMEZ Louise\nDate de naissance : 21/03/1947\nÂge au diagnostic : 68\nLatéralité : gauche\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : II\nSous-type PAM50 : Luminal A\nStatut ER : positifs\nStatut PR : positifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 21\nStade tumoral : II\nGanglions positifs : 1\nIndice de Nottingham : 4,04\nType de chirurgie : chirurgie conservatrice\nÉtat ménopausique : post-ménopausée\nChimiothérapie : non\nHormonothérapie : oui"}, {"id": 61, "cr_text": "**Compte rendu de fin de traitement de radiothérapie**\n\nMadame CHRÉTIEN, née ÉTIENNE Maggie, âgée de 66 ans, a bénéficié d'une radiothérapie adjuvante suite à son diagnostic de carcinome canalaire infiltrant (IDC, ductal de type non spécifique (NST)) du sein gauche, grade SBR III, sous-type moléculaire Luminal B, avec expression des récepteurs hormonaux (positifs) et négativité des récepteurs HER2. La tumeur mesurait 27 mm, était classée au stade III avec cinq ganglions axillaires positifs, et présentait un indice de Nottingham de 6,05. Une chirurgie conservatrice avait été réalisée préalablement. \n\nLa radiothérapie a été initiée après une réunion de concertation pluridisciplinaire où il fut décidé de proposer cette approche adjuvante en complément de l'hormonothérapie, étant donné que la patiente est post-ménopausée. Un scanner dosimétrique a permis de définir précisément les volumes cibles (tissu mammaire restant, aires ganglionnaires régionales, marges chirurgicales) et de calculer les paramètres de dose optimisés. Le traitement a été délivré sur un accélérateur linéaire de particules, utilisant une énergie de 6 MV, avec une technique de conformal radiotherapy (IMRT) pour minimiser l'exposition des tissus sains. Les fractions quotidiennes ont été administrées du 01/08/2022 au 23/09/2022, soit 25 fractions réparties sur 33 jours calendaires, incluant des pauses hebdomadaires. La dose totale délivrée au volume cible principal était de 50,4 Gy, avec une dose moyenne de 1,68 Gy par fraction, et une dose maximale de 2,5 Gy par séance. Les contraintes aux organes à risque ont été respectées : V20 Gy poumon droit de 12,5 % (seuil normal < 30 %) et dose moyenne cardiaque de 1,2 Gy (seuil normal < 4 Gy côté gauche).\n\nAu cours du traitement, la patiente a présenté des effets secondaires principalement cutanés (érythème, desquamation) et fatigue, évalués selon le système CTCAE v5.0, respectivement de grade 1 et 2. Ces symptômes ont été gérés par application topique de crèmes émollientes et conseils d'hygiène locale. Aucune complication majeure n'a été observée. À la fin du traitement, le score fonctionnel OMS est resté inchangé (0), le poids stable à 62 kg. Aucun signe de toxicité tardive significative n'est noté à ce jour.\n\nEn termes de suivi, une hormonothérapie par anastrozole (Arimidex®) a été prescrite pour une durée de 5 ans, en accord avec le sous-type moléculaire Luminal B et l'état ménopausé de la patiente. Des consultations de suivi seront programmées tous les 3 mois pendant 2 ans, puis tous les 6 mois jusqu'à 5 ans, associées à des mammographies annuelles et échographies régulières. \n\nJe certifie avoir pris connaissance des résultats du traitement et des recommandations de suivi, et j'assure la coordination avec l'équipe multidisciplinaire pour assurer une prise en charge globale optimale.\n\nPour information, aucune chimiothérapie n’a été proposée dans le cadre de ce plan thérapeutique, en raison du sous-type moléculaire favorable (Luminal B) et de l’absence d’indication basée sur le stade et les récepteurs hormonaux. \n\nSigné électroniquement,\n\nDr [Nom Prénom], Oncologue Radiothérapeute\n\n[Date : 23/09/2022]", "profile_text": "Civilité : Madame\nNom : CHRÉTIEN, née ÉTIENNE Maggie\nDate de naissance : 18/07/1956\nÂge au diagnostic : 66\nLatéralité : gauche\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : III\nSous-type PAM50 : Luminal B\nStatut ER : positifs\nStatut PR : négatifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 27\nStade tumoral : III\nGanglions positifs : 5\nIndice de Nottingham : 6,05\nType de chirurgie : chirurgie conservatrice\nÉtat ménopausique : post-ménopausée\nChimiothérapie : non\nHormonothérapie : oui"}, {"id": 62, "cr_text": "Madame DUPRÉ Marthe, née le 19 juin 1978, âgée de 39 ans, a bénéficié d'une radiothérapie adjuvante suite à sa mastectomie gauche pour un carcinome canalaire infiltrant (IDC, ductal de type non spécifique (NST)) de 25 mm, grade SBR III, sous-type moléculaire Normal-like, exprimant les récepteurs hormonaux (positifs) mais n'exprimant pas les récepteurs progestérone (négatifs) et HER2 négatifs. Elle présente également 1 ganglion axillaire positif et un indice de Nottingham de 5,05. La patiente est pré-ménopausée. Une chimiothérapie adjuvante a été administrée préalablement à la radiothérapie. \n\nLa radiothérapie a été réalisée sur un faisceau externe conformationnel avec un accélérateur linéaire, utilisant des photons de 6 MV. Un scanner dosimétrique a permis de définir précisément les volumes cibles incluant le lit tumoral, les aires ganglionnaires régionales et le sein controlatéral. Les contraintes aux organes à risque ont été respectées : V20 Gy poumon droit de 18,5 % (seuil normal < 30 %) et dose moyenne cardiaque de 1,2 Gy (seuil normal < 4 Gy). \n\nLe traitement a débuté le 15 mai 2023 et s'est achevé le 2 juillet 2023, soit un étalement de 50 jours, conforme à 25 fractions hebdomadaires. La dose totale délivrée était de 50,4 Gy en 25 fractions, avec une dose par fraction de 2,02 Gy. \n\nDurant le traitement, la patiente a présenté une fatigue modérée (grade 2 CTCAE) et une érythème cutané léger (grade 1 CTCAE), pris en charge par application locale de crèmes émollientes et conseils d'hygiène. Aucune complication grave n'a été observée. \n\nAu bilan de fin de traitement, le score OMS est de 90 %, aucun signe de récidive locale ou régionale n'est détecté. La patiente pèse 60 kg, stable depuis le début du traitement. \n\nEn termes de suivi, elle continuera son hormonothérapie par tamoxifène pendant cinq ans, initiée dès la fin de la chimiothérapie. Des consultations de suivi seront programmées tous les six mois pendant deux ans, puis annuellement, associées à une mammographie annuelle et une échographie mammaire controlatérale. \n\nJe certifie avoir réalisé ce traitement et rédigé ce compte-rendu en date du 2 septembre 2023.\n\nDr [Nom Prénom], Oncologue Radiothérapeute.", "profile_text": "Civilité : Madame\nNom : DUPRÉ Marthe\nDate de naissance : 19/06/1978\nÂge au diagnostic : 39\nLatéralité : gauche\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : III\nSous-type PAM50 : Normal-like\nStatut ER : positifs\nStatut PR : négatifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 25\nStade tumoral : II\nGanglions positifs : 1\nIndice de Nottingham : 5,05\nType de chirurgie : mastectomie\nÉtat ménopausique : pré-ménopausée\nChimiothérapie : oui\nHormonothérapie : oui"}, {"id": 63, "cr_text": "**Compte rendu de fin de traitement de radiothérapie**\n\nMadame GAUTIER Paulette, née le
