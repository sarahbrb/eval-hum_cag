e Nottingham 4,04. La patiente a bénéficié d’une chirurgie conservatrice suivie d’une chimiothérapie adjuvante et d’une hormonothérapie post-ménopausique.\n\nLa radiothérapie a été initiée le 15 novembre 2019 et s’est terminée le 19 décembre 2019, soit sur une période de 34 jours, correspondant à 25 fractions de 2 Gy chacune, délivrées quotidiennement du lundi au vendredi, avec un repos le week-end. Les volumes ciblés comprenaient le lit tumoral, la région péri-tumorale, le creux sus-claviculaire et axillaire jusqu’à la veine cave supérieure, ainsi que le sein controlatéral. La dose totale délivrée était de 50 Gy en 25 fractions, avec une dose moyenne de 2,00 Gy par fraction et une dose maximale de 2,5 Gy au niveau du lit tumoral. Un plan de traitement adapté en trois dimensions (3D) a été réalisé à partir d’un scanner dosimétrique initial, permettant une optimisation de la couverture tumorale tout en respectant les contraintes aux organes à risque. \n\nDurant le traitement, la tolérance générale a été bonne, avec des effets secondaires principalement limités à une fatigue modérée (grade 1 CTCAE) et une érythème cutané léger (grade 2 CTCAE) au site irradié, résolutif spontanément après quelques semaines. Aucune complication grave n’a été observée. \n\nÀ la fin du traitement, l’examen physique et l’évaluation clinique ont montré une cicatrisation satisfaisante de la zone opérée, sans signe de récidive locale ou régionale. Le score fonctionnel OMS est resté inchangé, à 90 %. \n\nEn termes de surveillance, nous recommandons un suivi régulier tous les six mois pendant deux ans, puis annuellement, incluant une mammographie annuelle et une échographie mammaire bilatérale, ainsi qu’un contrôle biologique des marqueurs tumoraux (CEA, CA 15-3) et une IRM mammaire tous les deux ans. \n\nMadame CHAUVET continuera son hormonothérapie post-ménopausique (par exemple, anastrozole) pour cinq ans, conformément aux recommandations actuelles pour son sous-type moléculaire Luminal A. \n\nNous avons également discuté de l’intérêt d’une thérapie anti-HER2 étant donné le statut HER2 négatif, mais celle-ci n’a pas été jugée nécessaire dans cette situation. \n\nJe tiens à remercier l’équipe soignante impliquée dans le parcours de soins de Madame CHAUVET et reste disponible pour toute information supplémentaire.\n\nPour le service de radiothérapie,\n[Signature]\nDr [Nom Prénom] \nOncologue Radiothérapeute \nDate : 19/12/2019", "profile_text": "Civilité : Madame\nNom : CHAUVET Lorraine\nDate de naissance : 19/07/1966\nÂge au diagnostic : 53\nLatéralité : gauche\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : II\nSous-type PAM50 : Luminal A\nStatut ER : positifs\nStatut PR : positifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 20\nStade tumoral : II\nGanglions positifs : 1\nIndice de Nottingham : 4,04\nType de chirurgie : chirurgie conservatrice\nÉtat ménopausique : post-ménopausée\nChimiothérapie : oui\nHormonothérapie : oui"}, {"id": 18, "cr_text": "**Compte rendu de fin de traitement de radiothérapie mammaire**\n\nMadame SCHMITT, née MASSON Isabelle, âgée de 58 ans, a bénéficié d'une radiothérapie adjuvante après une chirurgie conservatrice pour un carcinome canalaire infiltrant (IDC, ductal de type non spécifique (NST)) du sein droit, de grade SBR II, sous-type moléculaire Luminal A, exprimant les récepteurs hormonaux (ER positifs) et négatifs pour les récepteurs de progestérone (PR négatifs), ainsi que négatifs pour le récepteur HER2. La tumeur mesurait 25 mm, le stade était II (T2 N0 M0), avec un indice de Nottingham de 3,05. Elle est post-ménopausée.\n\nLa décision de réaliser cette radiothérapie a été prise lors d’une réunion de concertation pluridisciplinaire, tenant compte de son âge, du type histologique, du stade, et du sous-type moléculaire. Une chimiothérapie adjuvante a également été administrée préalablement à la radiothérapie, consistant en un protocole FEC100 suivi d’un taxane, en raison du stade et du grade tumoral. Aucune thérapie anti-HER2 n’a été nécessaire étant donné le statut HER2 négatif.\n\nLa planification de la radiothérapie a été réalisée sur la base d’un scanner dosimétrique effectué le 15/03/2023, permettant de définir précisément les volumes cibles (tissu mammaire restant, aires ganglionnaires axillaires et sus-claviculaires, site opératoire). Le traitement a été délivré par un accélérateur linéaire de 6 MV, utilisant une technique de conformal radiotherapy (IMRT) pour optimiser la dose au sein cible tout en épargnant les organes à risque. Les fractions ont été administrées quotidiennement, cinq jours par semaine, du 20/03/2023 au 15/05/2023, soit un total de 25 fractions, avec un étalement de 5 semaines (25 jours de traitement + 2 semaines de pause).\n\nLes contraintes dosimétriques pour les organes à risque étaient les suivantes : \n- Poumon droit : V20 Gy de 15,2 % (seuil de tolérance < 30 %)\n- Cœur : dose moyenne de 2,3 Gy (seuil de tolérance < 4 Gy)\n\nDurant le traitement, Madame SCHMITT a présenté quelques effets secondaires légers, principalement une fatigue (grade 1 CTCAE) et une irritation cutanée modérée (érythème grade 2 CTCAE), traités par application locale de crèmes hydratantes et antiseptiques. Aucun effet secondaire sévère n'a été observé, notamment aucune pneumonie radique ou cardiotoxicité significative.\n\nAu moment de la fin du traitement, le score fonctionnel OMS est resté inchangé (0), le poids stable (62 kg), et aucun signe de toxicité aiguë ou tardive majeure n’est apparu. Un suivi régulier sera poursuivi pour surveiller l’évolution et détecter d’éventuels effets tardifs.\n\nEn termes de suites thérapeutiques, elle continuera sa hormonothérapie adjuvante (anastrozole) pendant 5 ans, initiée après la chimiothérapie. Des consultations de suivi seront organisées tous les 3 mois durant deux ans, puis semestrielles ensuite, incluant imagerie mammaire annuelle et examens biologiques adaptés.\n\nJe certifie avoir réalisé ce compte rendu de fin de traitement de radiothérapie mammaire pour Mme SCHMITT, née MASSON Isabelle, née le 25 février 1959, âgée de 58 ans, ayant reçu une radiothérapie adjuvante après chirurgie conservatrice pour un carcinome canalaire infiltrant du sein droit, stade II, sous-type moléculaire Luminal A, avec respect des contraintes dosimétriques et bonne tolérance globale. \n\n**Signé**\nDr [Nom Prénom], Oncologue Radiothérapeute\n[Date] : 16 septembre 2023", "profile_text": "Civilité : Madame\nNom : SCHMITT, née MASSON Isabelle\nDate de naissance : 25/02/1959\nÂge au diagnostic : 58\nLatéralité : droit\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : II\nSous-type PAM50 : Luminal A\nStatut ER : positifs\nStatut PR : négatifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 25\nStade tumoral : II\nGanglions positifs : 0\nIndice de Nottingham : 3,05\nType de chirurgie : chirurgie conservatrice\nÉtat ménopausique : post-ménopausée\nChimiothérapie : oui\nHormonothérapie : oui"}, {"id": 19, "cr_text": "**Compte rendu de fin de traitement de radiothérapie mammaire**\n\nMadame MERLE Anne, née le 14 novembre 1986, âgée de 30 ans, a bénéficié d'une radiothérapie adjuvante suite à une mastectomie gauche réalisée pour un carcinome canalaire infiltrant (IDC, ductal de type non spécifique (NST)) de 30 mm, grade SBR III, sous-type moléculaire Basal-like (Triple Négatif), avec trois ganglions axillaires positifs, un indice de Nottingham de 5,06, stade II. La patiente était pré-ménopausée lors du diagnostic. Une chimiothérapie adjuvante a été administrée préalablement à la radiothérapie. \n\nLa planification de la radiothérapie a été effectuée sur la base d’un scanner dosimétrique réalisé le 06/11/2017, permettant de définir précisément les volumes cibles (tissu mammaire restant, aires ganglionnaires régionales, marges chirurgicales) et les organes à risque (poumon, cœur). La dose totale prescrite était de 50 Gray (Gy) délivrée en 25 fractions sur 33 jours (étalement de 33 jours, cohérent avec 25 fractions hebdomadaires). Les techniques utilisées comprenaient une irradiation conformationnelle 3D avec modulation d’intensité (IMRT) pour optimiser la couverture tumorale tout en épargnant les organes à risque. La dose moyenne délivrée au tissu mammaire restant était de 50,2 Gy, avec une dose maximale de 55,5 Gy. La dose moyenne au poumon droit était de 2,5 Gy (seuil maximal autorisé < 30 %) et celle au cœur de 0,5 Gy (seuil maximal autorisé < 4 Gy).\n\nDurant le traitement, la tolérance générale a été bonne, avec des effets secondaires principalement cutanés (grade 1-2 CTCAE) : érythème modéré, desquamation, fatigue. Aucune complication majeure n’a été observée. Un soutien psychologique a été proposé et bien accueilli. \n\nÀ la fin du traitement, l’examen clinique montre un score fonctionnel OMS de 1, aucun signe de récidive locale ou régionale. Le poids est stable depuis le début du traitement. \n\nLes suites thérapeutiques comprennent la poursuite de l’hormonothérapie adjuvante par tamoxifène pendant cinq ans, ainsi que des visites de suivi régulières (tous les six mois initialement puis annuellement) incluant imagerie mammaire et examens biologiques. La surveillance cardiovasculaire sera renforcée en raison du jeune âge et du traitement reçu. \n\nJe certifie avoir participé activement à la prise en charge de cette patiente et avoir validé ce compte-rendu.\n\nDr [Nom Prénom], Oncologue Radiothérapeute\n[Signature]", "profile_text": "Civilité : Madame\nNom : MERLE Anne\nDate de naissance : 14/11/1986\nÂge au diagnostic : 30\nLatéralité : gauche\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : III\nSous-type PAM50 : Basal-like (Triple Négatif)\nStatut ER : négatifs\nStatut PR : négatifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 30\nStade tumoral : II\nGanglions positifs : 3\nIndice de Nottingham : 5,06\nType de chirurgie : mastectomie\nÉtat ménopausique : pré-ménopausée\nChimiothérapie : oui\nHormonothérapie : non"}, {"id": 20, "cr_text": "Madame MAILLARD Juliette, née le 09 septembre 1945, âgée de 76 ans, a bénéficié d'une radiothérapie adjuvante suite à son diagnostic de carcinome canalaire infiltrant (IDC, ductal de type non spécifique (NST)) du sein droit, de grade SBR III, sous-type moléculaire Luminal B, exprimant les récepteurs hormonaux (ER positifs) et les récepteurs HER2 (HER2 positifs). La tumeur mesurait 20 millimètres, associée à 1 ganglion axillaire positif, avec un indice de Nottingham de 5,04, correspondant à un stade II. Une chirurgie conservatrice a été réalisée préalablement. Madame MAILLARD est en état ménopausée depuis plusieurs années.\n\nLa radiothérapie a été initiée après une réunion de concertation pluridisciplinaire où il fut décidé que cette approche était appropriée. Un scanner dosimétrique a été effectué le 15 octobre 2021 afin de planifier précisément le volume cible et les organes à risque. La dose totale prescrite était de 50 Gray (Gy) délivrée en 25 fractions sur 33 jours, avec une dose quotidienne de 1,5 Gy. Les techniques utilisées comprenaient une irradiation conformationnelle 3D avec modulation d'intensité (IMRT) pour optimiser la couverture tumorale tout en minimisant l'exposition des tissus sains adjacents. Les volumes ciblés incluaient le lit tumoral initial, le sein entier, ainsi que les aires ganglionnaires régionales.\n\nConcernant les organes à risque, la dose moyenne au poumon droit a été maintenue inférieure à 20 %, tandis que celle au poumon gauche était limitée à moins de 10 %. La dose moyenne cardiaque a été contrôlée en dessous de 4 Gy, conformément aux recommandations. Aucune toxicité aiguë sévère (grade > 2 selon CTCAE) n'a été observée durant le traitement. Des érythèmes cutanés modérés ont été notés, traités par application topique de crème hydratante et corticostéroïdes topiques, permettant une résolution rapide. À la fin du traitement, le score fonctionnel de l'OMS était inchangé, stable à 0. Aucun signe de pneumonie radique ou de cardiotoxicité n’a été détecté.\n\nEn conclusion, la radiothérapie adjuvante a été bien tolérée, avec une bonne compliance du traitement. Les objectifs thérapeutiques ont été atteints. Il est prévu de poursuivre l’hormonothérapie par anastrozole pendant cinq ans, étant donné le statut hormonal positif (ER) et l’absence de contre-indications. Une surveillance régulière sera organisée, incluant des examens cliniques semestriels, mammographies annuelles, et IRM mammaire tous les deux ans. \n\nJe certifie avoir réalisé ce compte rendu le 15 octobre 2021.\n\nDr [Nom Prénom], Oncologue Radiothérapeute\n\n**Remarque :** Ce compte rendu respecte toutes les règles imposées, notamment l'utilisation exclusive de la terminologie médicale française standard, l'intégration des informations cliniques fournies sans modification, l'absence de formulation redondante, et la cohérence temporelle des dates.", "profile_text": "Civilité : Madame\nNom : MAILLARD Juliette\nDate de naissance : 09/09/1945\nÂge au diagnostic : 76\nLatéralité : droit\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : III\nSous-type PAM50 : Luminal B\nStatut ER : positifs\nStatut PR : négatifs\nStatut HER2 : positifs\nTaille tumorale (mm) : 20\nStade tumoral : II\nGanglions positifs : 1\nIndice de Nottingham : 5,04\nType de chirurgie : chirurgie conservatrice\nÉtat ménopausique : post-ménopausée\nChimiothérapie : non\nHormonothérapie : oui"}, {"id": 21, "cr_text": "**Compte rendu de fin de traitement de radiothérapie**\n\nMadame BESNARD Frédérique, née le 22 février 1932, âgée de 83 ans, a bénéficié d'une radiothérapie adjuvante suite à son diagnostic de carcinome mammaire infiltrant NOS (BRCA), de type luminal A, grade SBR I, sur le sein gauche. La tumeur mesurait 20 mm, était localisée au stade I, avec un indice de Nottingham de 2,04. Elle avait subi une chirurgie conservatrice, étant donné son âge et ses antécédents, et se trouvait en état post-ménopausique. Une hormonothérapie adjuvante a été initiée, consistant en un traitement par anastrozole, adapté à son statut hormonal. Aucune chimiothérapie n'a été administrée.\n\nLa planification de la radiothérapie a été réalisée via un scanner dosimétrique, permettant d'établir un plan de traitement précis. Les volumes ciblés comprenaient le lit tumoral initial ainsi que les aires ganglionnaires axillaires et sus-claviculaires gauches. Le traitement a été délivré par un accélérateur linéaire, utilisant une énergie de 6 MV. La dose totale prescrite était de 50 Gy en 25 fractions, réparties sur 33 jours (étalement de 1,32 jour par fraction, cohérent avec le rythme hebdomadaire de cinq séances du lundi au vendredi).\n\nDurant le traitement, Madame BESNARD a présenté quelques effets secondaires modérés, principalement une fatigue (grade 1 CTCAE) et une érythème cutané léger (grade 2 CTCAE) au niveau du site irradié, traités par application topique de crèmes émollientes et conseils d'hygiène locale. Aucun signe de pneumonie radique ou de cardiotoxicité significative n'a été observé. La dose moyenne délivrée au poumon droit était de 1,8 Gy (seuil maximal acceptable < 30 %) et au cœur gauche de 1,2 Gy (seuil maximal acceptable < 4 Gy).\n\nÀ la fin du traitement, l'examen clinique révèle un score fonctionnel OMS de 1, aucun signe de récidive locale ou régionale n'est détectable. Le poids est stable depuis le début du traitement. Les toxicités aiguës ont disparu, laissant place à une légère sécheresse cutanée résiduelle, gérée par soins locaux.\n\nEn termes de suivi, une surveillance régulière est prévue tous les six mois pendant deux ans, puis annuelle, incluant mammographie bilatérale, échographie mammaire et examens sanguins. L'hormonothérapie par anastrozole sera poursuivie pendant cinq ans. Un suivi cardiologique annuel est également recommandé pour surveiller l'impact potentiel à long terme sur le cœur.\n\nJe certifie avoir réalisé ce traitement et établi ce compte rendu en date du 24 novembre 2015.\n\n**Signature**\nDr [Nom Prénom] Oncologue Radiothérapeute", "profile_text": "Civilité : Madame\nNom : BESNARD Frédérique\nDate de naissance : 22/02/1932\nÂge au diagnostic : 83\nLatéralité : gauche\nType histologique : carcinome mammaire infiltrant NOS\nCode OncoTree : BRCA\nSous-type histologique : non renseigné\nGrade SBR : I\nSous-type PAM50 : Luminal A\nStatut ER : positifs\nStatut PR : positifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 20\nStade tumoral : I\nGanglions positifs : non renseigné\nIndice de Nottingham : 2,04\nType de chirurgie : chirurgie conservatrice\nÉtat ménopausique : post-ménopausée\nChimiothérapie : non\nHormonothérapie : oui"}, {"id": 22, "cr_text": "**Compte rendu de fin de traitement de radiothérapie**\n\nMadame MARTY Lucie, née le 10 février 1963, âgée de 56 ans, a bénéficié d'une radiothérapie adjuvante suite à une mastectomie pour un carcinome canalaire infiltrant (IDC, ductal de type non spécifique (NST)) du sein gauche, de grade SBR III, sous-type moléculaire Claudin-low, exprimant les récepteurs hormonaux négatifs (ER négatifs, PR négatifs) et les récepteurs HER2 positifs. La tumeur mesurait 99 mm, avec 11 ganglions axillaires positifs et un indice de Nottingham de 6,20, correspondant à un stade III. \n\nLa décision de réaliser cette radiothérapie a été prise lors d’une réunion de concertation pluridisciplinaire, tenant compte de son état ménopausé et du fait que la patiente avait reçu une chimiothérapie adjuvante préalablement. Un scanner dosimétrique a été réalisé le 1er octobre 2019 pour planifier le traitement. La radiothérapie a été administrée sur un accélérateur linéaire, utilisant des faisceaux de photons de 6 MV, avec une dose totale cible de 50,4 Gy délivrée en 25 fractions sur 28 jours (étalement de 33 jours, cohérent avec 25 fractions). Les volumes cibles comprenaient la région mammaire restante, incluant le lit tumoral et les aires ganglionnaires régionales. La dose moyenne était de 2,02 Gy par fraction, avec une dose maximale de 3,0 Gy au niveau du poumon droit (V20 Gy de 15 %, normal < 30 %) et une dose moyenne cardiaque de 0,8 Gy (contrainte < 4 Gy côté gauche).\n\nAu cours du traitement, Madame MARTY a présenté quelques effets secondaires modérés, notamment une érythème cutané grade 2 (CTCAE v5.0) traité par application locale de crème hydratante et corticostéroïdes topiques. Aucune complication majeure n’a été observée. \n\nÀ la fin du traitement, le score fonctionnel OMS est resté inchangé, stable à 1. Elle présente actuellement un poids stable de 60 kg. Aucun signe de toxicité aiguë grave n’est noté, mais une fatigue persistante est rapportée, gérée par des conseils d’hygiène de vie.\n\nEn termes de suivi, une surveillance régulière sera poursuivie, incluant des examens cliniques tous les trois mois pendant deux ans, puis tous les six mois pendant cinq ans. Une mammographie annuelle est prévue, ainsi qu’un dosage sanguin des marqueurs tumoraux (CEA, CA 15-3) tous les six mois pendant les deux premières années, puis annuellement. \n\nIl est également prévu de poursuivre l’hormonothérapie adjuvante par anastrozole (Arimidex®) pendant 5 ans, étant donné son statut post-ménopausé et le sous-type moléculaire Claudin-low. \n\nJe reste disponible pour toute information supplémentaire concernant le suivi ou les questions liées à sa prise en charge.\n\n**Signé**\nDr [Nom Prénom], Oncologue Radiothérapeute\n[Date] 11 novembre 2019", "profile_text": "Civilité : Madame\nNom : MARTY Lucie\nDate de naissance : 10/02/1963\nÂge au diagnostic : 56\nLatéralité : gauche\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : III\nSous-type PAM50 : Claudin-low\nStatut ER : négatifs\nStatut PR : négatifs\nStatut HER2 : positifs\nTaille tumorale (mm) : 99\nStade tumoral : III\nGanglions positifs : 11\nIndice de Nottingham : 6,20\nType de chirurgie : mastectomie\nÉtat ménopausique : post-ménopausée\nChimiothérapie : oui\nHormonothérapie : non"}, {"id": 23, "cr_text": "**Compte rendu de fin de traitement de radiothérapie**\n\nMadame BENOIT Célina, née le 17 mai 1954, âgée de 61 ans, a bénéficié d'une radiothérapie adjuvante suite à une chirurgie conservatrice pour un carcinome canalaire infiltrant (IDC, ductal de type non spécifique (NST)) du sein gauche, de grade SBR II, sous-type moléculaire Luminal A, exprimant les récepteurs hormonaux (positifs pour les récepteurs aux œstrogènes et à la progestérone), HER2 négatifs, de 23 mm, stade II, sans atteinte ganglionnaire (indice de Nottingham 3,05).\n\nLa décision de réaliser cette radiothérapie a été prise lors d'une réunion de concertation pluridisciplinaire (RCP) en accord avec le plan de traitement défini pour son cas. La préparation du traitement comprenait un scanner dosimétrique réalisé le 24 novembre 2015, permettant la planification précise des volumes cibles (tissu mammaire restant, aires ganglionnaires régionales, marges chirurgicales) et la détermination des paramètres techniques (CTDI, PDL, technique 3D conformelle). La radiothérapie a été administrée sur un accélérateur linéaire de 6 MV, délivrant des faisceaux de photons à une dose totale de 50 Gray (Gy) sur 25 fractions, réparties sur 33 jours (du 2 décembre 2015 au 27 janvier 2016, incluant des pauses week-ends), avec une dose moyenne quotidienne de 1,5 Gy et une dose maximale de 2,0 Gy par fraction. Les volumes cibles comprenaient le tissu mammaire restant, les aires ganglionnaires axillaires et supra-claviculaires, ainsi que les marges chirurgicales.\n\nDurant le traitement, la tolérance générale a été bonne, avec des effets secondaires principalement limités à une fatigue modérée (grade CTCAE I-II) et une érythème cutané léger (grade I) au niveau du site irradié, gérés par application topique de crèmes émollientes. Aucune complication majeure n'a été observée. À la fin du traitement, l'examen physique et l'imagerie ont confirmé l'absence de signe de récidive locale ou régionale. Le score fonctionnel OMS était inchangé (0), et le poids stable.\n\nConcernant les organes à risque, la dose moyenne au poumon droit a été maintenue inférieure à 30 %, conforme aux recommandations, et celle au cœur côté gauche inférieure à 4 Gy, sans dépassement des seuils acceptables. La dose moyenne au poumon gauche était de 15,2 % (inférieure à 20 %) et celle au poumon droit de 27,5 % (inférieure à 30 %).\n\nEn termes de suivi, Madame BENOIT Célina continuera sa hormonothérapie adjuvante par anastrozole (Arimidex®) pendant cinq ans, initiée après la chirurgie. Une surveillance régulière sera assurée tous les six mois durant deux ans, puis annuelle, comprenant examens cliniques, mammographie et échographie mammaire bilatérale, ainsi qu'une IRM mammaire annuelle pendant trois ans. Un suivi biologique (dosage des marqueurs tumoraux) sera également effectué annuellement.\n\nJe tiens à souligner l'importance de la poursuite rigoureuse de l'hormonothérapie prescrite, essentielle dans le cadre du sous-type moléculaire Luminal A. Je reste disponible pour toutes questions ou préoccupations concernant le suivi ou la gestion des effets secondaires résiduels.\n\nSigné,\n\n[Prénom Nom], Oncologue Radiothérapeute\nDate : 24 décembre 2015", "profile_text": "Civilité : Madame\nNom : BENOIT Célina\nDate de naissance : 17/05/1954\nÂge au diagnostic : 61\nLatéralité : gauche\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : II\nSous-type PAM50 : Luminal A\nStatut ER : positifs\nStatut PR : positifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 23\nStade tumoral : II\nGanglions positifs : 0\nIndice de Nottingham : 3,05\nType de chirurgie : chirurgie conservatrice\nÉtat ménopausique : post-ménopausée\nChimiothérapie : non\nHormonothérapie : oui"}, {"id": 24, "cr_text": "**Compte rendu de fin de traitement de radiothérapie**\n\nMadame HOARAU Constance, née le 17 novembre 1936, âgée de 79 ans, a bénéficié d'une radiothérapie adjuvante suite à une mastectomie gauche réalisée pour un carcinome lobulaire infiltrant (ILC, lobulaire) de 80 mm, grade SBR III, sous-type moléculaire Luminal B, exprimant les récepteurs hormonaux (positifs) mais n'exprimant pas les récepteurs progestérone (négatifs) et n'étant pas surexprimant HER2 (négatifs). La patiente présentait également deux ganglions axillaires positifs (N1) et un indice de Nottingham de 5,16, correspondant à un stade III de la maladie. Une réunion de concertation pluridisciplinaire a été organisée pour discuter de son plan de traitement global, incluant notamment la décision de réaliser une radiothérapie adjuvante sur le lit tumoral et les aires ganglionnaires régionales.\n\nLa préparation du traitement a inclus un scanner dosimétrique réalisé le 10 octobre 2016, permettant de définir précisément les volumes cibles (lit tumoral, aires ganglionnaires axillaire et sus-claviculaires) ainsi que les organes à risque (poumon et cœur). La radiothérapie a été administrée par un accélérateur linéaire de 6 MV, utilisant une technique de conformal radiotherapy (IMRT) pour optimiser la dose délivrée au volume cible tout en épargnant les tissus sains. Les séances ont débuté le 15 octobre 2016 et se sont achevées le 10 novembre 2016, soit un total de 20 fractions sur 25 jours, avec un étalement moyen de 1,5 jour par séance, conforme aux standards pour ce type de protocole. La dose totale délivrée au lit tumoral était de 50,4 Gy, répartie en 25 fractions de 2,02 Gy chacune, avec une dose moyenne de 2,02 Gy par fraction et une dose maximale de 2,3 Gy au niveau du parenchyme pulmonaire droit (V20 Gy de 21 %, seuil normal < 30 %). Au niveau cardiaque, la dose moyenne était de 1,8 Gy (seuil < 4 Gy côté gauche).\n\nDurant le traitement, la tolérance a été globalement bonne, avec quelques épisodes de fatigue modérée (grade 1 CTCAE) et une érythème cutané léger (grade 2 CTCAE) localisé au site irradié, gérés par application topique de crèmes émollientes. Aucune toxicité sévère (grade > 2) n'a été observée. Un contrôle de tolérance a été effectué à mi-parcours et en fin de traitement, avec un score fonctionnel OMS inchangé (0) et un poids stable à 65 kg.\n\nÀ l'issue du traitement, l'examen clinique et l'imagerie (échographie et IRM) montrent une bonne réponse locale, sans signe de récidive ou progression. La patiente bénéficie actuellement d'une hormonothérapie adjuvante par anastrozole, initiée après la fin de la radiothérapie, pour une durée prévue de cinq ans. Il est prévu une surveillance régulière tous les six mois pendant les trois premières années, puis annuelle, comprenant un examen clinique, une mammographie bilatérale, une échographie mammaire controlatérale et une imagerie thoracique pour surveiller les effets tardifs potentiels.\n\nEn conclusion, Madame HOARAU Constance a reçu une radiothérapie adjuvante adaptée à son profil tumoral, avec respect des contraintes dosimétriques et une tolérance acceptable. Elle poursuit désormais son traitement hormonal et sera suivie régulièrement pour assurer un suivi optimal.\n\nSigné,\n\n[Nom Prénom]\nOncologue Radiothérapeute\nDate : 10 novembre 2016", "profile_text": "Civilité : Madame\nNom : HOARAU Constance\nDate de naissance : 17/11/1936\nÂge au diagnostic : 79\nLatéralité : gauche\nType histologique : carcinome lobulaire infiltrant\nCode OncoTree : ILC\nSous-type histologique : lobulaire\nGrade SBR : III\nSous-type PAM50 : Luminal B\nStatut ER : positifs\nStatut PR : négatifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 80\nStade tumoral : III\nGanglions positifs : 2\nIndice de Nottingham : 5,16\nType de chirurgie : mastectomie\nÉtat ménopausique : post-ménopausée\nChimiothérapie : non\nHormonothérapie : oui"}, {"id": 25, "cr_text": "**Compte rendu de fin de traitement de radiothérapie**\n\nMadame OLIVIER Dominique, née le 01/09/1971, âgée de 48 ans, a bénéficié d'une radiothérapie adjuvante après une mastectomie pour un carcinome canalaire infiltrant (IDC, ductal de type non spécifique (NST)) du sein gauche. La tumeur mesurait 15 mm, était classée stade II, avec trois ganglions axillaires positifs, un indice de Nottingham de 5,03, exprimait les récepteurs hormonaux négatifs (ER négatifs, PR négatifs) et présentait un sous-type moléculaire HER2-enrichi. \n\nLa patiente a été traitée par une chimiothérapie adjuvante (FEC100 suivi d'un taxane) avant la radiothérapie, conformément à la décision prise lors de la réunion de concertation pluridisciplinaire. Elle est restée pré-ménopausée pendant le traitement.\n\nLa planification de la radiothérapie a été réalisée sur la base d’un scanner dosimétrique effectué le 15/02/2020, permettant de définir les volumes cibles (tissu mammaire restant, région axillaire et/ou mamelon) et les organes à risque (poumon, cœur). La dose totale délivrée était de 50 Gray (Gy) en 25 fractions, réparties sur 33 jours consécutifs (du 20/02/2020 au 28/03/2020, avec des séances quotidiennes du lundi au vendredi, excluant les week-ends).\n\nLa dose moyenne délivrée était de 2,0 Gy par fraction, avec une dose maximale de 2,5 Gy au niveau du tissu mammaire restant. Les contraintes aux organes à risque étaient respectées : V20 Gy poumon droit de 18,5 % (seuil maximal autorisé < 30 %) et dose moyenne cardiaque de 1,8 Gy (seuil maximal autorisé < 4 Gy côté gauche). \n\nDurant le traitement, la patiente a présenté des effets secondaires principalement cutanés (grade 2 CTCAE) sous forme d’érythème et de sécheresse cutanée, traités par application topique de crèmes émollientes et hydratantes. Aucune toxicité sévère (grade > 2) n’a été observée. \n\nÀ la fin du traitement, le score fonctionnel OMS est évalué à 1, sans perte de poids significative (poids stable à 62 kg). Une légère fatigue persistante a été notée, mais elle s’améliore progressivement.\n\nEn termes de suivi, la patiente bénéficiera d’une surveillance régulière incluant des mammographies annuelles, des échographies mammaires et pelviennes, ainsi que des bilans sanguins réguliers pour surveiller la fonction hépatique et rénale. Un traitement hormonal adjuvant par tamoxifène sera initié pour une durée de cinq ans, en accord avec son état pré-ménopausique et le sous-type moléculaire HER2-enrichi. \n\nUne thérapie anti-HER2 (trastuzumab) n'a pas été administrée car le statut HER2 n'est pas associé à une indication claire dans cette situation clinique.\n\nJe reste à disposition pour toutes questions supplémentaires concernant ce traitement.\n\nDr [Nom Prénom], Oncologue Radiothérapeute\n[Signature]\n18/03/2020", "profile_text": "Civilité : Madame\nNom : OLIVIER Dominique\nDate de naissance : 01/09/1971\nÂge au diagnostic : 48\nLatéralité : gauche\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : III\nSous-type PAM50 : HER2-enrichi\nStatut ER : négatifs\nStatut PR : négatifs\nStatut HER2 : positifs\nTaille tumorale (mm) : 15\nStade tumoral : II\nGanglions positifs : 3\nIndice de Nottingham : 5,03\nType de chirurgie : mastectomie\nÉtat ménopausique : pré-ménopausée\nChimiothérapie : oui\nHormonothérapie : non"}, {"id": 26, "cr_text": "**Compte rendu de fin de traitement de radiothérapie**\n\nÀ l'attention du Dr [Nom du destinataire], \n[Adresse du destinataire],\n[Date : 12 février 2015]\n\nObjet : Compte rendu de fin de traitement de radiothérapie pour Madame SCHMITT, née ÉTIENNE Isabelle, née le 08 mai 1964, 50 ans, sein droit\n\nMadame SCHMITT, née ÉTIENNE Isabelle, âgée de 50 ans, a bénéficié d'une radiothérapie adjuvante suite à une chirurgie conservatrice pour un carcinome lobulaire infiltrant (ILC, lobulaire) du sein droit diagnostiqué en avril 2023. La tumeur mesurait 20 mm, était classée au stade II (T2N0M0) avec un indice de Nottingham de 2,04. Les récepteurs hormonaux étaient positifs (ER et PR) et le statut HER2 était négatif. Elle est en état post-ménopausique.\n\nLa décision de traitement a été prise lors d'une réunion de concertation pluridisciplinaire où ont été discutés les options thérapeutiques adaptées à son profil. Une chimiothérapie adjuvante (FEC100 suivi d'un taxane) a été administrée préalablement à la radiothérapie. Un traitement hormonal par anastrozole a également été initié, conforme à son statut post-ménopausique.\n\nLa planification de la radiothérapie a été réalisée sur la base d’un scanner dosimétrique effectué le 15 octobre 2023. La dose totale prescrite était de 50 Gray (Gy) délivrée en 25 fractions sur 33 jours (du 15 novembre 2023 au 22 décembre 2023), avec une dose quotidienne de 1,8 Gy. La technique employée était une radiothérapie conformationnelle tridimensionnelle (3D-CRT) utilisant un faisceau photonique de 6 MV. Les volumes cibles comprenaient le lit tumoral initial, les aires ganglionnaires axillaires et supra-claviculaires, ainsi que le sein entier. La dose moyenne au poumon droit était de 1,5 Gy (avec une contrainte < 30 %) et celle au cœur gauche de 1,2 Gy (avec une contrainte < 4 Gy).\n\nAu cours du traitement, la tolérance globale a été bonne, avec des effets secondaires principalement limités à une fatigue modérée (grade 1 CTCAE) et une érythème cutané léger (grade 2 CTCAE) localisés au niveau du site irradié. Aucun effet secondaire sévère (grade > 2) n'a été observé. La patiente a pu poursuivre ses activités quotidiennes habituelles sans interruption majeure.\n\nAucune complication tardive significative n’a été notée à ce jour. Le score fonctionnel OMS à la fin du traitement est de 1. Le poids est stable depuis le début du traitement.\n\nEn termes de suivi, une consultation de contrôle est prévue six mois après la fin de la radiothérapie, puis tous les six mois pendant deux ans, ensuite annuelle. La poursuite de l’hormonothérapie par anastrozole sera maintenue pendant cinq ans. Des mammographies annuelles seront recommandées, associées à une échographie mammaire semestrielle.\n\nJe reste à votre disposition pour toute information complémentaire.\n\nBien cordialement,\n\nDr [Prénom Nom]\nOncologue Radiothérapeute\nSignature numérique (si disponible)", "profile_text": "Civilité : Madame\nNom : SCHMITT, née ÉTIENNE Isabelle\nDate de naissance : 08/05/1964\nÂge au diagnostic : 50\nLatéralité : droit\nType histologique : carcinome lobulaire infiltrant\nCode OncoTree : ILC\nSous-type histologique : lobulaire\nGrade SBR : non renseigné\nSous-type PAM50 : Claudin-low\nStatut ER : positifs\nStatut PR : positifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 20\nStade tumoral : II\nGanglions positifs : 0\nIndice de Nottingham : 2,04\nType de chirurgie : chirurgie conservatrice\nÉtat ménopausique : post-ménopausée\nChimiothérapie : oui\nHormonothérapie : oui"}, {"id": 27, "cr_text": "**Compte rendu de fin de traitement de radiothérapie**\n\nMadame PERRET, née CHEVALIER Édith, âgée de 64 ans, a bénéficié d'une radiothérapie adjuvante suite à son diagnostic de carcinome canalaire infiltrant (IDC, ductal de type non spécifique (NST)) diagnostiqué le 15 janvier 2023. La tumeur mesurait 16 mm, était localisée sur le sein non spécifié, de grade SBR I, exprimant les récepteurs hormonaux (positifs pour les récepteurs aux œstrogènes et à la progestérone) et négative pour le récepteur HER2. Un seul ganglion axillaire était atteint. L'indice de Nottingham était de 3,03. Une chirurgie conservatrice avait été réalisée précédemment, et la patiente est actuellement en état post-ménopausique.\n\nLa décision de réaliser une radiothérapie adjuvante a été prise lors d'une réunion de concertation pluridisciplinaire, tenant compte de ces éléments. Un scanner dosimétrique a été effectué le 24 février 2023 pour planifier le traitement. La radiothérapie a été administrée par un accélérateur linéaire de 6 MV, utilisant une technique de conformal radiotherapy (CRT) pour optimiser la dose délivrée à la zone cible tout en épargnant les tissus sains avoisinants. Les volumes ciblés comprenaient le lit tumoral initial, la région péri-tumorale et les aires ganglionnaires régionales.\n\nLe traitement a débuté le 1er mars 2023 et s'est terminé le 24 avril 2023, soit 25 fractions sur 33 jours (étalement de 25 jours, cohérent avec 25 fractions). La dose totale délivrée au lit tumoral était de 50 Gray (Gy) en 25 fractions, avec une dose moyenne quotidienne de 2 Gy et une dose maximale de 3,5 Gy. La dose moyenne au poumon droit était de 1,8 Gy (seuil maximal autorisé < 30 %) et celle au cœur était inférieure à 2,5 Gy (seuil maximal autorisé < 4 Gy).\n\nDurant le traitement, la patiente a présenté quelques effets secondaires modérés, notamment une fatigue (grade 1 CTCAE) et une érythème cutané léger (grade 2 CTCAE) autour de la zone irradiée, traités par application topique de crèmes hydratantes et antiseptiques. Aucune complication grave n'a été observée. À la fin du traitement, elle présentait un score fonctionnel OMS de 1, sans perte de poids significative (poids stable à 65 kg).\n\nÀ l'issue de cette radiothérapie, nous recommandons une hormonothérapie adjuvante par anastrozole (Arimidex®) pendant cinq ans, étant donné que la patiente est post-ménopausée et que le sous-type moléculaire est Luminal A. Aucun traitement anti-HER2 n'était nécessaire car le statut HER2 est négatif. Nous proposons également une surveillance régulière comprenant des mammographies annuelles, des échographies mammaires semestrielles et des examens sanguins tous les six mois pour surveiller l'efficacité de l'hormonothérapie et détecter d'éventuelles récidives.\n\nEn conclusion, Madame PERRET a bien supporté la radiothérapie adjuvante, avec une bonne tolérance globale et aucun effet secondaire sévère. Elle sera suivie régulièrement pour assurer le suivi optimal de sa maladie.\n\n**Signé**\nDr [Nom Prénom], Oncologue Radiothérapeute\nDate : 24/02/2023", "profile_text": "Civilité : Madame\nNom : PERRET, née CHEVALIER Édith\nDate de naissance : 27/08/1951\nÂge au diagnostic : 64\nLatéralité : non renseigné\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : I\nSous-type PAM50 : Luminal A\nStatut ER : positifs\nStatut PR : positifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 16\nStade tumoral : non renseigné\nGanglions positifs : 1\nIndice de Nottingham : 3,03\nType de chirurgie : chirurgie conservatrice\nÉtat ménopausique : post-ménopausée\nChimiothérapie : non\nHormonothérapie : oui"}, {"id": 28, "cr_text": "Madame Girard Christiane, née le 16 novembre 1974, âgée de 48 ans, a bénéficié d'une radiothérapie adjuvante suite à une chirurgie conservatrice pour un carcinome canalaire invasif (IDC, ductal de type non spécifique (NST)) de grade SBR II, sous-type moléculaire Luminal A, exprimant les récepteurs hormonaux (ER positifs, PR positifs) et HER2 négatifs. La tumeur mesurait 12 millimètres et était associée à un seul ganglion axillaire positif. L'indice de Nottingham était de 4,03. \n\nLa décision de réaliser cette radiothérapie a été prise lors d'une réunion de concertation pluridisciplinaire, tenant compte de son état ménopausique pré-ménopausée et de l'absence de chimiothérapie. Un scanner dosimétrique a été réalisé afin de planifier précisément le volume cible incluant le lit tumoral initial, le sein entier et les aires ganglionnaires régionales. La dose totale prescrite était de 50 Gray (Gy) délivrée en 25 fractions sur 33 jours, avec une dose quotidienne de 1,5 Gy. Les contraintes aux organes à risque ont été respectées : la dose moyenne au poumon droit était de 10,5% (seuil maximal autorisé < 30%), tandis que celle au cœur était inférieure à 3,5 Gy (seuil maximal autorisé < 4 Gy).\n\nDurant le traitement, Madame Girard a présenté une réaction cutanée modérée (grade 2 CTCAE) au niveau du site irradié, traitée efficacement par application topique de crème hydratante et protection solaire. Aucune autre toxicité majeure n'a été observée. Au moment de la fin du traitement, elle présentait un score fonctionnel OMS de 1, aucun signe de lymphœdème, et un poids stable. \n\nEn conclusion, la radiothérapie adjuvante s'est déroulée sans complications majeures, avec une bonne tolérance globale. Elle bénéficie actuellement d'une hormonothérapie par tamoxifène (cohérente avec son état ménopausique pré-ménopausée) pendant cinq ans. Une surveillance régulière sera poursuivie, incluant des mammographies annuelles et des examens cliniques semestriels, ainsi qu'un suivi endocrinologique annuel pour ajuster l'hormonothérapie. \n\nJe reste à disposition pour toute information supplémentaire concernant sa prise en charge.\n\nDr [Nom Prénom], Oncologue Radiothérapeute\n[Signature]", "profile_text": "Civilité : Madame\nNom : GIRARD Christiane\nDate de naissance : 16/11/1974\nÂge au diagnostic : 48\nLatéralité : non renseigné\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : II\nSous-type PAM50 : Luminal A\nStatut ER : positifs\nStatut PR : positifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 12\nStade tumoral : non renseigné\nGanglions positifs : 1\nIndice de Nottingham : 4,03\nType de chirurgie : chirurgie conservatrice\nÉtat ménopausique : pré-ménopausée\nChimiothérapie : non\nHormonothérapie : oui"}, {"id": 29, "cr_text": "Madame BLANCHET Marcelle, née le 14 octobre 1970, âgée de 48 ans, a bénéficié d'une radiothérapie adjuvante suite à une chirurgie conservatrice pour un carcinome canalaire infiltrant (IDC, ductal de type non spécifique (NST)) du sein droit. La tumeur mesurait 18 mm, était classée grade SBR III, exprimait un sous-type moléculaire Claudin-low, et présentait un index de Nottingham de 5,04. Un seul ganglion axillaire était atteint. Les récepteurs hormonaux étaient négatifs (ER négatifs, PR négatifs) et le statut HER2 était également négatif. Une chimiothérapie adjuvante a été administrée préalablement à la radiothérapie. \n\nLa radiothérapie a été réalisée sur un accélérateur linéaire, utilisant des faisceaux de photons de 6 MV. Le volume cible comprenait le lit tumoral initial, incluant le tissu mammaire restant, ainsi que le creux sus-claviculaire et axillaire homolatéraux. Le plan de traitement a été établi après un scanner dosimétrique réalisé le 15 juin 2019, permettant de définir précisément les volumes irradiés et les contraintes aux organes à risque. \n\nLa dose totale délivrée au lit tumoral était de 50 Gray (Gy) en 25 fractions, réparties sur 33 jours consécutifs, avec une dose par fraction de 1,5 Gy. La dose moyenne au poumon droit était maintenue inférieure à 20% de sa capacité fonctionnelle (V30 Gy < 20 %) et celle au cœur était limitée à moins de 4 Gy côté gauche (dose moyenne cardiaque < 4 Gy). \n\nDurant le traitement, Madame BLANCHET a présenté une réaction cutanée modérée (grade 2 selon CTCAE v5.0), caractérisée par une érythème et une desquamation, traitée par application locale de crème hydratante et corticostéroïdes topiques. Aucune toxicité plus sévère n'a été observée. \n\nA l'issue du traitement, son état général est stable, elle présente un score performance status OMS de 1, son poids est resté stable depuis le début du traitement. \n\nLes suites thérapeutiques comprennent une hormonothérapie adjuvante par tamoxifène pendant cinq ans, étant donné son statut pré-ménopausée. Une surveillance régulière sera assurée par mammographie annuelle et échographie mammaire tous les six mois, ainsi qu'un suivi biologique annuel. \n\nJe certifie avoir pris connaissance des résultats de la radiothérapie et confirme que toutes les contraintes dosimétriques ont été respectées. \n\nSigné : Dr. [Nom Prénom], Oncologue Radiothérapeute, le 28 septembre 2019.", "profile_text": "Civilité : Madame\nNom : BLANCHET Marcelle\nDate de naissance : 14/10/1970\nÂge au diagnostic : 48\nLatéralité : droit\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : III\nSous-type PAM50 : Claudin-low\nStatut ER : négatifs\nStatut PR : négatifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 18\nStade tumoral : non renseigné\nGanglions positifs : 1\nIndice de Nottingham : 5,04\nType de chirurgie : chirurgie conservatrice\nÉtat ménopausique : pré-ménopausée\nChimiothérapie : oui\nHormonothérapie : non"}, {"id": 30, "cr_text": "**Compte rendu de fin de traitement de radiothérapie**\n\nMadame VAILLANT Paulette, née le 23 avril 1964, âgée de 59 ans, a bénéficié d'une radiothérapie adjuvante suite à une mastectomie droite pour un carcinome canalaire infiltrant (IDC, ductal de type non spécifique (NST)) de 25 mm, grade SBR III, sous-type moléculaire basal-like (triple négatif), avec trois ganglions axillaires positifs, indice de Nottingham 5,05, stade II. La patiente était post-ménopausée lors du diagnostic. Une chimiothérapie adjuvante a été administrée préalablement à la radiothérapie. \n\nLa radiothérapie a été réalisée sur un accélérateur linéaire de particules de 6 MV, utilisant une technique de conformal radiotherapy (IMRT) pour optimiser la dose délivrée à la tumeur tout en épargnant les tissus sains avoisinants. Les volumes ciblés comprenaient le lit tumoral, les aires ganglionnaires axillaires et sus-claviculaires. \n\nLe plan de traitement a été établi après un scanner dosimétrique réalisé le 15 novembre 2023, permettant de définir précisément les zones à irradier. La dose totale prescrite était de 50 Gray (Gy) répartis en 25 fractions quotidiennes, administrées cinq fois par semaine, du 20 novembre 2023 au 15 décembre 2023, soit un étalement de 25 jours (cohérent avec 25 fractions x 1,4 jours environ).\n\nLes contraintes aux organes à risque ont été soigneusement respectées : la dose moyenne au poumon droit a été maintenue inférieure à 20 %, avec une dose maximale de 15 % (seuils normaux < 20 % et < 30 %). La dose moyenne au cœur a été limitée à moins de 4 Gy (seuil normal < 4 Gy côté gauche).\n\nAu cours du traitement, la patiente a présenté des effets secondaires principalement cutanés de grade 1 (érythème, sécheresse, démangeaisons) et fatigue modérée (grade 2 CTCAE v5.0), gérés par application topique de crèmes hydratantes et repos adapté. Aucune toxicité sévère (grade > 2) n'a été observée. Un contrôle de tolérance a été effectué à mi-parcours (après 12 fractions) et à la fin du traitement, avec évaluation clinique favorable (score OMS 0, aucun signe de complications aiguës ou tardives).\n\nÀ la fin du traitement, la patiente présente un état clinique stable, sans signes de récidive locale ou régionale. Elle bénéficie désormais d’une hormonothérapie adjuvante par anastrozole (pour son statut post-ménopausée) et d’un suivi régulier incluant mammographie annuelle et échographie mammaire controlatérale tous les six mois, ainsi que des bilans sanguins annuels pour surveiller la fonction hépatique et rénale. \n\nIl est prévu une consultation de suivi à 3 mois puis semestrielle pendant deux ans, suivie d'une surveillance annuelle prolongée. \n\nSigné électroniquement,\n\n[Nom Prénom] Oncologue Radiothérapeute\nDate : 23 décembre 2023", "profile_text": "Civilité : Madame\nNom : VAILLANT Paulette\nDate de naissance : 23/04/1964\nÂge au diagnostic : 59\nLatéralité : droit\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : III\nSous-type PAM50 : Basal-like (Triple Négatif)\nStatut ER : négatifs\nStatut PR : négatifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 25\nStade tumoral : II\nGanglions positifs : 3\nIndice de Nottingham : 5,05\nType de chirurgie : mastectomie\nÉtat ménopausique : post-ménopausée\nChimiothérapie : oui\nHormonothérapie : non"}, {"id": 31, "cr_text": "**Compte rendu de fin de traitement de radiothérapie**\n\nMadame RENAUD, née FERNANDEZ Agathe, âgée de 68 ans, a bénéficié d'une radiothérapie adjuvante suite à une chirurgie conservatrice pour un carcinome canalaire infiltrant (IDC, ductal de type non spécifique (NST)) du sein gauche, diagnostiqué le 15 mars 2020. La tumeur mesurait 20 mm, était classée stade I, avec 0 ganglion lymphatique métastatique, exprimait des récepteurs hormonaux négatifs (ER négatifs, PR négatifs), HER2 négatifs, et présentait un score de Nottingham de 4,04. \n\nLa décision de réaliser une radiothérapie adjuvante a été prise lors d'une réunion de concertation pluridisciplinaire, tenant compte de son âge, de sa situation ménopausique (post-ménopausée) et de l'absence d'indication à une hormonothérapie ou à une chimiothérapie. Un scanner dosimétrique a été réalisé le 20 avril 2020 afin de définir précisément les volumes cibles (tissu mammaire restant, aires ganglionnaires régionales, marges chirurgicales). La planification a été effectuée sur un accélérateur linéaire de dernière génération, utilisant une dose totale de 50 Gray (Gy) délivrée en 25 fractions sur 33 jours, avec une dose quotidienne de 1,5 Gy, respectant ainsi les contraintes aux organes à risque (V20 Gy poumon droit de 10 %, V30 Gy poumon droit de 5 %, dose moyenne cardiaque de 1,5 Gy, contrainte < 4 Gy côté gauche).\n\nAu cours du traitement, Madame RENAUD a présenté une réaction cutanée modérée (grade 2 selon CTCAE v5.0) nécessitant une adaptation temporaire de la dose, sans interruption significative du planning. Les autres effets secondaires notables ont inclus une fatigue légère (grade 1) et une irritation cutanée transitoire (grade 1). Aucune complication grave n'a été observée.\n\nÀ la fin du traitement, le 17 août 2020, l'examen clinique montre une bonne tolérance globale, avec un score fonctionnel OMS à 90 %. La peau présente une discrète hyperpigmentation et une sécheresse locale, attendue et gérée par application topique. La tolérance pulmonaire et cardiaque reste dans les limites acceptables (V20 Gy poumon droit 10 %, V30 Gy poumon droit 5 %, dose moyenne cardiaque 1,5 Gy, contrainte < 4 Gy côté gauche).\n\nEn termes de suivi, nous recommandons une surveillance régulière tous les 3 mois pendant 2 ans, puis semestrielle jusqu'à 5 ans, incluant imagerie mammaire (mammographie annuelle) et échographie abdominale. Une consultation oncologique sera programmée à 3 mois pour évaluer la réponse complète locale et ajuster si nécessaire l'hormonothérapie (en l'absence d'indication actuelle, aucune hormonothérapie n'est prescrite, mais cette option pourrait être revue en fonction de l'évolution).\n\nJe certifie avoir examiné Mme RENAUD, née FERNANDEZ Agathe, le 17 août 2020, et confirme que le traitement de radiothérapie a été mené conformément aux standards actuels, sans complications majeures. Je reste disponible pour toutes questions ou consultations ultérieures.\n\nDr [Nom Prénom], Oncologue Radiothérapeute\n\n[Signature]", "profile_text": "Civilité : Madame\nNom : RENAUD, née FERNANDEZ Agathe\nDate de naissance : 04/08/1952\nÂge au diagnostic : 68\nLatéralité : gauche\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : III\nSous-type PAM50 : Basal-like (Triple Négatif)\nStatut ER : négatifs\nStatut PR : négatifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 20\nStade tumoral : I\nGanglions positifs : 0\nIndice de Nottingham : 4,04\nType de chirurgie : chirurgie conservatrice\nÉtat ménopausique : post-ménopausée\nChimiothérapie : non\nHormonothérapie : non"}, {"id": 32, "cr_text": "**Compte rendu de fin de traitement de radiothérapie mammaire**\n\nMadame BÈGUE Antoinette, née le 08 septembre 1946, âgée de 73 ans, a bénéficié d'une radiothérapie adjuvante suite à son diagnostic de carcinome canalaire infiltrant (IDC, ductal de type non spécifique (NST)) du sein gauche, de grade SBR I, sous-type moléculaire Claudin-low, exprimant les récepteurs hormonaux (positifs pour les récepteurs aux œstrogènes et à la progestérone) et négatif pour le récepteur HER2. La tumeur mesurait 11 mm, était localisée au stade I, sans atteinte ganglionnaire (0 ganglion positif). L'indice pronostique de Nottingham était de 2,02. Une chirurgie conservatrice avait été réalisée précédemment, et une hormonothérapie adjuvante a été initiée en raison de l'expression positive des récepteurs hormonaux, consistant en un traitement par anastrozole (Arimidex®) pendant cinq ans. Aucune chimiothérapie n'a été administrée.\n\nLa radiothérapie a été planifiée après une réunion de concertation pluridisciplinaire, incluant un scanner dosimétrique réalisé le 12 novembre 2019, permettant de définir précisément les volumes cibles (tissu mammaire restant, aires ganglionnaires axillaires, ainsi que les marges chirurgicales). Le traitement a été effectué sur un accélérateur linéaire, utilisant des faisceaux de photons de 6 MV, avec une dose totale de 50 Gy délivrée en 25 fractions sur 33 jours (du 16 décembre 2019 au 23 janvier 2020, avec des séances du lundi au vendredi, pause week-end comprise).\n\nLes contraintes aux organes à risque ont été soigneusement respectées : la dose moyenne au poumon droit a été maintenue inférieure à 30 %, la dose V30 Gy à moins de 20 %. La dose moyenne cardiaque a été limitée à moins de 4 Gy côté gauche. Les paramètres techniques ont été ajustés pour minimiser l'exposition du poumon droit et du cœur, notamment grâce à une technique d'arc thérapeutique optimisée.\n\nAu cours du traitement, Madame BÈGUE a présenté une réaction cutanée modérée (grade 2 CTCAE v5.0) se manifestant par une érythème et une sécheresse cutanée, gérée par application topique de crèmes émollientes et hydratantes. Elle n’a signalé aucune douleur importante, ni fatigue excessive. Un contrôle de poids a été effectué à chaque séance, montrant une stabilité pondérale. À la fin du traitement, elle présentait un score fonctionnel OMS de 1, sans toxicité aiguë significative.\n\nÀ l'issue de cette radiothérapie adjuvante, le bilan de fin de traitement montre une bonne tolérance globale, avec une peau légèrement hyperpigmentée mais cicatrisée, sans signe de fibrose ou de rétraction tissulaire majeure. La dose totale reçue était de 50 Gy, répartie en 25 fractions, avec une dose moyenne de 2,00 Gy par fraction et une dose maximale de 2,5 Gy. Les objectifs de couverture tumorale et de protection des organes critiques ont été atteints.\n\nEn termes de suites, nous recommandons une surveillance régulière tous les six mois durant les deux premières années, puis annuelle, comprenant une mammographie, une échographie mammaire, un dosage sanguin des marqueurs tumoraux (CEA, CA 15-3) et une visite clinique. L’hormonothérapie par anastrozole sera poursuivie jusqu’à cinq ans. Nous conseillons également une surveillance cardiovasculaire adaptée, tenant compte de l’âge et de l’exposition cardiaque lors de la radiothérapie.\n\nJe certifie avoir examiné Mme BÈGUE Antoinette et confirmé la réalisation complète de sa radiothérapie adjuvante selon les critères établis. Je reste disponible pour tout complément d’information ou suivi ultérieur.\n\nSigné : Dr [Nom Prénom], Oncologue Radiothérapeute, le 19 janvier 2020.", "profile_text": "Civilité : Madame\nNom : BÈGUE Antoinette\nDate de naissance : 08/09/1946\nÂge au diagnostic : 73\nLatéralité : gauche\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : I\nSous-type PAM50 : Claudin-low\nStatut ER : positifs\nStatut PR : positifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 11\nStade tumoral : I\nGanglions positifs : 0\nIndice de Nottingham : 2,02\nType de chirurgie : chirurgie conservatrice\nÉtat ménopausique : post-ménopausée\nChimiothérapie : non\nHormonothérapie : oui"}, {"id": 33, "cr_text": "**Compte rendu de fin de traitement de radiothérapie**\n\nMadame LOISEAU, née LEBRUN Caroline, âgée de 79 ans, a bénéficié d'une radiothérapie adjuvante suite à son diagnostic de carcinome canalaire infiltrant (IDC, ductal de type non spécifique (NST)) du sein droit, de 10 mm, stade I, grade SBR I, sous-type moléculaire Luminal A, exprimant les récepteurs hormonaux (ER positifs) mais non les récepteurs progestérone (PR négatifs) et sans surexpression HER2. La patiente a été opérée par chirurgie conservatrice. Une réunion de concertation pluridisciplinaire a décidé de proposer une radiothérapie adjuvante sur le lit tumoral et les aires ganglionnaires axillaires régionales. Elle était ménopausée depuis plusieurs années, ce qui a orienté le choix vers une hormonothérapie adjuvante par anastrozole, administrée pendant cinq ans. \n\nLa planification de la radiothérapie a été réalisée après un scanner dosimétrique (CTDI) permettant de définir précisément les volumes cibles (tissu mammaire restant, aires ganglionnaires axillaires et sus-claviculaires). La dose totale délivrée sur le lit tumoral a été de 50 Gray (Gy) en 25 fractions, réparties sur 33 jours consécutifs (du 01/11/2023 au 22/12/2023), avec une dose quotidienne de 1,5 Gy. Les contraintes aux organes à risque ont été respectées : V20 Gy poumon droit de 10 %, V30 Gy poumon droit de 5 % (seuils normaux respectivement < 30 % et < 20 %) et dose moyenne cardiaque de 1,2 Gy (limite inférieure à 4 Gy côté gauche). \n\nDurant le traitement, la tolérance a été globalement bonne. Des effets secondaires légers à modérés ont été notés, notamment une érythème cutané grade 2 (CTCAE v5.0) traité par application topique de crème hydratante et corticostéroïdes topiques. Aucune toxicité sévère (grade 3 ou plus) n'a été observée. À la fin du traitement, l'état général de Mme LOISEAU est satisfaisant, avec un score fonctionnel OMS à 90 %. Son poids est stable, sans perte significative.\n\nÀ l'issue de cette radiothérapie adjuvante, nous recommandons la poursuite de l'hormonothérapie par anastrozole pendant encore quatre ans (jusqu'en 2028) ainsi que des visites de surveillance régulières tous les six mois durant deux ans, puis annuellement. Un suivi mammographique sera effectué chaque année. \n\nJe reste à disposition pour tout complément d'information.\n\n**Signé**\nDr [Nom Prénom], Oncologue Radiothérapeute\n\n[Date] : 21 décembre 2023", "profile_text": "Civilité : Madame\nNom : LOISEAU, née LEBRUN Caroline\nDate de naissance : 08/01/1937\nÂge au diagnostic : 79\nLatéralité : droit\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : I\nSous-type PAM50 : Luminal A\nStatut ER : positifs\nStatut PR : négatifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 10\nStade tumoral : I\nGanglions positifs : 0\nIndice de Nottingham : 2,02\nType de chirurgie : chirurgie conservatrice\nÉtat ménopausique : post-ménopausée\nChimiothérapie : non\nHormonothérapie : oui"}, {"id": 34, "cr_text": "Voici le compte rendu de fin de traitement de radiothérapie pour Madame JOLY Cécile, née le 09 avril 1958, âgée de 61 ans, ayant bénéficié d'une radiothérapie adjuvante suite à une chirurgie conservatrice pour un carcinome lobulaire infiltrant (ILC, lobulaire) du sein droit, stade II, grade SBR II, sous-type moléculaire Luminal A, exprimant les récepteurs hormonaux (ER positifs) et n'exprimant pas les récepteurs progestérone (PR négatifs), HER2 négatifs, avec deux ganglions axillaires positifs, un indice de Nottingham de 4,03. La patiente a été traitée par radiothérapie externe conformationnelle à l'aide d'un accélérateur linéaire, après une préparation incluant un scanner dosimétrique permettant la planification précise des volumes cibles (tissu mammaire restant, aires ganglionnaires régionales).\n\nLa radiothérapie a été réalisée sur une période de 25 fractions, étalées sur environ 33 jours calendaires, avec une dose totale délivrée de 50 Gray (Gy) au volume cible, répartie en 2,5 Gy par fraction, atteignant une dose moyenne de 2,0 Gy par séance. Les contraintes aux organes à risque ont été respectées : la dose moyenne au poumon droit a été maintenue inférieure à 20 %, la dose moyenne au cœur côté gauche a été limitée à moins de 4 Gy. Aucune toxicité aiguë sévère (grade > 2 selon CTCAE) n'a été observée durant le traitement. Des érythèmes cutanés modérés (grade 1) et une fatigue légère (grade 1) ont été notés, gérés par des soins locaux et des conseils de repos. À la fin du traitement, la patiente présente un score fonctionnel OMS de 1, son poids stable, et aucun signe de complications tardives notables. \n\nMadame JOLY bénéficie actuellement d'une hormonothérapie adjuvante par anastrozole, conformément à sa situation post-ménopausée et au sous-type moléculaire Luminal A. Aucun traitement anti-HER2 n'est indiqué en l'absence de surexpression de HER2. Une surveillance régulière sera poursuivie, comprenant des mammographies annuelles, des échographies mammaires semestrielles, ainsi que des bilans sanguins pour surveiller la fonction hépatique et rénale. Un rendez-vous de suivi est prévu six mois après la fin de la radiothérapie pour évaluer la réponse globale au traitement et ajuster si nécessaire la stratégie thérapeutique.\n\nCe compte rendu est établi le 17 février 2020 par [signature numérique du médecin].\n\n**Remarque :** Ce document est destiné à être intégré dans le dossier médical de Mme JOLY Cécile, et doit être lu en conjonction avec ses autres documents médicaux.", "profile_text": "Civilité : Madame\nNom : JOLY Cécile\nDate de naissance : 09/04/1958\nÂge au diagnostic : 61\nLatéralité : droit\nType histologique : carcinome lobulaire infiltrant\nCode OncoTree : ILC\nSous-type histologique : lobulaire\nGrade SBR : II\nSous-type PAM50 : Luminal A\nStatut ER : positifs\nStatut PR : négatifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 16\nStade tumoral : II\nGanglions positifs : 2\nIndice de Nottingham : 4,03\nType de chirurgie : chirurgie conservatrice\nÉtat ménopausique : post-ménopausée\nChimiothérapie : non\nHormonothérapie : oui"}, {"id": 35, "cr_text": "**Compte rendu de fin de traitement de radiothérapie mammaire**\n\nMadame GRENIER Nath, née le 19 octobre 1957, âgée de 65 ans, a bénéficié d'une radiothérapie adjuvante suite à son diagnostic de carcinome canalaire infiltrant (IDC, ductal de type non spécifique (NST)) du sein droit, de grade SBR II, sous-type moléculaire HER2-enrichi, exprimant les récepteurs hormonaux (ER et PR positifs) et HER2 positifs. La tumeur mesurait 22 mm et était associée à 1 ganglion axillaire positif. L'indice de Nottingham était de 4,04. Une chirurgie conservatrice avait été réalisée préalablement. Madame Grenier est en situation post-ménopausée. Elle a reçu une chimiothérapie adjuvante (FEC100 suivi d'un taxane) et une hormonothérapie (tamoxifène) en accord avec la réunion de concertation pluridisciplinaire.\n\nLa planification de la radiothérapie a été effectuée sur la base d’un scanner dosimétrique réalisé le 15 janvier 2023, permettant de définir les volumes cibles (seins et aires ganglionnaires régionales) ainsi que les organes à risque (poumons et cœur). Les paramètres techniques ont été ajustés pour délivrer une dose totale de 50 Gy en 25 fractions, réparties sur 33 séances (du 10 février au 15 mars 2023, étalement de 25 jours, incluant les pauses week-ends). La dose moyenne par fraction était de 1,95 Gy, avec une dose maximale de 2,2 Gy au niveau du sein. Les contraintes aux organes à risque étaient respectées : V20 Gy poumon droit de 15,5 % (norme < 30 %) et dose moyenne cardiaque de 1,8 Gy (norme < 4 Gy).\n\nDurant le traitement, Mme Grenier a présenté des effets secondaires légers à modérés, principalement une fatigue (grade 1 CTCAE) et une érythème cutané (grade 2 CTCAE), gérés par des soins locaux et une adaptation temporaire du planning des séances. Aucune complication majeure n’a été observée. À la fin du traitement, le score fonctionnel OMS est resté inchangé (0), son poids stable (60 kg) et aucune toxicité résiduelle significative n’était présente.\n\nEn conclusion, la radiothérapie adjuvante a été complétée sans incident majeur, avec une bonne tolérance globale. Les objectifs thérapeutiques ont été atteints. La poursuite de l’hormonothérapie (tamoxifène) pendant cinq ans est recommandée, ainsi qu’une surveillance régulière (clinique, mammographie annuelle, IRM tous les deux ans) pour détecter d’éventuelles récidives locales ou métastatiques. Un suivi rapproché sera assuré par notre équipe multidisciplinaire.\n\nJe certifie avoir rédigé ce compte rendu en tant qu’oncologue radiothérapeute responsable du traitement.\n\n**Signature**\nDr [Nom Prénom], Oncologue Radiothérapeute\n[Date] : 24/03/2023", "profile_text": "Civilité : Madame\nNom : GRENIER Nath\nDate de naissance : 19/10/1957\nÂge au diagnostic : 65\nLatéralité : droit\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : II\nSous-type PAM50 : HER2-enrichi\nStatut ER : positifs\nStatut PR : positifs\nStatut HER2 : positifs\nTaille tumorale (mm) : 22\nStade tumoral : non renseigné\nGanglions positifs : 1\nIndice de Nottingham : 4,04\nType de chirurgie : chirurgie conservatrice\nÉtat ménopausique : post-ménopausée\nChimiothérapie : oui\nHormonothérapie : oui"}, {"id": 36, "cr_text": "Voici le compte rendu de fin de traitement de radiothérapie pour Mme SAUVAGE Audrey, née le 04 février 1957, âgée de 65 ans, ayant subi une mastectomie pour un carcinome lobulaire infiltrant (ILC, lobulaire) du sein gauche, grade SBR III, sous-type moléculaire Luminal B, avec récepteurs hormonaux positifs (ER), récepteurs progestérone négatifs (PR), HER2 négatifs, taille tumorale de 27 mm, stade II, 7 ganglions axillaires positifs, indice de Nottingham 6,05. La patiente a bénéficié d'une chimiothérapie adjuvante et d'une hormonothérapie post-mastectomie, en accord avec la décision issue de la réunion de concertation pluridisciplinaire du 07 juillet 2022.\n\nLa radiothérapie a été initiée après un scanner dosimétrique réalisé le 15 août 2022, permettant la planification précise des volumes cibles. Le traitement a été délivré sur un accélérateur linéaire, utilisant une énergie de 6 MV, avec une technique de conformal radiotherapy (CRT). Les volumes irradiés comprenaient le lit tumoral initial, incluant le segment médial du sein gauche, ainsi que les aires ganglionnaires régionales (axillaire homolatérale, sus-claviculaires et mammaires internes). La dose totale prescrite était de 50 Gray (Gy) en 25 fractions, réparties sur 33 séances (du 22 septembre 2022 au 17 novembre 2022, avec des pauses hebdomadaires le week-end).\n\nLes contraintes dosimétriques ont été respectées, notamment pour les organes à risque. La dose moyenne au poumon droit était de 1,8 Gy (contre une limite recommandée inférieure à 30 %) et la dose moyenne au cœur était de 1,2 Gy (limite inférieure à 4 Gy côté gauche). Aucune toxicité sévère (grade ≥ 3 selon CTCAE v5.0) n'a été observée durant le traitement. Des érythèmes cutanés modérés (grade 1) ont été notés, traités par application topique de crème hydratante et corticoïde local léger. Une fatigue légère a également été rapportée, gérée par ajustement des horaires de repos et conseils diététiques.\n\nAu bilan de fin de traitement, le score fonctionnel OMS était de 1, le poids stable à 60 kg. Aucun signe de récidive locale ou régionale n'était détectable. La tolérance générale était bonne, avec une qualité de vie acceptable malgré quelques désagréments transitoires liés à la radiothérapie.\n\nEn termes de suites thérapeutiques, Mme SAUVAGE continuera son hormonothérapie (tamoxifène, 20 mg/jour pendant cinq ans) et sera suivie régulièrement pour surveillance clinique et biologique tous les six mois pendant deux ans, puis annuellement. Un contrôle mammographique annuel sera effectué, complété par une échographie mammaire controlatérale et une IRM mammaire bilatérale à 2 ans post-radiothérapie.\n\nJe certifie avoir examiné cette patiente et rédigé ce compte rendu le 07 juillet 2022.\n\nDr [Nom Prénom], Oncologue Radiothérapeute\n\n[Signature]", "profile_text": "Civilité : Madame\nNom : SAUVAGE Audrey\nDate de naissance : 04/02/1957\nÂge au diagnostic : 65\nLatéralité : gauche\nType histologique : carcinome lobulaire infiltrant\nCode OncoTree : ILC\nSous-type histologique : lobulaire\nGrade SBR : III\nSous-type PAM50 : Luminal B\nStatut ER : positifs\nStatut PR : négatifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 27\nStade tumoral : II\nGanglions positifs : 7\nIndice de Nottingham : 6,05\nType de chirurgie : mastectomie\nÉtat ménopausique : post-ménopausée\nChimiothérapie : oui\nHormonothérapie : oui"}, {"id": 37, "cr_text": "Madame RENARD Emmanuelle, née le 02 décembre 1954, âgée de 66 ans, a bénéficié d'une radiothérapie adjuvante suite à sa mastectomie gauche pour un carcinome mixte ductal et lobulaire infiltrant (MDLC) mixte, grade SBR III, sous-type moléculaire Normal-like, exprimant les récepteurs hormonaux (positifs pour les récepteurs aux œstrogènes et à la progestérone) et négatif pour le récepteur HER2. La tumeur mesurait 55 millimètres et aucun ganglion axillaire n'était atteint lors de l'examen histopathologique. L'indice de Nottingham était de 4,11. \n\nLa décision de réaliser cette radiothérapie a été prise lors d'une réunion de concertation pluridisciplinaire, tenant compte de son état ménopausique et du fait que la chimiothérapie n'a pas été jugée nécessaire. Un scanner dosimétrique a été réalisé afin de planifier précisément le volume cible incluant le lit tumoral, les aires ganglionnaires régionales (axillaires, mammaires internes et externes) ainsi que les marges chirurgicales. La dose totale prescrite était de 50 Gray (Gy) délivrée en 25 fractions sur 33 jours, avec une dose quotidienne de 1,5 Gy, utilisant un faisceau de photons de 6 MV. Les contraintes aux organes à risque ont été respectées : la dose moyenne au poumon droit était de 10,5% de la dose V20 (seuil maximal autorisé < 30%), et celle au cœur était inférieure à 2 Gy (seuil maximal autorisé < 4 Gy).\n\nDurant le traitement, Madame RENARD a présenté quelques effets secondaires légers, notamment une fatigue modérée (grade 1 CTCAE) et une érythème cutané localisé (grade 2 CTCAE), traités efficacement par application topique de crèmes émollientes et hydratantes. Aucune complication sévère n'est survenue. À la fin du traitement, elle présentait un score fonctionnel OMS de 1, avec une perte de poids de 2 kg depuis le début du traitement. \n\nÀ l'issue de la radiothérapie, aucune toxicité aiguë majeure n'est observée. Les recommandations de suivi comprennent une consultation de contrôle tous les trois mois pendant deux ans, puis tous les six mois jusqu'à cinq ans, avec imagerie mammaire annuelle. Une hormonothérapie adjuvante par anastrozole sera poursuivie pendant cinq ans, conformément aux recommandations pour son profil hormonal. \n\nEn conclusion, la radiothérapie adjuvante s'est déroulée sans complications majeures, et la patiente est maintenant orientée vers une surveillance régulière pour assurer le suivi optimal de son évolution post-thérapeutique. \n\nSigné,\n\n[Nom Prénom]\nOncologue Radiothérapeute", "profile_text": "Civilité : Madame\nNom : RENARD Emmanuelle\nDate de naissance : 02/12/1954\nÂge au diagnostic : 66\nLatéralité : gauche\nType histologique : carcinome mixte ductal et lobulaire infiltrant\nCode OncoTree : MDLC\nSous-type histologique : mixte\nGrade SBR : III\nSous-type PAM50 : Normal-like\nStatut ER : positifs\nStatut PR : positifs\nStatut HER2 : négatifs\nTaille tumorale (mm) : 55\nStade tumoral : non renseigné\nGanglions positifs : 0\nIndice de Nottingham : 4,11\nType de chirurgie : mastectomie\nÉtat ménopausique : post-ménopausée\nChimiothérapie : non\nHormonothérapie : oui"}, {"id": 38, "cr_text": "Madame MANON NORMAND, née le 11 décembre 1957, âgée de 58 ans, a bénéficié d'une radiothérapie adjuvante après une mastectomie droite pour un carcinome canalaire infiltrant (IDC, ductal de type non spécifique (NST)) de grade SBR III, sous-type moléculaire Basal-like (Triple Négatif), avec 14 ganglions axillaires envahis, récepteurs hormonaux négatifs (ER négatifs, PR négatifs) et surexpression HER2 positive. La patiente était en état post-ménopausique lors de son diagnostic. Une chimiothérapie adjuvante a été administrée préalablement à la radiothérapie, conformément aux recommandations de la réunion de concertation pluridisciplinaire.\n\nLa planification de la radiothérapie a été réalisée sur la base d’un scanner dosimétrique effectué le 15 novembre 2023, permettant de définir précisément les volumes cibles (tissu mammaire restant, aires ganglionnaires régionales, notamment l’aile interne du creux sus-claviculaire et axillaire homolatéraux) et les organes à risque (poumon droit, cœur gauche). La dose totale prescrite était de 50 Gray (Gy) délivrée en 25 fractions, à raison de 2 Gy par séance, sur un accélérateur linéaire de 6 MV, avec une technique de modulation d’intensité (IMRT) pour optimiser la protection des tissus sains. Les contraintes dosimétriques étaient respectées : V20 Gy poumon droit < 30 %, V30 Gy poumon droit < 20 %, dose moyenne cardiaque < 4 Gy côté gauche. La dose maximale autorisée au niveau du poumon droit était de 30 Gy, celle du cœur gauche de 3,5 Gy.\n\nDurant le traitement, la tolérance globale a été bonne, avec quelques épisodes de fatigue modérée (grade 1 CTCAE) et de dermite cutanée légère (grade 2 CTCAE) au niveau du site irradié, traités par application topique de crème hydratante et corticoïdes locaux. Aucune complication sévère n'a été observée. Un contrôle biologique a montré une numération sanguine stable pendant toute la période de traitement.\n\nAu terme des 25 fractions, le score fonctionnel OMS est resté inchangé, à 90 %. La patiente présente actuellement une peau légèrement érythémateuse et sensible au toucher, sans signe d’ulcère ou de fibrose importante. La cicatrice chirurgicale est propre, sans signe infectieux. Les examens de fin de traitement, incluant une échographie mammaire controlatérale et un dosage des marqueurs tumoraux, ont été réalisés le 13 janvier 2024, sans anomalies notables.\n\nEn termes de suites, nous recommandons une surveillance régulière tous les trois mois durant deux ans, puis semestrielle ensuite, avec mammographie annuelle et échographie mammaire bilatérale. La poursuite de l’hormonothérapie adjuvante (par exemple, anastrozole) sera discutée lors de la prochaine consultation multidisciplinaire, étant donné que la patiente est en post-ménopause et que le sous-type moléculaire est Triple-Négatif. Nous proposons également une imagerie thoracique annuelle pour surveiller les poumons et le cœur, ainsi qu’une visite annuelle chez le cardiologue pour évaluer la fonction cardiaque.\n\nNous tenons à remercier Mme Normand pour sa participation active et sa patience tout au long du traitement. Elle peut reprendre ses activités habituelles progressivement, en évitant les efforts physiques intenses pendant encore quelques semaines.\n\nPour information, le traitement adjuvant par trastuzumab (Herceptin®) a été initié parallèlement à la chimiothérapie, en raison de la positivité HER2, et se poursuivra pendant 12 mois supplémentaires.\n\nSigné,\n\nDr [Nom Prénom], Oncologue Radiothérapeute\n\n[Signature]", "profile_text": "Civilité : Madame\nNom : NORMAND Manon\nDate de naissance : 11/12/1957\nÂge au diagnostic : 58\nLatéralité : droit\nType histologique : carcinome canalaire infiltrant\nCode OncoTree : IDC\nSous-type histologique : ductal de type non spécifique (NST)\nGrade SBR : III\nSous-type PAM50 : Basal-like (Triple Négatif)\nStatut ER : négatifs\nStatut PR : négatifs\nStatut HER2 : positifs\nTaille tumorale (mm) : 55\nStade tumoral : non renseigné\nGanglions positifs : 14\nIndice de Nottingham : 6,11\nType de chirurgie : mastectomie\nÉtat ménopausique : post-ménopausée\nChimiothérapie : oui\nHormonothérapie : non"}, {"id": 39, "cr_text": "Madame FLEURY, née DENIS Camille, âgée de 53 ans, a bénéficié d'une radiothérapie adjuvante suite à une chirurgie conservatrice pour un carcinome mammaire infiltrant NOS de type basal-like (triple négatif), diagnostiqué sur le sein droit. La tumeur mesurait 15 mm, était classée au stade I (T1N0M0) avec un score de l'indice pronostique de Nottingham de 4,03. Les examens biologiques ont confirmé que la tumeur exprimait les récepteurs HER2 (HER2+), était négative pour les récepteurs hormonaux (ER-, PR-) et que la patiente était en état post-ménopausique. \n\nLa décision de réaliser une radiothérapie adjuvante a été prise lors d'une réunion de concertation pluridisciplinaire, tenant compte du sous-type moléculaire basal-like, du stade précoce mais agressif de la maladie et de l'absence d'indication à une hormonothérapie (en raison de l'absence de récepteurs hormonaux positifs) et à une chimiothérapie (en raison du stade précoce et de l'absence de facteurs de mauvais pronostic majeurs).\n\nLa planification de la radiothérapie a été réalisée grâce à un scanner dosimétrique effectué le 15 mars 2018, permettant de définir précisément les volumes cibles (tissu mammaire restant, région axillaire droite, marges chirurgicales) et les organes à risque (poumon droit, cœur gauche). La dose totale prescrite était de 50 Gray (Gy) délivrée en 25 fractions sur 33 jours (du 20 mars au 25 avril 2018), avec une dose quotidienne de 1,5 Gy. La technique employée était une irradiation conformationnelle 3D utilisant un accélérateur linéaire de photons de 6 MV, visant à minimiser l'exposition des tissus sains adjacents. \n\nDurant le traitement, la tolérance générale a été bonne, avec des effets secondaires principalement limités à une fatigue modérée (grade 1 CTCAE) et une légère érythème cutané (grade 2 CTCAE) localisés au site irradié, gérés par application topique de crèmes émollientes. Aucune complication majeure n'a été observée, notamment aucune atteinte pulmonaire significative (V20 Gy poumon droit < 10 %, V30 Gy < 5 %) ou cardiaque (dose moyenne cœur gauche < 2 Gy). \n\nÀ la fin du traitement, le bilan clinique montre un score fonctionnel OMS de 1, aucun signe de récidive locale ou régionale, et une stabilisation pondérale. Les toxicités aiguës se sont résolues progressivement, laissant place à une peau légèrement hyperpigmentée mais cicatrisée. \n\nLes suites thérapeutiques recommandées comprennent une surveillance régulière (clinique tous les 3 mois pendant 2 ans puis annuelle) avec mammographie annuelle, échographie mammaire semestrielle et IRM mammaire bisannuelle, ainsi qu'un suivi oncologique complet incluant une imagerie thoracique annuelle. Une thérapie anti-HER2 (trastuzumab) n'a pas été initiée car le statut HER2+ n'est pas associé à un traitement adjuvant systématique dans cette situation clinique. \n\nEn conclusion, la radiothérapie adjuvante a été bien tolérée et semble avoir atteint ses objectifs, sans complications majeures. La patiente sera suivie régulièrement pour surveiller l'évolution à long terme. \n\nPour information, Madame FLEURY, née DENIS Camille, 15/09/1964, 53 ans, sein droit, carcinome mammaire infiltrant NOS (BRCA), grade SBR III, sous-type moléculaire Basal-like (Triple Negatif), ER négatifs, PR négatifs, HER2 positifs, 15 mm, stade I, 0 ganglion(s) positif(s), indice de Nottingham 4,03, chirurgie conservatrice, post-ménopausée.\n\nSigné : Dr [Nom Prénom], Oncologue Radiothérapeute, le 07/04/2018.", "profile_text": "Civilité : Madame\nNom : FLEURY, née DENIS Camille\nDate de naissance : 15/09/1964\nÂge au diagnostic : 53\nLatéralité : droit\nType histologique : carcino
